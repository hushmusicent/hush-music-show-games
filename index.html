<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hush Music Show Games</title>
<style>
:root{
  --bg:#0d1420; --bg2:#131c2e; --card:#1a2540; --card2:#223052;
  --gold:#cf8f3f; --gold2:#eab676; --green:#2ecc71; --red:#e74c3c;
  --blue:#3498db; --text:#f2f5fa; --muted:#8b98b8; --line:#2c3a5e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}
header{position:sticky; top:0; z-index:50; background:linear-gradient(180deg,#182238,#101828); border-bottom:2px solid var(--gold); padding:8px 12px; display:flex; align-items:center; gap:8px;}
header .logo{font-size:20px; font-weight:800; color:var(--gold); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pill{background:var(--card2); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-weight:700; font-size:14px; white-space:nowrap;}
.pill.gold{color:var(--gold2); border-color:var(--gold);}
.iconbtn{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:12px; font-size:18px; padding:6px 10px; cursor:pointer;}
.iconbtn.off{opacity:.45;}
main{padding:12px 12px 90px; max-width:640px; margin:0 auto;}
nav.bottom{position:fixed; bottom:0; left:0; right:0; background:#101828; border-top:1px solid var(--line); display:flex; z-index:50;}
nav.bottom button{flex:1; background:none; border:none; color:var(--muted); font-size:11px; padding:10px 4px 12px; cursor:pointer;}
nav.bottom button .e{font-size:22px; display:block;}
nav.bottom button.active{color:var(--gold);}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;}
.btn{display:block; width:100%; background:linear-gradient(180deg,var(--gold),#a66a24); color:#231703; border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:800; cursor:pointer; margin:8px 0;}
.btn:disabled{opacity:.4;}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--line);}
.btn.small{padding:8px 10px; font-size:14px; width:auto; display:inline-block; margin:4px;}
.btn.danger{background:var(--red); color:#fff;}
input,select{width:100%; background:var(--bg2); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:12px; font-size:16px; margin:6px 0;}
label{font-size:13px; color:var(--muted);}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.gamecard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 8px; text-align:center; cursor:pointer;}
.gamecard .e{font-size:40px;}
.gamecard .n{font-weight:700; margin-top:6px; font-size:14px;}
.gamecard .t{font-size:11px; color:var(--muted);}
h2{color:var(--gold); margin:8px 0 12px;}
h3{margin:10px 0 6px;}
.msg{background:var(--bg2); border-left:3px solid var(--gold); padding:8px 10px; border-radius:0 10px 10px 0; margin:6px 0; font-size:14px;}
.msg .who{color:var(--gold); font-weight:700; font-size:12px;}
.err{color:var(--red); font-size:14px; margin:6px 0;}
.ok{color:var(--green); font-size:14px; margin:6px 0;}
.row{display:flex; gap:8px; align-items:center;}
.row .grow{flex:1;}
table.lb{width:100%; border-collapse:collapse; font-size:14px;}
table.lb td,table.lb th{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left;}
table.lb tr.me td{color:var(--gold); font-weight:800;}
.betrow{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
.betrow button{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer;}
.betrow button.sel{border-color:var(--gold); color:var(--gold2);}
.chatbox{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:8px; max-height:180px; overflow-y:auto; margin:8px 0;}
.modal{position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal .card{max-width:420px; width:100%; max-height:85vh; overflow-y:auto;}
.hidden{display:none !important;}
.center{text-align:center;} .muted{color:var(--muted); font-size:13px;}
.big{font-size:26px; font-weight:800;}
.status{font-size:15px; margin:8px 0; min-height:22px; font-weight:600;}
.turn-banner{background:rgba(245,185,66,.15); border:1px solid var(--gold); color:var(--gold2); border-radius:10px; padding:8px; text-align:center; font-weight:700; margin:8px 0;}
.voicebar{background:#1d2b1d; border:1px solid var(--green); border-radius:12px; padding:8px; margin:8px 0; font-size:14px;}
.codechip{display:inline-block; background:var(--bg2); border:1px dashed var(--gold); color:var(--gold2); border-radius:10px; padding:6px 14px; font-size:20px; font-weight:800; letter-spacing:4px;}
.kbd{font-size:12px; color:var(--muted);}
/* ===== Family Feud show board ===== */
.ff-q{color:#fff;text-align:center;font-weight:800;margin:2px 0 8px;font-size:16px;text-shadow:0 2px 4px #000;}
.ff-board{position:relative;background:#07070f;border:6px solid #26262e;border-radius:190px 190px 14px 14px;padding:34px 14px 14px;margin:4px 0 10px;box-shadow:0 0 0 3px #8a6a1f,0 0 24px rgba(0,0,0,.8);}
.ff-score{display:block;width:126px;margin:0 auto 10px;background:linear-gradient(#123a9e,#081a5e);border:3px solid #d9d9d9;outline:1px solid #666;border-radius:8px;color:#fff;font:700 42px/1.25 "Courier New",monospace;text-align:center;text-shadow:0 0 12px #7da2ff;box-shadow:inset 0 0 20px #000,0 0 12px rgba(90,130,255,.55);}
.ff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ff-grid>div{display:grid;gap:8px;align-content:start;}
.ff-slot{background:linear-gradient(#3373d4,#17408c);border:3px solid #dcdcdc;outline:1px solid #6f6f6f;border-radius:4px;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;color:#fff;font-weight:800;font-size:14px;box-shadow:inset 0 0 14px rgba(0,0,0,.6);text-shadow:0 1px 3px #000;}
.ff-slot .pts{color:#ffe14d;font-family:"Courier New",monospace;font-size:19px;text-shadow:0 0 9px rgba(255,225,77,.9);}
.ff-strikes{min-height:30px;text-align:center;font-size:24px;margin-top:8px;letter-spacing:6px;}
.ff-count{text-align:center;color:#ffe14d;font-weight:800;letter-spacing:3px;font-size:13px;margin:0 0 8px;text-shadow:0 0 8px rgba(255,225,77,.6);}
.ff-pds{display:flex;gap:10px;margin:10px 0 4px;}
.ff-pd{flex:1;background:linear-gradient(#f5c542,#d99a1f);border:4px solid #3a2c10;border-radius:14px;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.5);}
.ff-buzzer{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a80,#d32f2f 70%);border:3px solid #5d1010;box-shadow:0 2px 5px rgba(0,0,0,.5);margin:0 auto 6px;}
.ff-pd-screen{background:#0a0a0a;border:3px solid #3a2c10;border-radius:8px;padding:8px 4px;text-align:center;}
.ff-pd-fam{color:#4dd0ff;font-weight:900;font-size:12px;letter-spacing:1px;margin-bottom:3px;}
.ff-pd-score{color:#ff9d2e;font-family:"Courier New",monospace;font-weight:900;font-size:19px;}
/* ===== The Chase tower ===== */
.ch-wrap{display:flex;gap:10px;align-items:flex-start;margin-top:4px;}
.ch-tower{flex:0 0 42%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:#050510;border:2px solid #1c2f52;border-radius:10px;}
.ch-step{height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;background:linear-gradient(#2a3f66,#16233d);border:1px solid #3d5a8f;box-shadow:inset 0 2px 4px rgba(255,255,255,.15);white-space:nowrap;overflow:hidden;}
.ch-step.red{background:linear-gradient(#d42a1e,#7d0f08);border-color:#ff6b5e;}
.ch-step.me{background:linear-gradient(#1fae54,#0d6b32);border-color:#7dffab;box-shadow:0 0 10px rgba(60,255,120,.55);}
.ch-bank{color:#39ff7a;font-weight:900;letter-spacing:3px;font-size:16px;text-shadow:0 0 10px rgba(57,255,122,.8);margin-top:4px;}
.ch-q{flex:1;background:linear-gradient(#1c3f8f,#0e2456);border:3px solid #c9d4ea;border-radius:12px;padding:12px;min-width:0;}
.ch-qtext{color:#fff;font-weight:700;font-size:15px;margin-bottom:10px;line-height:1.4;}
.ch-a{display:block;width:100%;margin:6px 0;background:linear-gradient(#274b8f,#132c5c);border:2px solid #8fa3cc;border-radius:8px;color:#fff;font-weight:700;font-size:14px;padding:10px;text-align:left;cursor:pointer;}
.ch-a:disabled{opacity:.85;}
.ch-a.ok{border-color:#39ff7a;box-shadow:0 0 12px rgba(57,255,122,.75);}
.ch-a.bad{border-color:#ff5a4e;box-shadow:0 0 12px rgba(255,90,78,.75);}
.ch-tags{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px;}
.ch-tag{font-size:11px;font-weight:900;padding:3px 8px;border-radius:6px;}
.ch-tag.c{background:#f7c948;color:#111;}
.ch-tag.p{background:#e0342b;color:#fff;}
.ff-xov{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.45);border-radius:180px 180px 10px 10px;animation:ffxpop .25s;}
@keyframes ffxpop{from{transform:scale(.6);opacity:0;}}
.ff-x{width:86px;height:86px;border-radius:16px;background:linear-gradient(#f04438,#8f130d);border:4px solid #ffc9c2;display:flex;align-items:center;justify-content:center;color:#fff;font-size:56px;font-weight:900;text-shadow:0 3px 8px #000;box-shadow:0 6px 20px rgba(0,0,0,.7);}
</style>
</head>
<body>
<header>
  <div class="logo">🎙️ HUSH MUSIC SHOW GAMES</div>
  <div class="pill gold" id="pointsPill" title="Your points">⭐ 0</div>
  <button class="iconbtn" id="soundBtn" title="Mute game sounds">🔊</button>
  <button class="iconbtn hidden" id="micBtn" title="Mute microphone">🎤</button>
</header>
<main id="view"></main>
<nav class="bottom" id="bottomNav">
  <button data-v="home" class="active"><span class="e">🏠</span>Games</button>
  <button data-v="friends"><span class="e">👥</span>Friends</button>
  <button data-v="leaderboard"><span class="e">🏆</span>Top 50</button>
  <button data-v="profile"><span class="e">👤</span>Profile</button>
</nav>
<div id="modalRoot"></div>
<script>
'use strict';
/* =====================================================================
   CONFIG — paste keys via the Setup card (Profile) instead of here.
   Firebase: console.firebase.google.com → create project (free Spark plan,
   NO credit card) → Authentication → enable Email/Password → Realtime
   Database → Create database. Paste the 5 web-config keys in Setup.
   Voice: a Cloudflare Worker mints LiveKit tokens (its LIVEKIT_API_KEY and
   LIVEKIT_API_SECRET env vars stay on the worker, never in this file).
   The app works in DEMO MODE (this device only) until Setup is filled in.
   ===================================================================== */
const CONFIG = {
  firebase: {
    apiKey: "",
    authDomain: "",
    databaseURL: "",
    projectId: "",
    appId: ""
  },
  livekit: {
    url: "",        // e.g. wss://your-project.livekit.cloud (fallback; the token server can also return it)
    apiKey: ""
    // NOTE: no secret here — the Cloudflare Worker holds it server-side.
  }
};
const DAILY_BONUS = 500, START_POINTS = 1000, PVP_WIN = 200;
const CPU_PAYOUTS = {jeopardy:150,wheel:150,millionaire:200,price:120,feud:150,chase:150,matchgame:80,password:80,whatsmline:100,hollywood:120,deal:150,pressluck:150,pyramid:150,weakestlink:120,'1v100':200,fifthgrader:120};

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]];} return a; };
const uid = () => 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=A[rnd(A.length)]; return s; }
function toast(t){ const v=$('#view'); const d=document.createElement('div'); d.className='msg'; d.innerHTML=esc(t); v.prepend(d); setTimeout(()=>d.remove(),3500); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

/* ---------------- sound (WebAudio bleeps, mutable) ---------------- */
const Sound = {
  ctx:null, muted: localStorage.getItem('shg_muted')==='1',
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  beep(f,d,type){ if(this.muted) return; this.ensure(); if(!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.value=f||440; g.gain.value=.12;
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime+(d||.12)); o.stop(this.ctx.currentTime+(d||.12)); },
  click(){ this.beep(600,.06,'square'); }, win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,.15),i*110)); },
  lose(){ [400,300,220].forEach((f,i)=>setTimeout(()=>this.beep(f,.18,'sawtooth'),i*130)); },
  toggle(){ this.muted=!this.muted; localStorage.setItem('shg_muted', this.muted?'1':'0'); $('#soundBtn').textContent=this.muted?'🔇':'🔊'; $('#soundBtn').classList.toggle('off',this.muted); }
};
$('#soundBtn').addEventListener('click', ()=>Sound.toggle());
if(Sound.muted){ $('#soundBtn').textContent='🔇'; $('#soundBtn').classList.add('off'); }

/* ---------------- local storage (shg_ prefix for EVERYTHING) ---------------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('shg_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('shg_'+k, JSON.stringify(v)); }catch(e){} }
};

/* =====================================================================
   BACKEND — DEMO MODE (localStorage, this device only) until the user
   pastes Firebase keys into Setup (Profile). Firebase config is read from
   localStorage 'shg_fb_config' FIRST, falling back to CONFIG.firebase.
   ===================================================================== */
const Backend = {
  mode: 'local', fb: null, db: null, auth: null, fbCfg: null,
  readConfig(){
    let cfg = CONFIG.firebase;
    try{
      const raw = localStorage.getItem('shg_fb_config');
      if(raw){ const j=JSON.parse(raw); if(j && j.apiKey && String(j.apiKey).trim()) cfg=j; }
    }catch(e){}
    this.fbCfg = cfg; return cfg;
  },
  configured(){ const f=this.readConfig(); return !!(f && f.apiKey && f.databaseURL && f.projectId); },
  async init(){
    const f = this.readConfig();
    if(this.configured()){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
        this.fb = firebase.initializeApp(f);
        this.auth = firebase.auth(); this.db = firebase.database();
        this.mode = 'firebase';
      }catch(e){ console.warn('Firebase failed, demo mode', e); this.mode='local'; }
    }
    return this.mode;
  },
  onAuth(cb){
    if(this.mode==='firebase'){ this.auth.onAuthStateChanged(cb); }
    else { setTimeout(()=>cb(store.get('session',null)),0); }
  }
};

/* ---------------- AUTH (local demo + Firebase email/password) ----------------
   Every account gets a 6-char uppercase player CODE:
   local  → stored on the user record in shg_users (localStorage)
   firebase → shg_users/<uid>.code + shg_codes/<CODE> → uid                  */
const Auth = {
  user: null, // {uid, username, email, code}
  async signup(username, email, password){
    username=username.trim(); email=email.trim().toLowerCase();
    if(!/^[a-zA-Z0-9_]{3,16}$/.test(username)) throw new Error('Username: 3-16 letters, numbers or _');
    if(password.length<6) throw new Error('Password must be 6+ characters');
    if(Backend.mode==='firebase'){
      const un=await Backend.db.ref('shg_usernames/'+username.toLowerCase()).get();
      if(un.exists()) throw new Error('Username taken');
      const cred=await Backend.auth.createUserWithEmailAndPassword(email,password);
      const code=genCode();
      const u={uid:cred.user.uid, username, email, code};
      await Backend.db.ref('shg_users/'+u.uid).set({username, email, code, points:START_POINTS, wins:{}, created:Date.now(), lastDaily:0});
      await Backend.db.ref('shg_usernames/'+username.toLowerCase()).set(u.uid);
      await Backend.db.ref('shg_codes/'+code).set(u.uid);
      this.user=u; return u;
    }
    const users=store.get('users',{});
    if(Object.values(users).some(u=>u.username.toLowerCase()===username.toLowerCase())) throw new Error('Username taken');
    if(Object.values(users).some(u=>u.email===email)) throw new Error('Email already registered');
    let code=genCode();
    while(Object.values(users).some(u=>u.code===code)) code=genCode();
    const u={uid:uid(), username, email, code, pass:btoa(unescape(encodeURIComponent(password)))};
    users[u.uid]=u; store.set('users',users);
    const w=store.get('wallets',{}); w[u.uid]={points:START_POINTS, wins:{}, lastDaily:0}; store.set('wallets',w);
    store.set('session',{uid:u.uid,username:u.username,email:u.email,code:u.code});
    this.user={uid:u.uid,username:u.username,email:u.email,code:u.code}; return this.user;
  },
  async login(email,password){
    email=email.trim().toLowerCase();
    if(Backend.mode==='firebase'){
      const cred=await Backend.auth.signInWithEmailAndPassword(email,password);
      const snap=await Backend.db.ref('shg_users/'+cred.user.uid).get();
      const d=snap.val()||{};
      let code=d.code||'';
      if(!code){ // older account: backfill a code
        code=genCode();
        await Backend.db.ref('shg_users/'+cred.user.uid+'/code').set(code);
        await Backend.db.ref('shg_codes/'+code).set(cred.user.uid);
      }
      this.user={uid:cred.user.uid, username:d.username||email.split('@')[0], email, code};
      return this.user;
    }
    const users=store.get('users',{});
    const u=Object.values(users).find(x=>x.email===email);
    if(!u || u.pass!==btoa(unescape(encodeURIComponent(password)))) throw new Error('Wrong email or password');
    store.set('session',{uid:u.uid,username:u.username,email:u.email,code:u.code});
    this.user={uid:u.uid,username:u.username,email:u.email,code:u.code}; return this.user;
  },
  async logout(){
    if(Backend.mode==='firebase'){ try{await Backend.auth.signOut();}catch(e){} }
    else store.set('session',null);
    this.user=null;
  },
  async resetPassword(email){
    email=email.trim().toLowerCase();
    if(Backend.mode==='firebase'){ await Backend.auth.sendPasswordResetEmail(email); return 'reset-email'; }
    throw new Error('Password reset emails need Firebase. In demo mode, ask the device owner to reset it in Profile.');
  },
  onAuth(cb){
    if(Backend.mode==='firebase' && Backend.auth){
      Backend.auth.onAuthStateChanged(async u=>{
        if(u){
          try{
            const s=await Backend.db.ref('shg_users/'+u.uid).get();
            const d=s.val()||{};
            let code=d.code||'';
            if(!code){
              code=genCode();
              await Backend.db.ref('shg_users/'+u.uid+'/code').set(code);
              await Backend.db.ref('shg_codes/'+code).set(u.uid);
            }
            this.user={uid:u.uid, username:d.username||(u.email?u.email.split('@')[0]:'Player'), email:u.email||'', code};
            cb(this.user);
          }catch(e){
            this.user={uid:u.uid, username:(u.email?u.email.split('@')[0]:'Player'), email:u.email||'', code:''};
            cb(this.user);
          }
        } else {
          this.user=null;
          cb(null);
        }
      });
    } else {
      const sess=store.get('session',null);
      if(sess && sess.uid){
        this.user=sess;
        cb(sess);
      } else {
        this.user=null;
        cb(null);
      }
    }
  }
};

/* ---------------- WALLET (points) ---------------- */
const Wallet = {
  balance: 0, wins: {}, lastDaily: 0,
  async load(){
    if(!Auth.user){ this.balance=0; return; }
    if(Backend.mode==='firebase'){
      const s=await Backend.db.ref('shg_users/'+Auth.user.uid).get(); const d=s.val()||{};
      this.balance=d.points||0; this.wins=d.wins||{}; this.lastDaily=d.lastDaily||0;
    } else {
      const w=store.get('wallets',{})[Auth.user.uid]||{points:START_POINTS,wins:{},lastDaily:0};
      this.balance=w.points; this.wins=w.wins; this.lastDaily=w.lastDaily;
    }
    this.render();
  },
  async save(){
    if(!Auth.user) return;
    if(Backend.mode==='firebase'){ await Backend.db.ref('shg_users/'+Auth.user.uid).update({points:this.balance, wins:this.wins, lastDaily:this.lastDaily}); }

/* ---------------- PVP ROOMS (needs Firebase) ---------------- */
const Net = {
  room: null, // {code, game, seatsNeeded, seats:[uids], names:{}, state, turn, status, host, created}
  _off: [],
  needNet(){ if(Backend.mode!=='firebase'){ toast('Online PvP needs Firebase connected (see Setup in Profile).'); return false; } return true; },
  async create(game, seats){
    if(!this.needNet()) return null;
    const code=String(rnd(9000)+1000);
    const room={code, game, seatsNeeded:seats, seats:[Auth.user.uid], names:{[Auth.user.uid]:Auth.user.username}, state:null, turn:0, status:'waiting', host:Auth.user.uid, created:Date.now()};
    await Backend.db.ref('shg_rooms/'+code).set(room);
    this.room=room; this._listen(code);
    return code;
  },
  async join(code){
    if(!this.needNet()) return null;
    code=String(code).trim();
    const s=await Backend.db.ref('shg_rooms/'+code).get();
    if(!s.exists()){ toast('Room not found'); return null; }
    const room=s.val();
    if(room.status!=='waiting'){ toast('Game already started'); return null; }
    if(!room.seats.includes(Auth.user.uid)){
      if(room.seats.length>=room.seatsNeeded){ toast('Room is full'); return null; }
      room.seats.push(Auth.user.uid); room.names[Auth.user.uid]=Auth.user.username;
      await Backend.db.ref('shg_rooms/'+code+'/seats').set(room.seats);
      await Backend.db.ref('shg_rooms/'+code+'/names').set(room.names);
    }
    this.room=room; this._listen(code);
    return code;
  },
  mySeat(){ return this.room? this.room.seats.indexOf(Auth.user.uid) : -1; },
  isHost(){ return this.room && this.room.host===Auth.user.uid; },
  _listen(code){
    this.leave(true);
    const ref=Backend.db.ref('shg_rooms/'+code);
    const h=snap=>{ const r=snap.val(); if(!r) return; const st=JSON.stringify(r.state);
      const changed = st!==JSON.stringify(this.room?this.room.state:null) || r.turn!==(this.room?this.room.turn:-1) || r.status!==(this.room?this.room.status:'');
      this.room=r; if(changed && this._onUpdate) this._onUpdate(r);
    };
    ref.on('value', h); this._off.push(()=>ref.off('value',h));
  },
  onUpdate(cb){ this._onUpdate=cb; },
  async push(patch){
    if(!this.room) return;
    Object.assign(this.room, patch);
    await Backend.db.ref('shg_rooms/'+this.room.code).update(patch);
  },
  // Targeted write into the current room (e.g. 'state/scores/'+uid)
  async set(path, val){
    if(!this.room || Backend.mode!=='firebase') return;
    return Backend.db.ref('shg_rooms/'+this.room.code+'/'+path).set(val);
  },
  async leave(silent){
    this._off.forEach(f=>{try{f()}catch(e){}}); this._off=[];
    if(!silent && this.room && Backend.mode==='firebase'){
      try{ if(this.isHost()) await Backend.db.ref('shg_rooms/'+this.room.code).remove(); }catch(e){}
    }
    this.room=null; this._onUpdate=null;
    Voice.leave();
  }
};

/* ---------------- VOICE (Cloudflare Worker token server; NO client secret) ---
   The worker URL is pasted once in Setup (Profile) → localStorage
   'shg_voice_worker'. Voice.join fetches a token:
   GET <workerUrl>?room=<room>&identity=<username>
   The server answers JSON {"token":"..."} (optionally with "url") or a
   raw-text token. livekit-client loads from jsdelivr. Voice room name
   pattern: 'shg-'+roomCode.                                          */
const Voice = {
  room:null, micMuted:false, active:false,
  workerUrl(){ return store.get('voice_worker',''); },
  configured(){ return !!this.workerUrl(); },
  async join(roomName){
    if(!this.configured()){ toast('Voice needs a token server — paste your Cloudflare Worker URL in Profile → Setup.'); return false; }
    if(this.active) return true;
    try{
      await loadScript('https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js');
      const res=await fetch(this.workerUrl()+'?room='+encodeURIComponent(roomName)+'&identity='+encodeURIComponent(Auth.user.username));
      if(!res.ok) throw new Error('token server HTTP '+res.status);
      const txt=(await res.text()).trim();
      let token=txt, lkUrl=CONFIG.livekit.url||'';
      try{ const j=JSON.parse(txt); if(j&&j.token){ token=String(j.token); if(j.url) lkUrl=String(j.url); } }catch(e){}
      if(!token) throw new Error('empty token');
      if(!lkUrl) throw new Error('token server did not return a LiveKit URL');
      const r=new LivekitClient.Room();
      await r.connect(lkUrl, token);
      await r.localParticipant.setMicrophoneEnabled(true);
      this.room=r; this.active=true; this.micMuted=false;
      $('#micBtn').classList.remove('hidden'); this._micIcon();
      toast('🎤 Voice connected — talk to your opponent');
      return true;
    }catch(e){ console.warn(e); toast('Voice failed to connect'); return false; }
  },
  _micIcon(){ $('#micBtn').textContent=this.micMuted?'🚫':'🎤'; $('#micBtn').classList.toggle('off',this.micMuted); },
  toggleMic(){ if(!this.room) return; this.micMuted=!this.micMuted; this.room.localParticipant.setMicrophoneEnabled(!this.micMuted); this._micIcon(); },
  leave(){
    if(this.room){ try{this.room.disconnect();}catch(e){} }
    this.room=null; this.active=false; $('#micBtn').classList.add('hidden');
  }
};
$('#micBtn').addEventListener('click', ()=>Voice.toggleMic());
</script>

              if(Math.random()<acc){scores[order[k]]+=val;cl.done=true;Sound.lose();reveal('🔔 '+esc(order[k])+' buzzes in — RIGHT! +'+g1Money(val)+' to them.');return;}
              scores[order[k]]-=val;
            }
          }
        }
        scores.You-=val;cl.done=true;Sound.lose();reveal('❌ Wrong. −'+g1Money(val)+'.');
      }
      function reveal(msg){
        c.innerHTML='<div class="card"><div class="status">'+msg+'</div><div class="muted">Answer: '+esc(cl.a)+'</div><div class="status">'+scoreLine()+'</div><button class="btn" id="nx">Continue</button></div>';
        c.querySelector('#nx').onclick=function(){Sound.click();next();};
      }
    }
    function next(){
      var left=false;for(var k=0;k<clues.length;k++)if(!clues[k].done){left=true;break;}
      if(left)board();else finalJ();
    }
    function finalJ(){
      var f=set.final,maxW=Math.max(1000,scores.You);
      c.innerHTML='<h2>🏁 Final Jeopardy</h2><div class="card"><div class="muted">Category: <b>'+esc(f.cat)+'</b></div><div class="muted">Wager up to '+g1Money(maxW)+':</div><input id="w" type="number" value="0"><button class="btn" id="go">Wager</button></div>';
      c.querySelector('#go').onclick=function(){
        var w=Math.max(0,Math.min(maxW,Math.round(+c.querySelector('#w').value||0)));Sound.click();
        c.innerHTML='<h2>🏁 '+esc(f.cat)+'</h2><div class="card"><div class="big" style="font-size:19px">'+esc(f.q)+'</div><input id="a" placeholder="Final answer…" autocomplete="off"><button class="btn" id="go2">Answer</button></div>';
        var inp=c.querySelector('#a');
        function fin2(){
          var ok=SHG.jeopardyGrade(inp.value,f.a);
          scores.You+=ok?w:-w;Sound[ok?'win':'lose']();
          if(useBots)bots.forEach(function(b){var bw=Math.floor(Math.random()*Math.max(1000,scores[b]));scores[b]+=Math.random()<0.55?bw:-Math.min(bw,Math.max(0,scores[b]));});
          endGame();
        }
        c.querySelector('#go2').onclick=fin2;
        inp.addEventListener('keydown',function(e){if(e.key==='Enter')fin2();});
      };
    }
    function endGame(){
      var names=Object.keys(scores),win=names[0];
      names.forEach(function(n){if(scores[n]>scores[win])win=n;});
      var iWon=win==='You'&&scores.You>0;
      var h='<h2>🏁 Final scores</h2><div class="card"><table class="lb">'+names.map(function(n){return '<tr><td>'+esc(n)+'</td><td>'+g1Money(scores[n])+'</td></tr>';}).join('')+'</table>';
      if(fin){c.innerHTML=h+'<div class="muted">Waiting for opponent…</div></div>';fin(scores.You);return;}
      h+='<div class="status">'+(iWon?'<span class="ok">🏆 You win Jeopardy!</span>':'<span class="err">😞 '+esc(win)+' wins.</span>')+'</div></div>';
      c.innerHTML=h;
      if(iWon){Sound.win();(async function(){var p=await Wallet.recordWin('jeopardy');toast('+'+p+' ⭐ banked!');})();}
      else Sound.lose();
    }
    board();
  }
}});

    var WHEEL_CSS='.wheelwrap{display:flex;justify-content:center;margin:4px 0}'
      +'.wboard{background:#081426;border:3px solid #1e3a5f;border-radius:10px;padding:10px 4px;margin:8px 0}'

    function paintWheel(){
      var cv=c.querySelector('#wheelcv');if(!cv)return;
      var g=cv.getContext('2d'),W=cv.width,cx=W/2,cy=W/2,R=W/2-8;
      var layout=SHG.wheelLayout(),n=layout.length,arc=Math.PI*2/n,i,a0;
      g.clearRect(0,0,W,W);
      for(i=0;i<n;i++){
        a0=wheelRot+i*arc;
        g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a0,a0+arc);g.closePath();
        var wdg=layout[i],s=wdg.v;
        g.fillStyle=wdg.c;
        g.fill();g.lineWidth=2;g.strokeStyle='#0d1420';g.stroke();
        g.save();g.translate(cx,cy);g.rotate(a0+arc/2);
        g.textAlign='right';g.textBaseline='middle';
        var label=(typeof s==='number')?'$'+s:(s==='FREE SPIN'?'$'+wdg.cash:s);
        g.font='bold '+(label.length>9?W/30:W/24)+'px Arial,sans-serif';
        g.fillStyle=s==='BANKRUPT'?'#ffffff':'#101010';
        g.fillText(label,R-8,0);
        if(s==='FREE SPIN'){g.font='bold '+Math.max(8,W/44)+'px Arial,sans-serif';g.fillStyle='#083f31';g.fillText('FREE SPIN',R-8,16);}
        g.restore();
      }
      var hr=R*0.30;
      g.save();
      g.beginPath();g.arc(cx,cy,hr,0,Math.PI*2);g.clip();
      g.fillStyle='#0d1420';g.fillRect(cx-hr,cy-hr,hr*2,hr*2);
      if(wheelLogoImg.complete&&wheelLogoImg.naturalWidth)g.drawImage(wheelLogoImg,cx-hr,cy-hr,hr*2,hr*2);
      g.restore();
      g.beginPath();g.arc(cx,cy,hr,0,Math.PI*2);
      g.lineWidth=4;g.strokeStyle='#cf8f3f';g.stroke();
      g.beginPath();g.moveTo(cx-10,2);g.lineTo(cx+10,2);g.lineTo(cx,hr+14);g.closePath();
      g.fillStyle='#cf8f3f';g.fill();g.lineWidth=2;g.strokeStyle='#0d1420';g.stroke();
    }
    function animateWheel(seg,done){
      var segs=SHG.wheelSegments(),n=segs.length,arc=Math.PI*2/n,i,cands=[];
      for(i=0;i<n;i++)if(segs[i]===seg)cands.push(i);
      var t=cands[Math.floor(Math.random()*cands.length)];
      var jitter=(Math.random()*0.7-0.35)*arc;
      var target=-Math.PI/2-(t+0.5)*arc+jitter;
      var TAU=Math.PI*2,delta=((target-wheelRot)%TAU+TAU)%TAU+(5+Math.floor(Math.random()*2))*TAU;
      var start=wheelRot,dur=2600+Math.random()*700,t0=performance.now(),lastTick=-1;
      spinning=true;
      function frame(now){
        if(!c.isConnected)return;
        var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
        wheelRot=start+delta*e;paintWheel();
        var under=Math.floor((((-Math.PI/2-wheelRot)/arc)%n+n)%n);
        if(under!==lastTick){lastTick=under;Sound.beep(880,.03,'square');}
        if(p<1)requestAnimationFrame(frame);
        else{spinning=false;done();}
      }
      requestAnimationFrame(frame);
    }
    function doSpin(who){
      if(spinning)return;
      var seg=SHG.wheelSpin();
      var el=c.querySelector('#ctl');
      if(el&&who===0)el.innerHTML='<div class="status">🌀 Spinning…</div>';
      animateWheel(seg,function(){if(c.isConnected)resolveSpin(who,seg);});
    }
    function layoutRows(p){
      var widths=[12,14,14,12],words=String(p).toUpperCase().split(' '),lines=[],line='';
      words.forEach(function(w){
        var wd=widths[Math.min(lines.length,3)];
        if(w.length>wd){
          if(line){lines.push(line);line='';}
          while(w.length>wd){lines.push(w.slice(0,wd));w=w.slice(wd);}
          line=w;return;
        }
        if(((line?line.length+1:0)+w.length)<=wd)line=line?line+' '+w:w;
        else{lines.push(line);line=w;}
      });
      if(line)lines.push(line);
      while(lines.length>4){var ex=lines.pop();lines[3]=(lines[3]+' '+ex).slice(0,widths[3]);}
      return lines.map(function(ln,i){
        var wd=widths[i],s=String(ln||'');
        if(s.length>wd)s=s.slice(0,wd);
        var pad=wd-s.length,left=Math.floor(pad/2);
        return new Array(left+1).join(' ')+s+new Array(pad-left+1).join(' ');
      });
    }
    function boardHTML(){
      var rows=layoutRows(puz.puzzle),h='';
      rows.forEach(function(row){
        h+='<div class="wrow">';
        for(var i=0;i<row.length;i++){
          var ch=row[i];
          if(ch===' ')h+='<div class="wtile gap"></div>';
          else if(/[A-Z]/.test(ch)){var l=ch.toLowerCase(),rv=revealed[l];h+='<div class="wtile'+(rv?' lit':'')+'">'+(rv?ch:'')+'</div>';}
          else h+='<div class="wtile lit">'+esc(ch)+'</div>';
        }
        h+='</div>';
      });
      return h;
    }
    function newRound(){
      if(ri>=puzs.length){endGame();return;}
      puz=puzs[ri];revealed={};guessed={};bank=0;bbank=[0,0];turn=0;spinning=false;ftok=[0,0,0];
      c.innerHTML='<h2>🎡 Round '+(ri+1)+' of '+puzs.length+' — '+esc(puz.cat)+'</h2><style>'+WHEEL_CSS+'</style>'
        +'<div class="wheelwrap"><canvas id="wheelcv" width="320" height="320"></canvas></div>'
        +'<div class="wboard" id="bd"></div><div id="ctl"></div>';
      paintWheel();
      takeTurn();
    }
    function scoreLine(){
      var s='<b>You:</b> '+g1Money(tot.You)+' <span class="muted">(round '+g1Money(bank)+')</span>'+(ftok[0]?' 🆓×'+ftok[0]:'');
      bots.forEach(function(b,i){s+='<br><b>'+esc(b)+':</b> '+g1Money(tot[b])+' <span class="muted">('+g1Money(bbank[i])+')</span>'+(ftok[i+1]?' 🆓×'+ftok[i+1]:'');});
      return s;
    }
    function msg(t){var e=c.querySelector('#wmsg');if(e)e.innerHTML=t;}
    function draw(){
      var bd=c.querySelector('#bd');if(!bd)return;
      bd.innerHTML=boardHTML()+'<div class="status" style="padding:2px 8px 0">'+scoreLine()+'</div><div class="muted" id="wmsg" style="padding:0 8px 4px"></div>';
    }
    function solved(){var pl=puz.puzzle.toLowerCase();for(var i=0;i<pl.length;i++){var l=pl[i];if(/[a-z]/.test(l)&&!revealed[l])return false;}return true;}
    function takeTurn(){draw();if(turn===0)playerCtl();else botCtl(bots[turn-1],turn-1);}
    function nextTurn(){turn=useBots?(turn+1)%3:0;takeTurn();}
    function playerCtl(){
      var el=c.querySelector('#ctl');
      el.innerHTML='<div class="row"><button class="btn small grow" id="sp">🌀 SPIN</button><button class="btn small grow" id="vw">Buy vowel $250</button><button class="btn small grow" id="sv">Solve</button></div><div id="inp"></div>';
      el.querySelector('#sp').onclick=function(){Sound.click();doSpin(0);};
      el.querySelector('#vw').onclick=function(){
        Sound.click();
        if(bank<250){toast('Need $250 in the round bank');return;}
        var inp=el.querySelector('#inp');
        inp.innerHTML='<div class="row"><input id="vl" maxlength="1" class="grow" placeholder="Vowel: a e i o u"><button class="btn small" id="vg">Buy $250</button></div>';
        inp.querySelector('#vg').onclick=function(){
          var l=inp.querySelector('#vl').value.toLowerCase();
          if(VOW.indexOf(l)<0||guessed[l]){msg('Pick an uncalled vowel.');return;}
          bank-=250;guessed[l]=1;Sound.click();
          if(puz.puzzle.toLowerCase().indexOf(l)>=0){revealed[l]=1;msg('✅ '+l.toUpperCase()+' is in there!');if(solved()){solveRound(0);return;}}
          else{msg('❌ No '+l.toUpperCase()+'.');Sound.lose();}
          takeTurn();
        };
      };
      el.querySelector('#sv').onclick=function(){
        Sound.click();
        var inp=el.querySelector('#inp');
        inp.innerHTML='<div class="row"><input id="sl" class="grow" placeholder="Solve the puzzle…"><button class="btn small" id="sg">Solve</button></div>';
        inp.querySelector('#sg').onclick=function(){
          var s=inp.querySelector('#sl').value;
          if(SHG.jeopardyGrade(s,puz.puzzle))solveRound(0);
          else if(ftok[0]>0){ftok[0]--;Sound.win();msg('🆓 FREE SPIN saves your turn!');setTimeout(takeTurn,1100);}
          else{misses++;Sound.lose();msg('❌ Not quite!');setTimeout(nextTurn,1100);}
        };
      };
    }
    function resolveSpin(who,seg){
      var name=who===0?'You':bots[who-1];
      var fsNote='';
      if(seg==='FREE SPIN'){ftok[who]++;seg=500;fsNote='🆓 FREE SPIN token banked! ';}
      if(seg==='BANKRUPT'){if(who===0)bank=0;else bbank[who-1]=0;ftok[who]=0;Sound.lose();msg('💥 '+esc(name)+' hit BANKRUPT!');setTimeout(nextTurn,1300);return;}
      if(seg==='LOSE A TURN'){Sound.beep(300,.2);msg('⏭ '+esc(name)+' loses a turn.');setTimeout(nextTurn,1300);return;}
      if(who===0){
        var el=c.querySelector('#ctl');
        el.innerHTML='<div class="status">'+fsNote+g1Money(seg)+' per consonant</div><div class="row"><input id="cl" maxlength="1" class="grow" placeholder="Consonant"><button class="btn small" id="cg">Guess</button></div>';
        el.querySelector('#cg').onclick=function(){
          var l=el.querySelector('#cl').value.toLowerCase();Sound.click();
          if(!/[a-z]/.test(l)||VOW.indexOf(l)>=0||guessed[l]){msg('Enter an uncalled consonant.');return;}
          guessLetter(0,l,seg);
        };
      }else{
        var l=botCons();
        msg(fsNote+'🌀 '+esc(name)+' spins '+g1Money(seg)+' and calls <b>'+l.toUpperCase()+'</b>…');
        g1Delay(900).then(function(){if(c.isConnected)guessLetter(who,l,seg);});
      }
    }
    function guessLetter(who,l,seg){
      var name=who===0?'You':bots[who-1];
      guessed[l]=1;
      var pl=puz.puzzle.toLowerCase(),count=0,i;
      for(i=0;i<pl.length;i++)if(pl[i]===l)count++;
      if(count>0){
        revealed[l]=1;var amt=seg*count;
        if(who===0)bank+=amt;else bbank[who-1]+=amt;
        Sound.win();msg('✅ '+count+'× '+l.toUpperCase()+'! +'+g1Money(amt)+' to '+esc(name));
        if(solved()){solveRound(who);return;}
        if(who===0)setTimeout(takeTurn,1100);else botCont(who);
      }else{
        if(ftok[who]>0){ftok[who]--;Sound.win();msg('🆓 '+esc(name)+' uses a FREE SPIN — turn saved!');setTimeout(takeTurn,1100);return;}
        if(who===0)misses++;
        Sound.lose();msg('❌ No '+l.toUpperCase()+'.');setTimeout(nextTurn,1100);
      }
    }
    function botCons(){var f='tnshrdlcmfwypvbgkqjxz';for(var i=0;i<f.length;i++)if(!guessed[f[i]])return f[i];return 't';}
    function revFrac(){var pl=puz.puzzle.toLowerCase(),t=0,r=0;for(var i=0;i<pl.length;i++)if(/[a-z]/.test(pl[i])){t++;if(revealed[pl[i]])r++;}return t?r/t:1;}
    function botCtl(name,bi){
      c.querySelector('#ctl').innerHTML='<div class="status">🤖 '+esc(name)+' is thinking…</div>';
      g1Delay(1000).then(function(){
        if(!c.isConnected)return;
        if(revFrac()>0.55&&Math.random()<0.5){
          if(Math.random()<0.6){solveRound(bi+1);return;}
          if(ftok[bi+1]>0){ftok[bi+1]--;msg('🆓 '+esc(name)+' uses a FREE SPIN — turn saved!');setTimeout(takeTurn,1100);return;}
          msg('🤖 '+esc(name)+' tries to solve… wrong!');setTimeout(nextTurn,1100);return;
        }
        doSpin(bi+1);
      });
    }
    function botCont(who){
      var bi=who-1,name=bots[bi];
      g1Delay(900).then(function(){
        if(!c.isConnected)return;
        if(bbank[bi]>=250&&Math.random()<0.35){
          var vw='aeiou'.split('').filter(function(v){return !guessed[v];});
          if(vw.length){
            var v=vw[Math.floor(Math.random()*vw.length)];guessed[v]=1;bbank[bi]-=250;
            if(puz.puzzle.toLowerCase().indexOf(v)>=0){revealed[v]=1;msg('🤖 '+esc(name)+' buys '+v.toUpperCase()+' — in there!');if(solved()){solveRound(who);return;}}
            else msg('🤖 '+esc(name)+' buys '+v.toUpperCase()+' — nope.');
          }
        }
        turn=who;takeTurn();
      });
    }
    function solveRound(who){
      var name=who===0?'You':bots[who-1];
      var amt=who===0?bank:bbank[who-1];
      tot[name]+=amt;Sound.win();
      var ctl=c.querySelector('#ctl');if(ctl)ctl.innerHTML='<div class="ok">🎉 '+esc(name)+' solves it: "'+esc(puz.puzzle)+'" — banks '+g1Money(amt)+'!</div>';
      ri++;setTimeout(function(){if(c.isConnected)newRound();},2000);
    }
    function endGame(){
      var names=Object.keys(tot),win=names[0];
      names.forEach(function(n){if(tot[n]>tot[win])win=n;});
      var h='<h2>🏁 Final totals</h2><div class="card"><table class="lb">'+names.map(function(n){return '<tr><td>'+esc(n)+'</td><td>'+g1Money(tot[n])+'</td></tr>';}).join('')+'</table>';
      if(fin){
        var score=Math.round(tot.You-misses*10);
        c.innerHTML=h+'<div class="status">Your score: '+score+' (bank − 10 per miss)</div><div class="muted">Waiting for opponent…</div></div>';
        fin(score);return;
      }
      var iWon=win==='You'&&tot.You>0;
      h+='<div class="status">'+(iWon?'<span class="ok">🏆 You win Wheel of Fortune!</span>':'<span class="err">😞 '+esc(win)+' wins.</span>')+'</div></div>';
      c.innerHTML=h;
      if(iWon){Sound.win();(async function(){var p=await Wallet.recordWin('wheel');toast('+'+p+' ⭐ banked!');})();}
      else Sound.lose();
    }
    newRound();
  }
}});

/* ================= MILLIONAIRE ================= */
regGame('millionaire',{howto:"Climb 15 questions up the money ladder. You have 3 lifelines: 50:50, Phone a Friend, and Ask the Audience. Walk away anytime to keep what you have banked - a wrong answer drops you back to the last safe haven.",name:'Millionaire',icon:'💰',tags:'Game Show',pvp:true,seats:2,
render:function(c,ctx){
  var net=(ctx&&ctx.mode==='pvp')?ctx.net:null;
  if(g1Guard(c,BANKS1.millionaire.length>=15))return;
  var share=function(){
    var qs=[],t,ok=true;
    for(t=1;t<=3;t++){var pool=BANKS1.millionaire.filter(function(x){return x.tier===t;});if(pool.length<5){ok=false;break;}qs=qs.concat(g1PickN(pool,5));}
    if(!ok)qs=g1PickN(BANKS1.millionaire,15);
    return JSON.parse(JSON.stringify(qs));
  };
  if(net)g1Pvp(net,share,function(d,fin){playM(d,fin);},function(iw,sc){g1Settle(c,iw,sc,'Millionaire');});
  else playM(share(),null);
  function playM(qs,fin){
    var L=SHG.millionaireLadder(),lvl=0,banked=0,ll={f:false,p:false,a:false};
    function ask(){
      if(lvl>=15){endGame(true);return;}
      var q=qs[lvl],val=L[lvl];
      c.innerHTML='<h2>💰 '+g1Money(val)+'</h2><div class="card"><div class="big" style="font-size:19px;margin:8px 0">'+esc(q.q)+'</div><div id="ch"></div><div class="row" style="margin-top:8px">'
        +(!ll.f?'<button class="btn small" id="l50">50:50</button>':'')
        +(!ll.p?'<button class="btn small" id="lph">📞 Phone</button>':'')
        +(!ll.a?'<button class="btn small" id="lau">👥 Ask</button>':'')
        +'<button class="btn small secondary" id="walk">Walk away</button></div><div id="life"></div></div>'
        +'<div class="muted">Safe havens: '+g1Money(1000)+' · '+g1Money(32000)+'</div>';
      var chBox=c.querySelector('#ch');
      function drawChoices(){
        chBox.innerHTML='';
        q.choices.forEach(function(t,i){
          var b=document.createElement('button');b.className='btn secondary';b.style.textAlign='left';
          b.innerHTML='<b>'+'ABCD'[i]+':</b> '+esc(t);
          b.onclick=function(){Sound.click();answer(i);};
          chBox.appendChild(b);
        });
      }
      drawChoices();
      if(!ll.f)c.querySelector('#l50').onclick=function(){ll.f=true;this.remove();Sound.click();
        var keep=SHG.millionaireFifty(q.choices,q.correct),btns=chBox.querySelectorAll('button');
        for(var i=0;i<btns.length;i++)if(keep.indexOf(i)<0){btns[i].disabled=true;btns[i].style.opacity=.3;}};
      if(!ll.p)c.querySelector('#lph').onclick=function(){ll.p=true;this.remove();Sound.click();
        var acc=q.tier===1?0.85:(q.tier===2?0.65:0.45);
        var pick=Math.random()<acc?q.correct:Math.floor(Math.random()*4);
        c.querySelector('#life').innerHTML='<div class="msg"><span class="who">📞 Friend:</span> "I think it\'s <b>'+'ABCD'[pick]+'</b>."</div>';};
      if(!ll.a)c.querySelector('#lau').onclick=function(){ll.a=true;this.remove();Sound.click();
        var pct=[0,0,0,0],main=45+Math.floor(Math.random()*25),rest=100-main;
        var others=[0,1,2,3].filter(function(i){return i!==q.correct;});
        pct[q.correct]=main;
        others.forEach(function(i2,k){pct[i2]=k===others.length-1?rest:Math.floor(Math.random()*(rest+1));rest-=pct[i2];});
        var sum=pct[0]+pct[1]+pct[2]+pct[3]||1;
        c.querySelector('#life').innerHTML='<div class="msg"><span class="who">👥 Audience:</span><br>'+q.choices.map(function(t,i2){var p2=Math.round(pct[i2]/sum*100);return 'ABCD'[i2]+' <span style="display:inline-block;height:10px;background:var(--gold);width:'+(p2*2)+'px"></span> '+p2+'%';}).join('<br>')+'</div>';};
      c.querySelector('#walk').onclick=function(){Sound.click();endGame(false,true);};
      function answer(i){
        if(i===q.correct){Sound.win();lvl++;banked=L[lvl-1];
          c.innerHTML='<div class="card center"><div class="big">✅ Correct!</div><div class="status">You have '+g1Money(banked)+'</div><button class="btn" id="nx">Next question</button></div>';
          c.querySelector('#nx').onclick=function(){Sound.click();ask();};
        }else{Sound.lose();endGame(false,false);}
      }
    }
    function endGame(won,walked){
      var score=lvl*10000+banked;
      if(fin){
        c.innerHTML='<h2>💰 Game over</h2><div class="card"><div class="status">Banked '+g1Money(banked)+' — score '+score.toLocaleString('en-US')+'</div><div class="muted">Waiting for opponent…</div></div>';
        fin(score);return;
      }
      if(won){
        c.innerHTML='<div class="card center"><div class="big">🏆 $1,000,000!!!</div><div class="ok">YOU ARE A MILLIONAIRE!</div></div>';
        Sound.win();(async function(){var p=await Wallet.recordWin('millionaire');toast('+'+p+' ⭐ banked!');})();
      }else{
        var safe=lvl>9?32000:(lvl>4?1000:0);
        c.innerHTML='<div class="card center"><div class="big">💰 Game over</div><div class="status">'+(walked?'You walk away with ':'Wrong answer — you leave with ')+'<b>'+g1Money(walked?banked:safe)+'</b></div><button class="btn" id="again" style="margin-top:10px">🔄 Start over</button></div>';
        Sound.lose();
        c.querySelector('#again').onclick=function(){Sound.click();playM(share(),null);};
      }
    }
    ask();
  }
}});

/* ============ PRICE IS RIGHT: pricing games (show-style panels) ============ */
var PG=PG||{};

/* ================= PLINKO ================= */
PG.plinko=function(c,items,done){
  var over=false;
  function finish(v){if(over)return;over=true;done(v);}
  var SLOTS=[100,500,1000,0,10000,0,1000,500,100];
  var quiz=items.slice(0,4),qi=0,chips=1,total=0;
  function wrongPrice(p){
    var w;
    if(p<=5){w=p+1+Math.floor(Math.random()*3);}
    else{w=Math.round(p*(Math.random()<0.5?0.72:1.38)*100)/100;}
    if(w<=0||Math.abs(w-p)<0.01)w=Math.round((p+1.5)*100)/100;
    return w;
  }
  function askItem(){
    if(!c.isConnected)return;
    if(qi>=quiz.length){dropPhase();return;}
    var it=quiz[qi],wp=wrongPrice(it.price);
    var opts=Math.random()<0.5?[it.price,wp]:[wp,it.price];
    c.innerHTML='<h2 style="text-align:center;color:#29a3e8;margin:6px 0">🔴 PLINKO</h2>'
      +'<div style="max-width:420px;margin:0 auto;text-align:center">'
      +'<div class="card"><div class="big" style="font-size:20px">'+esc(it.name)+'</div>'
      +'<div class="muted" style="margin:6px 0">Pick the right price to win a chip! (Chips: '+chips+')</div>'
      +'<div style="display:flex;gap:10px;justify-content:center">'
      +'<button class="btn" id="p0" style="flex:1;min-height:56px;font-size:20px">'+g1Money(opts[0])+'</button>'
      +'<button class="btn" id="p1" style="flex:1;min-height:56px;font-size:20px">'+g1Money(opts[1])+'</button>'
      +'</div><div id="pr" style="margin-top:8px;min-height:24px"></div></div></div>';
    c.querySelector('#p0').onclick=function(){pick(opts[0]);};
    c.querySelector('#p1').onclick=function(){pick(opts[1]);};
    function pick(v){
      Sound.click();
      var ok=Math.abs(v-it.price)<0.01;
      if(ok){chips++;Sound.win();c.querySelector('#pr').innerHTML='<div class="ok" style="font-size:18px">🎉 Correct! +1 chip (now '+chips+')</div>';}
      else{Sound.lose();c.querySelector('#pr').innerHTML='<div class="err" style="font-size:18px">Miss — it was '+g1Money(it.price)+'</div>';}
      qi++;
      setTimeout(function(){if(!c.isConnected)return;askItem();},1400);
    }
  }
  function dropPhase(){
    if(!c.isConnected)return;
    c.innerHTML='<h2 style="text-align:center;color:#29a3e8;margin:6px 0">🔴 PLINKO</h2>'
      +'<div style="max-width:420px;margin:0 auto;text-align:center">'
      +'<canvas id="pb" width="360" height="540" style="width:100%;max-width:360px;border-radius:12px"></canvas>'
      +'<div class="status" id="pst" style="margin:6px 0;font-size:18px">Chips: '+chips+' &nbsp;•&nbsp; Total: '+g1Money(total)+'</div>'
      +'<button class="btn" id="drop" style="min-height:56px;font-size:20px;width:100%">⬇ Drop chip</button>'
      +'</div>';
    var cv=c.querySelector('#pb'),g=cv.getContext('2d');
    var W=360,H=540,ROWS=12,startY=86,rowH=32;
    function pegs(r){
      var arr=[],even=r%2===0;
      if(even){for(var i=0;i<11;i++)arr.push(30+i*30);}
      else{for(var j=0;j<10;j++)arr.push(45+j*30);}
      return arr;
    }
    function drawBoard(chx,chy,hi){
      g.clearRect(0,0,W,H);
      g.fillStyle='#f7f0dc';g.fillRect(0,0,W,H);
      // zigzag side stripes
      var cols=['#e63946','#ffd60a','#4cc9f0'];
      for(var s=0;s<22;s++){
        var y0=48+s*22;
        g.fillStyle=cols[s%3];
        g.beginPath();g.moveTo(0,y0);g.lineTo(18,y0+11);g.lineTo(0,y0+22);g.closePath();g.fill();
        g.beginPath();g.moveTo(W,y0);g.lineTo(W-18,y0+11);g.lineTo(W,y0+22);g.closePath();g.fill();
      }
      // title
      g.fillStyle='#29a3e8';g.font='bold 34px sans-serif';g.textAlign='center';
      g.fillText('PLINKO',W/2,38);
      // pegs
      for(var r=0;r<ROWS;r++){
        var y=startY+r*rowH;
        pegs(r).forEach(function(x){
          g.beginPath();g.arc(x,y,4.5,0,Math.PI*2);
          g.fillStyle='rgba(0,0,0,0.12)';g.fill();
          g.beginPath();g.arc(x,y-1.5,4.5,0,Math.PI*2);
          g.fillStyle='#ffffff';g.fill();
          g.strokeStyle='#d8d2bd';g.lineWidth=1;g.stroke();
        });
      }
      // slots
      var sw=W/9;
      for(var i=0;i<9;i++){
        g.fillStyle=(i===hi)?'#ffd60a':(i%2===0?'#7a1f3d':'#3d9db8');
        g.fillRect(i*sw+1,H-52,sw-2,48);
        g.fillStyle='#fff';g.font='bold '+(SLOTS[i]>=10000?15:18)+'px sans-serif';
        g.fillText(SLOTS[i]>=1000?(SLOTS[i]/1000)+'k':''+SLOTS[i],i*sw+sw/2,H-22);
      }
      // chip
      if(chx!==null){
        g.beginPath();g.arc(chx,chy,12,0,Math.PI*2);
        g.fillStyle='#ef476f';g.fill();
        g.lineWidth=3;g.strokeStyle='#b5179e';g.stroke();
        g.fillStyle='#fff';g.font='bold 11px sans-serif';g.fillText('$',chx,chy+4);
      }
    }
    drawBoard(null,null,-1);
    var btn=c.querySelector('#drop');
    btn.onclick=function(){
      if(chips<=0)return;
      Sound.click();btn.disabled=true;
      chips--;
      // precompute path
      var pts=[],x=W/2,y=56;
      pts.push([x,y]);
      for(var r=0;r<ROWS;r++){
        y=startY+r*rowH;
        x+=(Math.random()<0.5?-1:1)*(10+Math.random()*12);
        x=Math.max(24,Math.min(W-24,x));
        pts.push([x,y]);
      }
      var slot=Math.max(0,Math.min(8,Math.floor(x/(W/9))));
      pts.push([slot*(W/9)+(W/9)/2,H-64]);
      var si=0;
      (function step(){
        if(!c.isConnected)return;
        if(si<pts.length){
          drawBoard(pts[si][0],pts[si][1],-1);
          Sound.beep(420+si*38,0.05);
          si++;
          setTimeout(step,110);
        }else{
          var win=SLOTS[slot];
          total+=win;
          drawBoard(pts[pts.length-1][0],pts[pts.length-1][1],slot);
          if(win>0)Sound.win();else Sound.lose();
          var st=c.querySelector('#pst');
          if(st)st.innerHTML='Chips: '+chips+' &nbsp;•&nbsp; Total: <b>'+g1Money(total)+'</b>'
            +(win>0?' — landed <b>'+g1Money(win)+'</b>!':' — landed $0');
          if(chips>0){
            btn.disabled=false;
          }else{
            setTimeout(function(){
              if(!c.isConnected)return;
              c.innerHTML='<div style="max-width:420px;margin:0 auto;text-align:center"><div class="card center">'
                +'<div class="big">🔴 Plinko total</div>'
                +'<div class="status" style="font-size:26px"><b>'+g1Money(total)+'</b></div>'
                +'</div></div>';
              finish(total);
            },1400);
          }
        }
      })();
    };
  }
  askItem();
};

/* ================= CLIFF HANGERS ================= */
PG.cliff=function(c,items,done){
  var over=false;
  function finish(v){if(over)return;over=true;done(v);}
  var quiz=items.slice(0,3),qi=0,steps=0;
  var STEPS=25;
  function stepPos(i){
    return {left:(5+i*3.55),bottom:(6+i*2.85)};
  }
  function sceneHTML(){
    var h='<div style="position:relative;height:290px;border-radius:12px;overflow:hidden;'
      +'background:linear-gradient(#aee2ff 0%,#cdeffd 55%,#b8e6b8 100%);'
      +'border:10px solid #9a9a9a;outline:4px solid #6b6b6b">';
    // mountain
    h+='<div style="position:absolute;right:-6%;bottom:6%;width:78%;height:88%;'
      +'background:linear-gradient(135deg,#8e7cc3,#5b4b8a);'
      +'clip-path:polygon(50% 0,100% 100%,0 100%)"></div>';
    h+='<div style="position:absolute;right:24.5%;bottom:70.5%;width:17%;height:24%;background:#fff;'
      +'clip-path:polygon(50% 0,100% 100%,0 100%)"></div>';
    // clouds
    h+='<div style="position:absolute;left:8%;top:10%;font-size:30px">☁️</div>';
    h+='<div style="position:absolute;left:32%;top:4%;font-size:24px">☁️</div>';
    // flowers + rocks
    h+='<div style="position:absolute;left:12%;bottom:6%;font-size:22px">🌼 🌸 🌼</div>';
    h+='<div style="position:absolute;right:8%;bottom:4%;font-size:22px">🪨</div>';
    // path steps
    for(var i=0;i<STEPS;i++){
      var p=stepPos(i);
      h+='<div class="chst" data-i="'+i+'" style="position:absolute;left:'+p.left+'%;bottom:'+p.bottom+'%;'
        +'width:26px;height:12px;background:#ffd60a;border:1px solid #a07d00;border-radius:3px;'
        +'transform:translate(-50%,50%) rotate(-38deg);font-size:8px;color:#5b4300;text-align:center;line-height:12px">'+(i+1)+'</div>';
    }
    // climber
    h+='<div id="climb" style="position:absolute;font-size:30px;transform:translate(-50%,30%);transition:left .5s,bottom .5s">🧗</div>';
    h+='</div>';
    return h;
  }
  function placeClimber(){
    var el=c.querySelector('#climb');
    if(!el)return;
    if(steps>STEPS){
      el.style.left='96%';el.style.bottom='-4%';
      el.innerHTML='💥';
      return;
    }
    var p=stepPos(Math.min(steps,STEPS-1));
    el.style.left=p.left+'%';el.style.bottom=p.bottom+'%';
  }
  function render(){
    if(!c.isConnected)return;
    var h='<h2 style="text-align:center;margin:6px 0"><span style="background:#8b5a2b;color:#ffe9c4;'
      +'padding:4px 14px;border-radius:8px;letter-spacing:2px">CLIFF HANGERS</span></h2>'
      +'<div style="max-width:420px;margin:0 auto">'+sceneHTML()
      +'<div class="card" style="margin-top:8px"><div class="status" style="font-size:17px">Yodeler at step <b>'+steps+'</b> / '+STEPS+'</div><div id="cres"></div></div>'
      +'</div>';
    c.innerHTML=h;
    placeClimber();
    nextItem();
  }
  function nextItem(){
    if(!c.isConnected)return;
    if(qi>=quiz.length){
      // survived!
      Sound.win();
      var r=c.querySelector('#cres');
      if(r)r.innerHTML='<div class="ok" style="font-size:19px">🏆 He made it! You win <b>$5,000</b>!</div>';
      setTimeout(function(){if(!c.isConnected)return;finish(5000);},1600);
      return;
    }
    var it=quiz[qi];
    var card=document.createElement('div');
    card.className='card';card.style.marginTop='8px';
    card.innerHTML='<div class="big" style="font-size:19px">🛒 '+esc(it.name)+'</div>'
      +'<div class="muted" style="margin:6px 0">Guess the price! (Error in whole $ = steps climbed)</div>'
      +'<div style="display:flex;gap:8px"><input id="cg" type="number" step="0.01" min="0" inputmode="decimal" placeholder="$" '
      +'style="flex:1;min-height:52px;font-size:20px;border-radius:10px;border:2px solid var(--line);padding:0 12px;background:var(--card2);color:inherit">'
      +'<button class="btn" id="cgo" style="min-height:52px;font-size:18px">Guess</button></div>';
    c.querySelector('.card').appendChild(card);
    var go=function(){
      Sound.click();
      var gv=parseFloat(card.querySelector('#cg').value);
      if(isNaN(gv)||gv<0){return;}
      var err=Math.round(Math.abs(gv-it.price));
      steps+=err;
      qi++;
      card.innerHTML='<div>Your guess: <b>'+g1Money(gv)+'</b> — actual: <b>'+g1Money(it.price)+'</b></div>'
        +'<div class="status">Off by <b>$'+err+'</b> → climber moves to step <b>'+Math.min(steps,STEPS)+'</b></div>';
      placeClimber();
      if(steps>STEPS){
        Sound.lose();
        setTimeout(function(){
          if(!c.isConnected)return;
          var r=c.querySelector('#cres');
          if(r)r.innerHTML='<div class="err" style="font-size:19px">😱 He fell off the cliff! You win <b>$0</b></div>';
          setTimeout(function(){if(!c.isConnected)return;finish(0);},1600);
        },700);
      }else{
        if(err===0)Sound.win();else Sound.beep(300+err*20,0.15);
        setTimeout(function(){if(!c.isConnected)return;nextItem();},1500);
      }
    };
    card.querySelector('#cgo').onclick=go;
  }
  render();
};

/* ================= ANY NUMBER ================= */
PG.anyNumber=function(c,items,done){
  var over=false;
  function finish(v){if(over)return;over=true;done(v);}
  var PRIZES=['CONSOLE','TRIP','TV SET','WATCH'];
  var pname=PRIZES[Math.floor(Math.random()*PRIZES.length)];
  var car=20000+Math.floor(Math.random()*10000);        // 5 digits
  var prz=1000+Math.floor(Math.random()*9000);          // 4 digits
  var pig=100+Math.floor(Math.random()*900);            // cents -> d.cc
  var rows=[
    {label:'CAR',digits:String(car).split(''),rev:[false,false,false,false,false],val:25000,kind:'car'},
    {label:pname,digits:String(prz).split(''),rev:[false,false,false,false],val:prz,kind:'prize'},
    {label:'🐷',digits:[String(Math.floor(pig/100)),String(Math.floor((pig%100)/10)),String(pig%10)],rev:[false,false,false],val:pig/100,kind:'piggy',piggy:true}
  ];
  var used={};
  function boardHTML(){
    var h='<div style="max-width:430px;margin:0 auto;text-align:center">'
      +'<div style="background:#5b2a86;border-radius:24px;padding:10px">'
      +'<div style="border-radius:50%;background:radial-gradient(ellipse at 32% 28%,#ffe98a 0%,#eec53f 55%,#b8860b 100%);'
      +'border:5px solid #7a5c00;padding:18px 14px">'
      +'<div style="font-size:30px;font-weight:900;color:#111;letter-spacing:1px;margin-bottom:10px">any number</div>';
    rows.forEach(function(r,ri){
      h+='<div style="background:#e63946;border-radius:8px;margin:8px 0;padding:8px;display:flex;align-items:center;gap:8px">'
        +'<div style="color:#fff;font-weight:900;font-size:'+(r.label.length>5?17:22)+'px;flex:1;text-align:center">'+esc(r.label)+'</div>'
        +'<div style="display:flex;gap:4px;justify-content:center">';
      r.digits.forEach(function(d,di){
        var shown=r.rev[di];
        if(r.piggy&&di===1)h+='<div style="color:#111;font-weight:900;font-size:20px;align-self:center">.</div>';
        h+='<div id="an'+ri+'_'+di+'" style="width:34px;height:44px;background:#111;color:#fff;'
          +'border:2px solid #555;border-radius:4px;font-size:26px;font-weight:700;line-height:42px;text-align:center;font-family:monospace">'
          +(shown?d:'')+'</div>';
      });
      h+='</div></div>';
    });
    h+='</div></div>'
      +'<div class="muted" id="anmsg" style="margin:8px 0;color:#fff;font-size:16px">Pick a digit — first prize fully revealed wins it!</div>'
      +'<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px">';
    for(var d=0;d<10;d++){
      h+='<button class="btn" data-d="'+d+'" style="min-height:56px;font-size:22px'+(used[d]?';opacity:.35':'')+'"'+(used[d]?' disabled':'')+'>'+d+'</button>';
    }
    h+='</div></div>';
    return h;
  }
  function render(){
    if(!c.isConnected)return;
    c.innerHTML='<h2 style="text-align:center;color:#eec53f;margin:6px 0">🔢 Any Number</h2>'+boardHTML();
    var btns=c.querySelectorAll('[data-d]');
    for(var i=0;i<btns.length;i++){
      (function(b){
        b.onclick=function(){pickDigit(b.getAttribute('data-d'));};
      })(btns[i]);
    }
  }
  function pickDigit(ds){
    if(used[ds]||over)return;
    used[ds]=true;Sound.click();
    var hit=false;
    rows.forEach(function(r){
      r.digits.forEach(function(d,di){
        if(d===ds&&!r.rev[di]){r.rev[di]=true;hit=true;}
      });
    });
    if(hit)Sound.beep(700,0.12);else Sound.beep(220,0.15);
    render();
    // check wins: car, then prize, then piggy
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(r.rev.every(function(x){return x;})){
        var msg,amt;
        if(r.kind==='car'){msg='🚗 YOU WIN THE CAR!';amt=r.val;}
        else if(r.kind==='prize'){msg='🎉 YOU WIN THE '+esc(r.label)+' ('+g1Money(r.val)+')!';amt=r.val;}
        else{msg='🐷 PIGGY BANK! You win '+g1Money(r.val)+'!';amt=r.val;}
        Sound.win();
        setTimeout(function(){
          if(!c.isConnected)return;
          c.innerHTML='<div style="max-width:430px;margin:0 auto;text-align:center"><div class="card center">'
            +'<div class="big">'+msg+'</div>'
            +'<div class="status" style="font-size:24px"><b>'+g1Money(amt)+'</b></div></div></div>';
          finish(amt);
        },900);
        return;
      }
    }
    var m=c.querySelector('#anmsg');
    if(m)m.textContent=hit?('Digit '+ds+' revealed!') :('No '+ds+' anywhere — keep going!');
  }
  render();
};

var PG=PG||{};

/* Shared helpers for the pricing games */
PG._util={
  pick:function(items,n){var a=items.slice(),o=[];while(o.length<n&&a.length)o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);return o;},
  shuffle:function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;},
  /* two price options: the real price + a plausible decoy, shuffled */
  priceOpts:function(it){
    var dec=Math.max(0.5,Math.round(it.price*(Math.random()<0.5?0.62:1.38)*100)/100);
    if(dec===it.price)dec=Math.round((it.price+1.25)*100)/100;
    var opts=PG._util.shuffle([{p:it.price,ok:true},{p:dec,ok:false}]);
    return opts;
  },
  btn:function(label,bg){return 'display:inline-block;margin:6px 4px;padding:14px 20px;font-size:17px;font-weight:800;border:none;border-radius:12px;cursor:pointer;min-width:120px;background:'+(bg||'#cf8f3f')+';color:#14100a;';},
  itemCard:function(it){
    return '<div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px;margin:10px 0;">'
      +'<div style="font-size:20px;font-weight:800;">'+esc(it.name)+'</div>'
      +'<div style="opacity:.75;margin:4px 0 8px;">What is the price?</div><div>';
  }
};

/* ================= 3 STRIKES =================
   Dark green board, yellow title, $ tile, 5 digit slots, 3 strike lights.
   Bag: the 5 car-price digits + 3 STRIKE chips. */
PG.strikes=function(c,items,done){
  var ended=false;
  function finish(v){if(ended)return;ended=true;done(v);}
  var price=20000+Math.floor(Math.random()*10000); /* 20000-29999 */
  var digits=String(price).split('');
  var slots=[null,null,null,null,null];
  var bag=PG._util.shuffle(digits.concat(['X','X','X'])); /* X = strike chip */
  var strikes=0,placed=0;

  function slotHtml(){
    var h='<div style="display:flex;gap:6px;justify-content:center;margin:12px 0;">';
    h+='<div style="width:52px;height:64px;line-height:64px;text-align:center;font-size:34px;font-weight:900;border-radius:8px;background:#0f5132;color:#7CFC90;border:2px solid #1d7a4f;">$</div>';
    slots.forEach(function(d){
      h+='<div style="width:52px;height:64px;line-height:64px;text-align:center;font-size:34px;font-weight:900;border-radius:8px;background:#101418;color:#fff;border:2px solid '+(d===null?'#3a4350':'#ffd23f')+';">'
        +(d===null?'&nbsp;':esc(d))+'</div>';
    });
    return h+'</div>';
  }
  function strikeHtml(){
    var h='<div style="display:flex;gap:10px;justify-content:center;margin:10px 0;">';
    for(var i=0;i<3;i++){
      h+='<div style="width:56px;height:56px;line-height:56px;text-align:center;font-size:30px;border-radius:10px;background:'+(i<strikes?'#7a1010':'#1c222b')+';border:2px solid '+(i<strikes?'#ff5a5a':'#3a4350')+';">'
        +(i<strikes?'&#10060;':'<span style="opacity:.35">X</span>')+'</div>';
    }
    return h+'</div>';
  }
  function render(msg){
    c.innerHTML='<div style="max-width:100%;background:#0b3d2e;border:4px solid #14664b;border-radius:16px;padding:16px 12px;text-align:center;color:#fff;">'
      +'<div style="font-size:34px;font-weight:900;color:#ffd23f;letter-spacing:2px;text-shadow:2px 2px 0 #7a5c00;margin-bottom:4px;">3 STRIKES</div>'
      +'<div style="opacity:.8;font-size:13px;margin-bottom:6px;">Draw chips — place all 5 digits before 3 strikes!</div>'
      +slotHtml()+strikeHtml()
      +'<div style="margin:8px 0;font-size:15px;min-height:22px;">'+(msg||'&nbsp;')+'</div>'
      +'<div style="font-size:40px;">&#128717;&#65039;</div><div style="opacity:.7;font-size:13px;">'+bag.length+' chips left in the bag</div>'
      +'<div><button id="pgb-draw" style="'+PG._util.btn()+'">Draw chip</button></div>'
      +'</div>';
    c.querySelector('#pgb-draw').onclick=function(){Sound.click();draw();};
  }
  function draw(){
    if(!bag.length)return;
    var chip=bag.splice(Math.floor(Math.random()*bag.length),1)[0];
    if(chip==='X'){
      strikes++;Sound.lose();Sound.beep(140,.4);
      if(strikes>=3){
        setTimeout(function(){if(!c.isConnected)return;
          c.innerHTML='<div style="max-width:100%;background:#0b3d2e;border:4px solid #14664b;border-radius:16px;padding:24px 12px;text-align:center;color:#fff;">'
            +'<div style="font-size:34px;font-weight:900;color:#ffd23f;">3 STRIKES</div>'
            +'<div style="font-size:60px;margin:10px 0;">&#10060;&#10060;&#10060;</div>'
            +'<div style="font-size:20px;font-weight:800;">STRIKE THREE — you\'re out!</div>'
            +'<div style="opacity:.8;margin-top:8px;">The car was <b>'+g1Money(price)+'</b></div></div>';
          finish(0);
        },900);
        render('<b style="color:#ff7a7a;">STRIKE 3!</b>');
        c.querySelector('#pgb-draw').disabled=true;
        return;
      }
      render('<b style="color:#ff7a7a;">STRIKE '+strikes+'!</b> Careful…');
    }else{
      var idx=-1;
      for(var i=0;i<5;i++){if(slots[i]===null&&digits[i]===chip){idx=i;break;}}
      if(idx<0){for(var j=0;j<5;j++){if(slots[j]===null){idx=j;break;}}}
      slots[idx]=chip;placed++;Sound.beep(500+idx*120,.15);
      if(placed>=5){
        render('You drew a <b>'+esc(chip)+'</b> — that\'s the last digit!');
        setTimeout(function(){if(!c.isConnected)return;
          c.innerHTML='<div style="max-width:100%;background:#0b3d2e;border:4px solid #14664b;border-radius:16px;padding:24px 12px;text-align:center;color:#fff;">'
            +'<div style="font-size:34px;font-weight:900;color:#ffd23f;">3 STRIKES</div>'
            +'<div style="font-size:56px;margin:10px 0;">&#127881;</div>'
            +'<div style="font-size:22px;font-weight:900;">YOU WIN THE CAR!</div>'
            +'<div style="opacity:.85;margin-top:6px;">'+g1Money(price)+' — all 5 digits placed!</div></div>';
          Sound.win();finish(25000);
        },900);
        return;
      }
      render('You drew a <b>'+esc(chip)+'</b> — it goes in the price!');
    }
  }
  render();
};

/* ================= PUNCH-A-BUNCH =================
   Blue board, colorful title, 5x10 grid of 50 gold $ circles.
   Earn up to 5 punches (1 free + 4 from pricing items). */
PG.punch=function(c,items,done){
  var ended=false;
  function finish(v){if(ended)return;ended=true;done(v);}
  var punches=1;
  var its=PG._util.pick(items,4);
  var qi=0;

  var dist=[[25000,1],[10000,2],[5000,4],[2500,8],[1000,10],[500,10],[250,10],[100,5]];
  var board=[];
  dist.forEach(function(d){for(var i=0;i<d[1];i++)board.push(d[0]);});
  board=PG._util.shuffle(board);
  var revealed=new Array(50).fill(false);

  function askItem(){
    if(qi>=its.length){showBoard('You earned <b>'+punches+'</b> punch'+(punches===1?'':'es')+'!');return;}
    var it=its[qi],opts=PG._util.priceOpts(it);
    c.innerHTML='<div style="max-width:100%;background:#1d3fae;border:4px solid #2f5fe0;border-radius:16px;padding:16px 12px;text-align:center;color:#fff;">'
      +'<div style="font-size:26px;font-weight:900;margin-bottom:4px;"><span style="color:#ffd23f;">PUNCH</span><span style="color:#7CFC90;">-A-</span><span style="color:#ff7a7a;">BUNCH</span></div>'
      +'<div style="opacity:.85;font-size:14px;">Item '+(qi+1)+' of '+its.length+' — price it right to earn a punch! (You have '+punches+')</div>'
      +PG._util.itemCard(it)
      +opts.map(function(o,i){return '<button data-i="'+i+'" style="'+PG._util.btn()+'">'+g1Money(o.p)+'</button>';}).join('')
      +'</div></div>';
    Array.prototype.forEach.call(c.querySelectorAll('button[data-i]'),function(b){
      b.onclick=function(){
        Sound.click();
        var o=opts[+b.getAttribute('data-i')];
        if(o.ok){punches=Math.min(5,punches+1);Sound.win();}
        else{Sound.lose();}
        qi++;
        setTimeout(function(){if(!c.isConnected)return;askItem();},700);
      };
    });
  }
  function circleHtml(i){
    if(revealed[i])return '<div style="width:100%;aspect-ratio:1;border-radius:50%;background:#3a2410;color:#ffd23f;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;border:2px solid #6b4a1f;box-sizing:border-box;">'+g1Money(board[i])+'</div>';
    return '<button data-c="'+i+'" style="width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f5b301 70%);border:2px solid #a86e00;color:#7a5200;font-size:15px;font-weight:900;cursor:pointer;padding:0;">$</button>';
  }
  function showBoard(msg){
    var h='<div style="max-width:100%;background:#1d3fae;border:4px solid #2f5fe0;border-radius:16px;padding:14px 10px;text-align:center;color:#fff;">'
      +'<div style="font-size:30px;font-weight:900;letter-spacing:1px;margin-bottom:2px;"><span style="color:#ffd23f;">PUNCH</span><span style="color:#7CFC90;">-A-</span><span style="color:#ff7a7a;">BUNCH</span></div>'
      +'<div style="font-size:14px;opacity:.9;margin-bottom:8px;">Punches left: <b>'+punches+'</b> — tap a circle!</div>'
      +'<div style="font-size:13px;min-height:20px;margin-bottom:8px;">'+(msg||'&nbsp;')+'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:4px;">';
    for(var i=0;i<50;i++)h+=circleHtml(i);
    h+='</div>'
      +'<div style="font-size:11px;opacity:.75;margin-top:8px;">1&times;$25,000&nbsp;&nbsp;2&times;$10,000&nbsp;&nbsp;4&times;$5,000&nbsp;&nbsp;8&times;$2,500&nbsp;&nbsp;10&times;$1,000&nbsp;&nbsp;10&times;$500&nbsp;&nbsp;10&times;$250&nbsp;&nbsp;5&times;$100</div>'
      +'</div>';
    c.innerHTML=h;
    Array.prototype.forEach.call(c.querySelectorAll('button[data-c]'),function(b){
      b.onclick=function(){Sound.click();punchAt(+b.getAttribute('data-c'));};
    });
  }
  function punchAt(i){
    revealed[i]=true;punches--;
    var val=board[i];
    if(val>0)Sound.win();else Sound.lose();
    var canAgain=punches>0;
    var h='<div style="max-width:100%;background:#1d3fae;border:4px solid #2f5fe0;border-radius:16px;padding:24px 12px;text-align:center;color:#fff;">'
      +'<div style="font-size:30px;font-weight:900;margin-bottom:6px;"><span style="color:#ffd23f;">PUNCH</span><span style="color:#7CFC90;">-A-</span><span style="color:#ff7a7a;">BUNCH</span></div>'
      +'<div style="width:110px;height:110px;margin:6px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f5b301 70%);border:3px solid #a86e00;display:flex;align-items:center;justify-content:center;color:#5a3c00;font-size:17px;font-weight:900;">'+g1Money(val)+'</div>'
