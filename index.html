/* ================= MASTER KEY =================
   Green/red sign, two gold locks (CAR $25,000 / TRIP $5,000), keys.
   Price 2 items for up to 2 keys; one key is secretly the MASTER. */
PG.masterkey=function(c,items,done){
  var ended=false;
  function finish(v){if(ended)return;ended=true;done(v);}
  var its=PG._util.pick(items,2);
  var qi=0,keysWon=0;

  function signHtml(){
    return '<div style="display:inline-block;background:#0f5132;border:5px solid #c0392b;border-radius:18px;padding:10px 26px;margin-bottom:10px;box-shadow:0 4px 0 #7a1f14;">'
      +'<div style="font-family:Georgia,serif;font-size:38px;font-weight:900;color:#e8c15a;letter-spacing:1px;text-shadow:2px 2px 0 #5a3c00;">Master<br>Key</div></div>';
  }
  function askItem(){
    if(qi>=its.length){tryLocks();return;}
    var it=its[qi],opts=PG._util.priceOpts(it);
    c.innerHTML='<div style="max-width:100%;background:#12241c;border:4px solid #0f5132;border-radius:16px;padding:16px 12px;text-align:center;color:#fff;">'
      +signHtml()
      +'<div style="opacity:.85;font-size:14px;">Item '+(qi+1)+' of '+its.length+' — price it right to win a key! (Keys: '+keysWon+')</div>'
      +PG._util.itemCard(it)
      +opts.map(function(o,i){return '<button data-i="'+i+'" style="'+PG._util.btn()+'">'+g1Money(o.p)+'</button>';}).join('')
      +'</div></div>';
    Array.prototype.forEach.call(c.querySelectorAll('button[data-i]'),function(b){
      b.onclick=function(){
        Sound.click();
        var o=opts[+b.getAttribute('data-i')];
        if(o.ok){keysWon++;Sound.win();}
        else{Sound.lose();}
        qi++;
        setTimeout(function(){if(!c.isConnected)return;askItem();},700);
      };
    });
  }
  function tryLocks(){
    if(keysWon===0){
      c.innerHTML='<div style="max-width:100%;background:#12241c;border:4px solid #0f5132;border-radius:16px;padding:24px 12px;text-align:center;color:#fff;">'
        +signHtml()+'<div style="font-size:19px;font-weight:800;">No keys won — game over.</div></div>';
      Sound.lose();finish(0);return;
    }
    var keys=[];
    for(var k=0;k<keysWon;k++)keys.push({id:k+1,master:false,used:false});
    keys[Math.floor(Math.random()*keys.length)].master=true; /* one is the MASTER */
    var won=0,tripOpen=false;
    var locks=[
      {name:'CAR',prize:25000},
      {name:'TRIP',prize:5000}
    ];
    var selKey=null;

    function lockHtml(L,idx){
      var gone=(L.name==='TRIP'&&tripOpen);
      return '<div style="flex:1;min-width:130px;background:'+(gone?'#1a2a22':'#3d2c10')+';border:3px solid '+(gone?'#2c3e35':'#e8c15a')+';border-radius:14px;padding:12px 6px;opacity:'+(gone?'.45':'1')+';">'
        +'<div style="font-size:52px;">'+(gone?'&#128275;':'&#128274;')+'</div>'
        +'<div style="font-weight:900;font-size:18px;color:#e8c15a;">'+L.name+'</div>'
        +'<div style="font-size:14px;color:#fff;">'+g1Money(L.prize)+'</div>'
        +(gone?'':'<button data-lock="'+idx+'" style="'+PG._util.btn('#e8c15a')+'padding:10px 12px;font-size:15px;min-width:90px;">Try key</button>')
        +'</div>';
    }
    function render(msg){
      var h='<div style="max-width:100%;background:#12241c;border:4px solid #0f5132;border-radius:16px;padding:16px 12px;text-align:center;color:#fff;">'
        +signHtml()
        +'<div style="font-size:15px;margin-bottom:8px;">Step 1: pick a key, Step 2: pick a lock</div>'
        +'<div style="margin:8px 0;">'
        +keys.map(function(ky){
          var dis=ky.used?'opacity:.35;':'';
          var sel=(selKey===ky)?'outline:3px solid #37c871;':'';
          return '<button data-key="'+ky.id+'" '+(ky.used?'disabled':'')+' style="'+PG._util.btn('#8a6d1f')+dis+sel+'font-size:34px;min-width:80px;padding:10px;">&#128273;</button>';
        }).join('')
        +'</div><div style="font-size:12px;opacity:.7;margin-bottom:8px;">Key '+keys.map(function(ky){return ky.id;}).join(' &amp; ')+' — one is the MASTER key!</div>'
        +'<div style="display:flex;gap:10px;justify-content:center;">'
        +locks.map(function(L,i){return lockHtml(L,i);}).join('')
        +'</div>'
        +'<div style="font-size:15px;min-height:24px;margin:10px 0 4px;">'+(msg||'&nbsp;')+'</div>'
        +'<div style="font-size:14px;">Won so far: <b>'+g1Money(won)+'</b></div>'
        +'</div>';
      c.innerHTML=h;
      Array.prototype.forEach.call(c.querySelectorAll('button[data-key]'),function(b){
        b.onclick=function(){
          Sound.click();
          var id=+b.getAttribute('data-key');
          selKey=keys.filter(function(ky){return ky.id===id;})[0];
          render('Key '+id+' selected — now pick a lock!');
        };
      });
      Array.prototype.forEach.call(c.querySelectorAll('button[data-lock]'),function(b){
        b.onclick=function(){
          if(!selKey){render('Pick a key first!');return;}
          Sound.click();useKey(selKey,locks[+b.getAttribute('data-lock')]);
        };
      });
    }
    function useKey(ky,L){
      ky.used=true;
      var msg='';
      if(L.name==='CAR'&&ky.master){
        won+=30000;tripOpen=true;
        msg='&#127881; <b>MASTER KEY opens the CAR!</b> You win BOTH — '+g1Money(30000)+'!';
        Sound.win();
        render(msg);
        setTimeout(function(){if(!c.isConnected)return;finish(won);},1600);
        return;
      }
      if(L.name==='CAR'){
        msg='&#128274; Key '+ky.id+' doesn\'t fit the car lock…';
        Sound.lose();
      }else if(ky.master){
        won+=5000;tripOpen=true;
        msg='&#128273; MASTER KEY was spent on the trip — '+g1Money(5000)+'. The car stays locked!';
        Sound.win();
        render(msg);
        setTimeout(function(){if(!c.isConnected)return;finish(won);},1600);
        return;
      }else{
        won+=5000;tripOpen=true;
        msg='&#9989; Key '+ky.id+' opens the TRIP — '+g1Money(5000)+'!';
        Sound.win();
      }
      var left=keys.filter(function(ky2){return !ky2.used;}).length;
      selKey=null;
      if(left===0||won>=30000){
        render(msg+'<br><b>Game over!</b>');
        setTimeout(function(){if(!c.isConnected)return;finish(won);},1600);
      }else{
        render(msg);
      }
    }
    render();
  }
  askItem();
};

var PG=PG||{};
/* ============ GAME 1 — HOLE IN ONE ============ */
PG.holeinone=function(c,items,done){
  var over=false;
  function finish(d){if(over)return;over=true;done(d);}
  var its=items.slice(0,6);
  var disp=its.map(function(x,i){return i;});
  for(var i=disp.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=disp[i];disp[i]=disp[j];disp[j]=t;}
  var picks=[],phase='pick',score=0,trueOrder=[];
  function render(){
    var h='<h2>⛳ Hole in One</h2>';
    if(phase==='pick'){
      h+='<div class="muted">Tap the items from <b>CHEAPEST</b> to <b>MOST EXPENSIVE</b>.</div>';
      h+='<div style="display:grid;gap:8px;margin-top:8px">';
      disp.forEach(function(di,k){
        var pk=picks.indexOf(k);
        h+='<button class="btn" data-k="'+k+'"'+(pk>=0?' disabled style="opacity:.55"':'')+'>'
          +(pk>=0?'<b>('+(pk+1)+')</b> ':'')+esc(its[di].name)+'</button>';
      });
      h+='</div>';
      c.innerHTML=h;
      Array.prototype.forEach.call(c.querySelectorAll('[data-k]'),function(b){
        b.onclick=function(){
          Sound.click();
          picks.push(+b.getAttribute('data-k'));
          if(picks.length>=6){reveal();}else{render();}
        };
      });
    }else if(phase==='reveal'){
      h+='<div class="muted">True order (cheapest → priciest):</div><div class="card">';
      trueOrder.forEach(function(k,r){
        var ok=picks[r]===k;
        h+='<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line)">'
          +'<div class="grow">'+(r+1)+'. '+esc(its[disp[k]].name)+' <span class="muted">'+g1Money(its[disp[k]].price)+'</span></div>'
          +'<div>'+(ok?'✅':'❌')+'</div></div>';
      });
      h+='</div><div class="status">You got <b>'+score+'/6</b> in the right spot!</div>';
      h+='<button class="btn" id="pgputtbtn">⛳ Putt for the car!</button>';
      c.innerHTML=h;
      c.querySelector('#pgputtbtn').onclick=function(){Sound.click();putt();};
    }
  }
  function reveal(){
    trueOrder=disp.map(function(di,k){return k;}).sort(function(a,b){return its[disp[a]].price-its[disp[b]].price;});
    score=0;
    for(var r=0;r<6;r++){if(picks[r]===trueOrder[r])score++;}
    phase='reveal';
    Sound.beep(500,.15);
    render();
  }
  function putt(){
    var p=0.15+score*0.13;
    var win=Math.random()<p;
    c.innerHTML='<h2>⛳ The Putt</h2><div class="card center">'
      +'<div class="muted">Win chance: <b>'+Math.round(p*100)+'%</b></div>'
      +'<canvas id="pgputt" width="320" height="140" style="max-width:100%"></canvas>'
      +'<div class="status" id="pgmsg"></div></div>';
    var cv=c.querySelector('#pgputt'),g=cv.getContext('2d');
    var bx=24,hx=268,frames=26,f=0;
    var target=win?hx:hx-46-Math.random()*36;
    function draw(){
      g.clearRect(0,0,320,140);
      g.fillStyle='#2e8b57';g.fillRect(0,40,320,60);
      g.fillStyle='#1f6b43';g.fillRect(0,40,320,8);
      g.font='30px serif';g.fillText('⛳',hx-46,70);
      g.beginPath();g.arc(hx,70,12,0,Math.PI*2);g.fillStyle='#101010';g.fill();
      g.strokeStyle='#cf8f3f';g.lineWidth=2;g.stroke();
      g.beginPath();g.arc(bx,70,8,0,Math.PI*2);g.fillStyle='#fff';g.fill();
      g.strokeStyle='#888';g.lineWidth=1;g.stroke();
    }
    draw();
    var iv=setInterval(function(){
      if(!c.isConnected){clearInterval(iv);return;}
      f++;bx=24+(target-24)*(f/frames);draw();Sound.beep(300+f*22,.05);
      if(f>=frames){
        clearInterval(iv);
        var m=c.querySelector('#pgmsg');if(!m)return;
        if(win){Sound.win();m.innerHTML='<div class="ok big">🏆 IT\'S IN! You win the car — $25,000!</div>';}
        else{Sound.lose();m.innerHTML='<div class="err big">😅 So close!</div>';}
        setTimeout(function(){if(!c.isConnected)return;finish(win?25000:0);},1700);
      }
    },70);
  }
  render();
};
/* ============ GAME 2 — TEN CHANCES ============ */
PG.tenchances=function(c,items,done){
  var over=false;
  function finish(d){if(over)return;over=true;done(d);}
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}

    {name:'RADIO',emoji:'📻',price:ri(80,999)},

  ];
  prizes.forEach(function(p,pi){
    var s=String(p.price);
    if(pi===0)s=s.length<3?('00'+s).slice(-3):s;

    p.rev=p.digits.map(function(){return false;});
    p.won=false;
  });
  var chances=10,sel=0,entry='',msg='';
  function banked(){return prizes.reduce(function(a,p){return a+(p.won?p.price:0);},0);}
  function padHTML(){
    var h='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px">';
    ['1','2','3','4','5','6','7','8','9','0'].forEach(function(d){
      h+='<button class="btn" data-d="'+d+'">'+d+'</button>';
    });
    h+='<button class="btn secondary" data-d="clr">⌫</button>';
    h+='<button class="btn" data-d="go" style="grid-column:span 2">SUBMIT</button>';
    return h+'</div>';
  }
  function render(){
    var h='<div style="background:#2fa84f;border:4px solid #1d7a37;border-radius:10px;padding:10px;max-width:100%">';
    h+='<div style="text-align:center;color:#e23b3b;font-weight:900;font-size:30px;letter-spacing:3px;'
      +'text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff">TEN CHANCES</div>';
    prizes.forEach(function(p,i){
      h+='<div style="display:flex;align-items:center;gap:6px;margin:8px 0">';
      h+='<div style="background:#e23b3b;color:#fff;font-weight:800;font-size:11px;padding:6px 2px;border-radius:4px;width:88px;text-align:center">'+p.emoji+' '+p.name+'</div>';
      h+='<div style="display:flex;gap:3px;flex:1">';
      p.digits.forEach(function(d,k){
        var shown=p.rev[k]||p.won;
        h+='<div style="flex:1;min-width:0;background:'+(p.won?'#ffe08a':'#fff')+';border:2px solid #14532d;'
          +'border-radius:4px;text-align:center;font-weight:900;font-size:20px;padding:4px 0;color:#111">'
          +(shown?d:'&nbsp;')+'</div>';
      });
      h+='</div>'+(p.won?'<div style="color:#fff;font-weight:800;font-size:12px">WON</div>':'')+'</div>';
    });
    h+='<div style="display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap">';
    for(var i=0;i<10;i++){
      var used=i>=(10-chances);
      h+='<div style="width:30px;height:30px;border-radius:50%;background:'+(used?'#555':'#e23b3b')+';'
        +'color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px">'+(i+1)+'</div>';
    }
    h+='</div></div>';
    h+='<div class="muted" style="margin-top:8px">Chances left: <b>'+chances+'</b> — pick a prize, then type its FULL price.</div>';
    h+='<div style="display:flex;gap:6px;margin:6px 0">';
    prizes.forEach(function(p,i){
      h+='<button class="btn small" data-p="'+i+'"'+(p.won?' disabled style="opacity:.5"':'')
        +' style="'+(sel===i&&!p.won?'outline:3px solid var(--gold);':'')+'">'+p.emoji+' '+p.name+'</button>';
    });
    h+='</div>';
    var nd=prizes[sel].digits.length;
    h+='<div class="card center"><div class="big" style="letter-spacing:6px">'
      +esc(entry)+'<span style="opacity:.35">'+'_'.repeat(Math.max(0,nd-entry.length))+'</span></div>'
      +'<div class="muted">'+esc(msg)+'</div>'+padHTML()+'</div>';
    c.innerHTML=h;
    Array.prototype.forEach.call(c.querySelectorAll('[data-p]'),function(b){
      b.onclick=function(){Sound.click();sel=+b.getAttribute('data-p');entry='';msg='';render();};
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-d]'),function(b){
      b.onclick=function(){
        var d=b.getAttribute('data-d');
        if(d==='clr'){entry=entry.slice(0,-1);Sound.click();}
        else if(d==='go'){submit();return;}
        else if(entry.length<prizes[sel].digits.length){entry+=d;Sound.beep(600,.05);}
        render();
      };
    });
  }
  function submit(){
    var p=prizes[sel],nd=p.digits.length;
    if(entry.length<nd){msg='Type all '+nd+' digits!';render();return;}
    chances--;
    var hit=0,k;
    for(k=0;k<nd;k++){if(entry[k]===p.digits[k]&&!p.rev[k]){p.rev[k]=true;hit++;}}
    if(p.rev.every(function(x){return x;})){
      p.won=true;Sound.win();msg='🎉 You won the '+p.name+' ('+g1Money(p.price)+')!';
      for(k=0;k<prizes.length;k++){if(!prizes[k].won){sel=k;break;}}

  }

};
/* ============ GAME 3 — GOLDEN ROAD ============ */
PG.goldenroad=function(c,items,done){

  function render(){

        +'</div>';

      +'<div class="big" style="letter-spacing:8px;margin-top:4px">'+esc(entry)
      +'<span style="opacity:.35">'+'_'.repeat(Math.max(0,2-entry.length))+'</span></div>'

/* ============ GAME 4 — CLOCK GAME ============ */
PG.clockgame=function(c,items,done){
  var over=false;
  function finish(d){if(over)return;over=true;done(d);}
  var its=items.slice(0,2),idx=0,entry='',msg='',t=30,iv=null;
  function drawClock(){
    var cv=c.querySelector('#pgclock');if(!cv)return;
    var g=cv.getContext('2d'),cx=60,cy=60,R=52,m;
    g.clearRect(0,0,120,120);
    g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.fillStyle='#ffe14d';g.fill();
    g.lineWidth=4;g.strokeStyle='#333';g.stroke();
    for(m=0;m<30;m+=5){
      var a=-Math.PI/2+m/30*Math.PI*2;
      g.beginPath();
      g.moveTo(cx+Math.cos(a)*(R-9),cy+Math.sin(a)*(R-9));
      g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
      g.lineWidth=3;g.strokeStyle='#333';g.stroke();
      g.fillStyle='#333';g.font='9px sans-serif';g.textAlign='center';
      g.fillText(String(m),cx+Math.cos(a)*(R-18),cy+Math.sin(a)*(R-18)+3);
    }
    var ha=-Math.PI/2+(t/30)*Math.PI*2;
    g.beginPath();g.moveTo(cx,cy);
    g.lineTo(cx+Math.cos(ha)*(R-15),cy+Math.sin(ha)*(R-15));
    g.lineWidth=4;g.strokeStyle=t<10?'#e23b3b':'#111';g.stroke();
    g.beginPath();g.arc(cx,cy,5,0,Math.PI*2);g.fillStyle='#111';g.fill();
  }
  function render(){
    var it=its[idx];
    var h='<div style="border:6px solid #1a56db;border-radius:14px;padding:10px;max-width:100%;background:#0d1420">';
    h+='<div style="display:flex;gap:8px;align-items:center;justify-content:center">';
    h+='<div style="background:#22c55e;border-radius:8px;width:92px;height:92px;display:flex;align-items:center;justify-content:center;font-size:44px">🛒</div>';
    h+='<div style="background:#e23b3b;border-radius:8px;padding:6px"><canvas id="pgclock" width="120" height="120" style="width:96px;height:96px"></canvas></div>';
    h+='</div>';
    h+='<div style="background:#f97316;border-radius:8px;margin-top:8px;padding:6px;text-align:center;'
      +'color:#111;font-weight:900;font-size:24px;letter-spacing:2px">CLOCK GAME</div>';
    h+='<div id="pgtime" style="text-align:center;color:'+(t<10?'#e23b3b':'#fff')+';font-size:34px;font-weight:900;margin-top:4px">'
      +t.toFixed(1)+'</div>';
    h+='<div class="card center" style="margin-top:6px"><div class="muted">Item '+(idx+1)+' of 2 — guess the EXACT price!</div>'
      +'<div class="big">'+esc(it.name)+'</div>'
      +'<div class="big" style="letter-spacing:2px">$'+esc(entry||'—')+'</div>'
      +'<div class="muted" style="min-height:20px;font-weight:800">'+esc(msg)+'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px">';
    ['1','2','3','4','5','6','7','8','9','.','0'].forEach(function(d){
      h+='<button class="btn" data-d="'+d+'">'+d+'</button>';
    });
    h+='<button class="btn secondary" data-d="clr">⌫</button>';
    h+='<button class="btn" data-d="go" style="grid-column:span 2">⏎ GUESS</button>';
    h+='</div></div></div>';
    c.innerHTML=h;
    drawClock();
    Array.prototype.forEach.call(c.querySelectorAll('[data-d]'),function(b){
      b.onclick=function(){
        var d=b.getAttribute('data-d');
        if(d==='clr'){entry=entry.slice(0,-1);Sound.click();}
        else if(d==='go'){submit();return;}
        else if(entry.length<7){entry+=d;Sound.beep(600,.05);}
        render();
      };
    });
  }
  function tick(){
    if(!c.isConnected){clearInterval(iv);return;}
    t=Math.max(0,Math.round((t-0.1)*10)/10);
    var te=c.querySelector('#pgtime');
    if(te){te.textContent=t.toFixed(1);te.style.color=t<10?'#e23b3b':'#fff';}
    drawClock();
    if(t<=0){clearInterval(iv);iv=null;lose();}
  }
  function submit(){
    var it=its[idx],g=parseFloat(entry);
    if(isNaN(g)){msg='Type a price first!';render();return;}
    if(Math.abs(g-it.price)<0.005){
      Sound.win();idx++;entry='';
      if(idx>=2){clearInterval(iv);iv=null;win();return;}
      msg='✅ Nailed it! Next item:';render();return;
    }
    msg=g<it.price?'⬆️ HIGHER':'⬇️ LOWER';
    Sound.beep(g<it.price?750:420,.08);
    render();
  }
  function win(){
    c.innerHTML='<div class="card center"><div class="big">🏆 Both prices nailed with '+t.toFixed(1)+'s left!</div>'
      +'<div class="ok">You win $5,000!</div></div>';
    setTimeout(function(){if(!c.isConnected)return;finish(5000);},1700);
  }
  function lose(){
    c.innerHTML='<div class="card center"><div class="big">⏰ Time\'s up!</div><div class="muted">'
      +its.map(function(x){return esc(x.name)+': <b>'+g1Money(x.price)+'</b>';}).join('<br>')
      +'</div></div>';
    setTimeout(function(){if(!c.isConnected)return;finish(0);},1700);
  }
  render();
  iv=setInterval(tick,100);
};

regGame('price',{howto:"Bid closest without going over in Contestant's Row, then play 3 pricing games to win cash and prizes. Spin the Showdown wheel (closest to $1.00 without going over wins), then bid the total of your Showcase - closest without going over takes it all.",name:'The Price Is Right',icon:'🏷️',tags:'Game Show',pvp:true,seats:2,
render:function(c,ctx){

        if(played>=3)showdown();else row();

    }
    function showdown(){
      var bot=bots[0],vals=[],i;
      for(i=1;i<=20;i++)vals.push(i*5);
      var ySpins=[],bSpins=[],spinning=false;
      c.innerHTML='<h2 style="text-align:center;color:#eab676;margin:6px 0">\uD83C\uDFA1 SHOWCASE SHOWDOWN</h2>'
        +'<div style="max-width:380px;margin:0 auto;text-align:center">'
        +'<canvas id="sw" width="360" height="360" style="width:100%;max-width:360px"></canvas>'

        +'<button class="btn" id="sp">SPIN</button></div>';
      var cv=c.querySelector('#sw'),g=cv.getContext('2d'),rot=-Math.PI/2,N=20,arc=Math.PI*2/N;
      function paint(){
        if(!c.isConnected)return;
        var cx=180,cy=180,R=168,x;
        g.clearRect(0,0,360,360);
        for(x=0;x<N;x++){
          var a0=rot+x*arc,a1=a0+arc;
          g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a0,a1);g.closePath();
          g.fillStyle=x%2?'#a66a24':'#7a1f1f';g.fill();
          g.lineWidth=2;g.strokeStyle='#0d1420';g.stroke();
          g.save();g.translate(cx,cy);g.rotate(a0+arc/2);
          g.fillStyle='#fff';g.font='bold 15px sans-serif';g.textAlign='right';g.textBaseline='middle';
          g.fillText(vals[x],R-10,0);g.restore();

        g.beginPath();g.arc(cx,cy,26,0,Math.PI*2);g.fillStyle='#0d1420';g.fill();

        g.fillText('$',cx,cy+1);

        g.fillStyle='#eab676';g.fill();
      }
      paint();
      function spinFor(dur,cb){
        var res=vals[Math.floor(Math.random()*N)],idx=vals.indexOf(res);
        var target=-Math.PI/2-(idx*arc+arc/2);
        var TAU=Math.PI*2;
        var cur=((rot%TAU)+TAU)%TAU,tgt=((target%TAU)+TAU)%TAU;
        var delta=(tgt-cur+TAU)%TAU+TAU*5;
        var r0=rot,r1=rot+delta,t0=null,lastW=-1;
        spinning=true;var btn=c.querySelector('#sp');if(btn)btn.disabled=true;
        Sound.click();
        function frame(t){
          if(!c.isConnected){spinning=false;return;}
          if(!t0)t0=t;
          var pr=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-pr,3);
          rot=r0+(r1-r0)*e;paint();
          var w=Math.floor(((rot+Math.PI/2)%TAU+TAU)%TAU/arc);
          if(w!==lastW){lastW=w;Sound.beep(700,.04);}
          if(pr<1)requestAnimationFrame(frame);
          else{spinning=false;if(btn)btn.disabled=false;cb(res);}
        }

      c.querySelector('#sp').onclick=function(){

  /* board + guess row; onGuess(text) on submit */
  function askRound(title,s,revealed,strikes,rp,extra,onGuess){
    var h='<h2>'+title+'</h2><div class="card">'+boardHTML(s,revealed,strikes,rp)+famPodiums()+(extra||'')
      +'<div class="row"><input id="g" class="grow" placeholder="Your guess…" autocomplete="off"><button class="btn small" id="go">Guess</button></div></div>';
    c.innerHTML=h;
    var inp=c.querySelector('#g');
    function go(){var v=inp.value.trim();if(!v)return;Sound.click();onGuess(v);}
    c.querySelector('#go').onclick=go;
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  }
  function findMatch(v,s,revealed,topFirst){
    var idx=-1;
    s.answers.forEach(function(a,i){
      if(revealed&&revealed.indexOf(i)>=0)return;
      if(SHG.feudMatch(v,a.t)&&(idx<0||(topFirst&&a.pts>s.answers[idx].pts)))idx=i;
    });
    return idx;
  }
  function botRoundGuess(s,revealed){
    var rem=[];
    s.answers.forEach(function(a,i){if(revealed.indexOf(i)<0)rem.push(i);});
    if(!rem.length||Math.random()>0.7)return -1;
    return rem[Math.floor(Math.random()*rem.length)];
  }
  /* ================= CPU: official format ================= */
  function cpuPlay(survs){
    var botNames=g1Bots(9);
    var myFam={name:famName(playerFam),members:[playerFam].concat(botNames.slice(0,4)),score:0,champ:0};
    var botFam={name:famName(botNames[4]),members:botNames.slice(4,9),score:0,champ:0};
    var ri=0;
    faceoff();
    function mult(){return ri===0?1:(ri===1?2:3);}
    function multLabel(){return ri===0?'SINGLE':(ri===1?'DOUBLE':'TRIPLE');}
    function podiumWrap(){
      podiumScores={a:{name:myFam.name,score:myFam.score},b:{name:botFam.name,score:botFam.score}};
      return famPodiums();
    }
    /* ----- face-off ----- */
    function faceoff(){
      var s=survs[ri%survs.length];
      var myChamp=myFam.members[myFam.champ%5],botChamp=botFam.members[botFam.champ%5];
      myFam.champ++;botFam.champ++;
      c.innerHTML='<h2>⚡ FACE-OFF — Round '+(ri+1)+' <span class="muted">('+multLabel()+' points)</span></h2><div class="card">'
        +'<div class="ff-q">'+esc(s.q)+'</div>'
        +'<div class="center muted">👪 Your champion: <b>'+esc(myChamp)+'</b> &nbsp;vs&nbsp; 🤖 Their champion: <b>'+esc(botChamp)+'</b></div>'
        +'<div class="center" style="margin:10px 0"><button class="btn" id="buzz">🔔 BUZZ IN</button></div><div id="bz"></div>'
        +podiumWrap()+'</div>';
      var over=false;
      var botT=setTimeout(function(){if(!over){over=true;botBuzzed();}},1500+Math.random()*2500);
      c.querySelector('#buzz').onclick=function(){
        if(over)return;over=true;clearTimeout(botT);Sound.click();playerBuzzed();
      };
      function note(h){var z=c.querySelector('#bz');if(z)z.innerHTML=h;}
      function playerBuzzed(){
        note('<div class="row"><input id="fa" class="grow" placeholder="Your answer…" autocomplete="off"><button class="btn small" id="fag">Answer</button></div>');
        var inp=c.querySelector('#fa');
        function go2(){var v=inp.value.trim();if(!v)return;var pr=findMatch(v,s,null,true);
          note('<div class="status">You answered '+(pr>=0?'"'+esc(s.answers[pr].t)+'" (#'+(pr+1)+')':'nothing on the board')+'…</div>');
          setTimeout(function(){if(c.isConnected)botAnswers(pr);},1100);}
        c.querySelector('#fag').onclick=go2;
        inp.addEventListener('keydown',function(e){if(e.key==='Enter')go2();});
      }
      function botBuzzed(){
        note('<div class="status">🤖 '+esc(botChamp)+' buzzed in first!</div>');
        setTimeout(function(){if(!c.isConnected)return;
          var br=botFaceAnswer(s);
          note('<div class="status">🤖 '+esc(botChamp)+' answered '+(br>=0?'"'+esc(s.answers[br].t)+'" (#'+(br+1)+')':'nothing on the board')+'. Your answer:</div>'
            +'<div class="row"><input id="fa" class="grow" placeholder="Your answer…" autocomplete="off"><button class="btn small" id="fag">Answer</button></div>');
          var inp=c.querySelector('#fa');
          function go3(){var v=inp.value.trim();if(!v)return;var pr=findMatch(v,s,null,true);decide(pr,br);}
          c.querySelector('#fag').onclick=go3;
          inp.addEventListener('keydown',function(e){if(e.key==='Enter')go3();});
        },1100);
      }
      function botAnswers(pr){
        var br=botFaceAnswer(s);
        note('<div class="status">🤖 '+esc(botChamp)+' answered '+(br>=0?'"'+esc(s.answers[br].t)+'" (#'+(br+1)+')':'nothing on the board')+'.</div>');
        setTimeout(function(){if(c.isConnected)decide(pr,br);},1100);
      }
      function decide(pRank,bRank){
        var pw=pRank>=0,bw=bRank>=0,winner,wrank;
        if(pw&&(!bw||pRank<=bRank)){winner='me';wrank=pRank;}
        else if(bw&&(!pw||bRank<pRank)){winner='bot';wrank=bRank;}
        else{
          note('<div class="status">Both missed — buzz again!</div><div class="center" style="margin-top:8px"><button class="btn" id="bz2">🔔 BUZZ IN</button></div>');
          var o2=false;
          var t2=setTimeout(function(){if(!o2){o2=true;botBuzzed();}},1500+Math.random()*2500);
          c.querySelector('#bz2').onclick=function(){if(o2)return;o2=true;clearTimeout(t2);Sound.click();playerBuzzed();};
          return;
        }
        var wName=winner==='me'?myChamp:botChamp;
        if(wrank===0){
          note('<div class="ok">🏆 '+esc(wName)+' hit the #1 answer — '+(winner==='me'?'your':'their')+' family PLAYS!</div>');
          setTimeout(function(){if(c.isConnected)playRound(s,winner==='me'?myFam:botFam,winner==='me'?botFam:myFam);},1600);
        }else if(winner==='me'){
          note('<div class="ok">You won the face-off with #'+(wrank+1)+'!</div><div class="row" style="margin-top:8px"><button class="btn grow" id="pPlay">▶ PLAY</button><button class="btn secondary grow" id="pPass">⏭ PASS</button></div>');
          c.querySelector('#pPlay').onclick=function(){Sound.click();playRound(s,myFam,botFam);};
          c.querySelector('#pPass').onclick=function(){Sound.click();note('<div class="muted">You pass — the '+esc(botFam.name)+' plays.</div>');setTimeout(function(){if(c.isConnected)playRound(s,botFam,myFam);},1200);};
        }else{
          var plays=Math.random()<0.85;
          note('<div class="status">🤖 '+esc(botChamp)+' won with #'+(wrank+1)+' — the '+esc(botFam.name)+' '+(plays?'will PLAY.':'PASSES! Your family plays.')+'</div>');
          setTimeout(function(){if(c.isConnected)playRound(s,plays?botFam:myFam,plays?myFam:botFam);},1600);
        }
      }
    }
    function botFaceAnswer(s){
      var r=Math.random();
      if(r<0.45)return 0;
      if(r<0.75)return 1+Math.floor(Math.random()*Math.min(2,s.answers.length-1));
      return -1;
    }
    /* ----- main round ----- */
    function playRound(s,playing,other){
      var revealed=[],strikes=0,bank=0,mi=0,m=mult();
      ask();
      function ask(msg){
        podiumScores={a:{name:myFam.name,score:myFam.score},b:{name:botFam.name,score:botFam.score}};
        var isMe=playing===myFam;
        var who=playing.members[mi%playing.members.length];mi++;
        var head='<h2>👪 Round '+(ri+1)+' — '+esc(playing.name)+' <span class="muted">('+multLabel()+' pts)</span></h2>';
        if(isMe){
          c.innerHTML=head+'<div class="card">'+boardHTML(s,revealed,strikes,bank)+famPodiums()
            +'<div class="muted">'+esc(who)+' answers for the family:</div>'
            +(msg?'<div class="msg">'+msg+'</div>':'')
            +'<div class="row"><input id="g" class="grow" placeholder="Your guess…" autocomplete="off"><button class="btn small" id="go">Guess</button></div></div>';
          var inp=c.querySelector('#g');
          function go(){var v=inp.value.trim();if(!v)return;Sound.click();onGuess(v);}
          c.querySelector('#go').onclick=go;
          inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
        }else{
          c.innerHTML=head+'<div class="card">'+boardHTML(s,revealed,strikes,bank)+famPodiums()
            +'<div class="muted">🤖 '+esc(who)+' is thinking…</div>'+(msg?'<div class="msg">'+msg+'</div>':'')+'</div>';
          setTimeout(function(){if(!c.isConnected)return;
            var bi=botRoundGuess(s,revealed);
            onGuess(bi>=0?s.answers[bi].t:'zzz-no-match-zzz');
          },1200);
        }
      }
      function onGuess(v){
        var idx=findMatch(v,s,revealed,false);
        if(idx>=0){
          revealed.push(idx);var pts=s.answers[idx].pts*m;bank+=pts;Sound.win();
          if(revealed.length>=s.answers.length){endRound();return;}
          ask('✅ "'+esc(s.answers[idx].t)+'" — '+pts+' pts!');
        }else{
          strikes++;Sound.lose();
          if(strikes>=3){
            ask('💥 STRIKE 3!');
            var gi=c.querySelector('#g'),gb=c.querySelector('#go');
            if(gi)gi.disabled=true;if(gb)gb.disabled=true;
            setTimeout(function(){if(c.isConnected)steal();},1700);
            return;
          }
          ask('❌ Strike '+strikes+'!');
        }
      }
      function steal(){
        var isMe=other===myFam;
        var h='<h2>🥷 STEAL ATTEMPT — '+esc(other.name)+'</h2><div class="card">'+boardHTML(s,revealed,strikes,bank)+famPodiums()
          +'<div class="muted">One answer to steal the '+bank+'-pt bank!</div>';
        if(isMe){
          c.innerHTML=h+'<div class="row"><input id="sg" class="grow" placeholder="Steal answer…" autocomplete="off"><button class="btn small" id="sgo">Steal!</button></div></div>';
          var inp=c.querySelector('#sg');
          function goS(){var v=inp.value.trim();if(!v)return;var mi2=findMatch(v,s,revealed,false);doSteal(mi2>=0,mi2>=0?s.answers[mi2].t:null);}
          c.querySelector('#sgo').onclick=goS;
          inp.addEventListener('keydown',function(e){if(e.key==='Enter')goS();});
        }else{
          c.innerHTML=h+'<div class="muted">🤖 '+esc(other.members[0])+' is thinking…</div></div>';
          setTimeout(function(){if(!c.isConnected)return;
            var bi=botRoundGuess(s,revealed);
            doSteal(bi>=0,bi>=0?s.answers[bi].t:null);
          },1400);
        }
        function doSteal(ok,what){
          if(ok){other.score+=bank;Sound.win();msg2('🥷 STOLEN! '+esc(other.name)+' takes '+bank+' pts'+(what?' with "'+esc(what)+'"':'')+'!');}
          else{playing.score+=bank;Sound.lose();msg2('🛡️ Steal failed! '+esc(playing.name)+' keeps '+bank+' pts.');}
        }
        function msg2(t){
          c.innerHTML='<div class="card center"><div class="big">'+t+'</div><div class="muted">'+esc(myFam.name)+': '+myFam.score+' · '+esc(botFam.name)+': '+botFam.score+'</div></div>';
          setTimeout(nextRound,1800);
        }
      }
      function endRound(){
        playing.score+=bank;
        c.innerHTML='<div class="card center"><div class="big">🎉 '+esc(playing.name)+' cleared the board! +'+bank+' pts</div><div class="muted">'+esc(myFam.name)+': '+myFam.score+' · '+esc(botFam.name)+': '+botFam.score+'</div></div>';
        setTimeout(nextRound,1800);
      }
      function nextRound(){
        if(!c.isConnected)return;
        if(myFam.score>=300||botFam.score>=300){
          if(myFam.score>=botFam.score)fastMoney();
          else botWins();
          return;
        }
        ri++;faceoff();
      }
    }
    function botWins(){
      Sound.lose();
      c.innerHTML='<div class="card center"><div class="big">🤖 '+esc(botFam.name)+' reached 300 first!</div><div class="err">Your family loses this one.</div><div class="muted">'+esc(myFam.name)+': '+myFam.score+' · '+esc(botFam.name)+': '+botFam.score+'</div></div>';
    }
    /* ----- fast money: 2 players, 20s + 25s, 200 to win ----- */
    function fastMoney(){
      var qs=survs.slice(-5),pts1=0,pts2=0,answers1=[];
      c.innerHTML='<h2>⚡ FAST MONEY</h2><div class="card center"><div class="muted">Your family hit 300! Two players, 5 questions.<br>You go first — <b>20 seconds</b> on the clock. No repeats for player 2!</div><button class="btn" id="fmgo" style="margin-top:10px">Start the clock</button></div>';
      c.querySelector('#fmgo').onclick=function(){Sound.click();p1();};
      function p1(){
        var qi=0,timeLeft=20,over=false,done1=false;
        var timer=setInterval(function(){
          timeLeft--;
          var t=c.querySelector('#ft');if(t)t.textContent=Math.max(0,timeLeft)+'s';
          if(timeLeft<=0){clearInterval(timer);p1Done();}
        },1000);
        pq();
        function pq(){
          if(over||!c.isConnected)return;
          if(qi>=5){clearInterval(timer);p1Done();return;}
          var q=qs[qi];
          c.innerHTML='<h2>⚡ Fast Money '+(qi+1)+'/5 — ⏱ <span id="ft">'+Math.max(0,timeLeft)+'s</span></h2><div class="card">'
            +'<div class="big" style="font-size:18px">'+esc(q.q)+'</div>'
            +'<div class="row"><input id="fg" class="grow" placeholder="Top answer…" autocomplete="off"><button class="btn small" id="fgo">Answer</button><button class="btn small secondary" id="fsk">Skip ⏭</button></div>'
            +'<div class="status">Fast Money: '+pts1+' pts</div></div>';
          var inp=c.querySelector('#fg');
          function fin(skip){
            if(over)return;
            if(!skip){
              var idx=findMatch(inp.value.trim(),q,null,true);
              if(idx>=0){pts1+=q.answers[idx].pts;answers1.push(q.answers[idx].t);Sound.win();}
              else{answers1.push(null);Sound.lose();}
            }else{answers1.push(null);Sound.click();}
            qi++;pq();
          }
          c.querySelector('#fgo').onclick=function(){fin(false);};
          c.querySelector('#fsk').onclick=function(){fin(true);};
          inp.addEventListener('keydown',function(e){if(e.key==='Enter')fin(false);});
        }
        function p1Done(){
          if(done1)return;done1=true;over=true;
          var h='<h2>⚡ Fast Money</h2><div class="card center"><div class="muted">Your 5 answers: <b>'+pts1+' pts</b></div>'
            +'<div class="muted" style="margin-top:8px">Now '+esc(myFam.members[1])+' gets <b>25 seconds</b> — and can\'t repeat your answers!</div>'
            +'<button class="btn" id="p2go" style="margin-top:10px">Start Player 2</button></div>';
          c.innerHTML=h;
          c.querySelector('#p2go').onclick=function(){Sound.click();p2();};
        }
      }
      function p2(){
        var p2i=0,p2t=25,p2log=[],fmDone=false;
        var mate=myFam.members[1];
        var timer=setInterval(function(){
          p2t--;
          var t=c.querySelector('#ft2');if(t)t.textContent=Math.max(0,p2t)+'s';
          if(p2t<=0){clearInterval(timer);fmEnd();}
        },1000);
        next();
        function next(){
          if(!c.isConnected)return;
          if(p2i>=5){clearInterval(timer);fmEnd();return;}
          var q=qs[p2i];
          c.innerHTML='<h2>⚡ '+esc(mate)+' '+(p2i+1)+'/5 — ⏱ <span id="ft2">'+Math.max(0,p2t)+'s</span></h2><div class="card">'
            +'<div class="big" style="font-size:18px">'+esc(q.q)+'</div>'
            +p2log.map(function(l){return '<div class="status">'+l+'</div>';}).join('')
            +'<div class="muted">🤖 '+esc(mate)+' is thinking…</div><div class="status">Fast Money: '+(pts1+pts2)+' pts</div></div>';
          setTimeout(function(){
            if(!c.isConnected)return;
            var used={};
            answers1.forEach(function(a){if(a)used[a.toLowerCase()]=1;});
            var cands=q.answers.filter(function(a){return !used[a.t.toLowerCase()];});
            var pick=null,r=Math.random();
            if(cands.length&&r<0.8)pick=cands[0];
            else if(cands.length&&r<0.9)pick=cands[Math.floor(Math.random()*cands.length)];
            if(pick){pts2+=pick.pts;Sound.win();p2log.push('✅ "'+esc(pick.t)+'" — '+pick.pts+' pts');}
            else{Sound.lose();p2log.push('❌ no match — 0 pts');}
            p2i++;next();
          },1300+Math.random()*1200);
        }
        function fmEnd(){
          if(fmDone)return;fmDone=true;
          clearInterval(timer);
          var total=pts1+pts2,win=total>=200;
          c.innerHTML='<div class="card center"><div class="big">⚡ FAST MONEY: '+total+' pts</div>'
            +'<div class="muted">You: '+pts1+' · '+esc(mate)+': '+pts2+'</div>'
            +(win?'<div class="ok">🏆 200+ POINTS — GRAND PRIZE! '+esc(myFam.name)+' WINS!</div>':'<div class="err">Needed 200 — got '+total+'.</div>')
            +'</div>';
          if(win){Sound.win();(async function(){await Wallet.recordWin('feud');})();}
          else Sound.lose();
        }
      }
    }
  }
  /* ================= PVP: solo rounds, higher total wins ================= */
  function pvpPlay(survs,fin){
    var ri=0,total=0;
    round();
    function round(){
      if(ri>=3){
        c.innerHTML='<div class="card center"><div class="big">Total: '+total+' pts</div><div class="muted">Waiting for opponent…</div></div>';
        fin(total);return;
      }
      var s=survs[ri],revealed=[],strikes=0,rp=0;
      podiumScores={a:{name:famName(playerFam),score:total},b:{name:famName('Rival'),score:'?'}};
      ask();
      function ask(msg){
        askRound('👪 Round '+(ri+1)+' of 3',s,revealed,strikes,rp,(msg?'<div class="msg">'+msg+'</div>':'')+'<div class="muted">Total: '+total+'</div>',onGuess);
      }
      function onGuess(v){
        var idx=findMatch(v,s,revealed,false);
        if(idx>=0){
          revealed.push(idx);rp+=s.answers[idx].pts;Sound.win();
          if(revealed.length>=s.answers.length){total+=rp;ri++;setTimeout(function(){if(c.isConnected)round();},1200);return;}
          ask('✅ +'+s.answers[idx].pts);
        }else{
          strikes++;Sound.lose();
          if(strikes>=3){
            total+=rp;ri++;
            ask('💥 STRIKE 3 — you bank '+rp+' pts.');
            var gi2=c.querySelector('#g'),gb2=c.querySelector('#go');
            if(gi2)gi2.disabled=true;if(gb2)gb2.disabled=true;
            setTimeout(function(){if(c.isConnected)round();},1700);
            return;
          }
          ask('❌ Strike '+strikes);
        }
      }
    }
  }
}});

/* ================= THE CHASE ================= */
regGame('chase',{howto:"60-second CASH BUILDER: $1,000 for every right answer.\n\nTHE OFFERS: The Chaser gives you three deals - a LOW offer that starts you closer to the bank, your built money in the MIDDLE, or a HIGH offer with big money but further away.\n\nTHE CHASE: Go head-to-head down the 7-step tower. Answer right to move down toward the BANK - the Chaser answers right too and hunts you from above. Get caught and you leave with nothing.\n\nFINAL CHASE: Escape and you get 60 seconds to build a head start - every right answer is a step. Then the Chaser gets their questions to run you down. Survive and the money is yours!",name:'The Chase',icon:'🏃',tags:'Game Show',pvp:true,seats:2,
render:function(c,ctx){
  var net=(ctx&&ctx.mode==='pvp')?ctx.net:null;
  if(g1Guard(c,BANKS2.chase.length>=10))return;
  var share=function(){return JSON.parse(JSON.stringify(g1PickN(BANKS2.chase,20)));};
  var chaser=g1Bots(1)[0];
  if(net)g1Pvp(net,share,function(d,fin){solo(d,fin);},function(iw,sc){g1Settle(c,iw,sc,'The Chase');});
  else solo(share(),null);
  /* tower: steps 7(top)..1, bank at 0. red = chaser zone, green = your step */
  function towerHTML(P,C,money){
    var h='<div class="ch-tower">';
    for(var s=7;s>=1;s--){
      var cls='ch-step',w=(58+(7-s)*7);
      if(s>=C)cls+=' red';
      else if(s===P)cls+=' me';
      var label='';
      if(s===C)label='😈';
      else if(s===P)label='🧍 '+g1Money(money);
      h+='<div class="'+cls+'" style="width:'+w+'%">'+(label||'&nbsp;')+'</div>';
    }
    h+='<div class="ch-bank">BANK</div></div>';
    return h;
  }
  function tagsHTML(){
    return '<div class="ch-tags"><span class="ch-tag c">CHASER</span><span class="ch-tag p">PLAYER</span></div>';
  }
  /* The Chase uses 3 answers: drop one wrong choice */
  function threeChoices(q){
    var wrongs=[];q.choices.forEach(function(_,i){if(i!==q.correct)wrongs.push(i);});
    var drop=wrongs[Math.floor(Math.random()*wrongs.length)];
    var out=[];
    q.choices.forEach(function(t,i){if(i!==drop)out.push({t:t,ok:i===q.correct});});
    return out;
  }
  function pickQ(qs,used){return qs[used.i++%qs.length];}
  function solo(qs,fin){
    var qi=0,correct=0;
    c.innerHTML='<h2>🏃 Cash Builder — 60s</h2><div class="card"><div class="status">Correct: <b id="cc">0</b> · ⏱ <span id="tmr">60s</span></div><div class="big" style="font-size:18px" id="q"></div><div id="ch"></div></div>';
    ask();
    g1Timer(c,60,c.querySelector('#tmr'),function(){cashDone();});
    function ask(){
      var q=qs[qi%qs.length];qi++;
      c.querySelector('#q').textContent=q.q;
      g1Choices(c,q,function(i){
        if(i===q.correct){correct++;var cc=c.querySelector('#cc');if(cc)cc.textContent=correct;Sound.win();}
        else Sound.lose();
        if(c.isConnected)ask();
      });
    }
    function cashDone(){
      if(!c.isConnected)return;
      var money=correct*1000,diff=correct>8?'hard':(correct>5?'medium':'easy');
      offers(money,diff);
    }
    /* ----- the offers ----- */
    function offers(money,diff){
      var low=Math.round(money/2/500)*500,mid=money,high=Math.max(10000,Math.round(money*2.5/500)*500);
      var opts=[
        {amt:low,start:3,label:'LOW offer — closer to the bank'},
        {amt:mid,start:4,label:'Your money — middle start'},
        {amt:high,start:5,label:'HIGH offer — big money, further away'}
      ];
      c.innerHTML='<h2>💰 The Offers</h2><div class="card"><div class="muted">😈 '+esc(chaser)+' (the Chaser) offers you three deals. Cash built: <b>'+g1Money(money)+'</b>. Pick your start step:</div>'
        +opts.map(function(o,i){
          return '<button class="btn '+(i===1?'':'secondary ')+'" data-o="'+i+'" style="margin-top:8px">◀ '+g1Money(o.amt)+' ▶<br><span class="muted" style="font-size:13px">'+o.label+' · start '+o.start+' steps from the bank</span></button>';
        }).join('')
        +'</div>';
      c.querySelectorAll('[data-o]').forEach(function(b){
        b.onclick=function(){Sound.click();var o=opts[+b.getAttribute('data-o')];chasePhase(o.amt,o.start,diff);};
      });
    }
    /* ----- head-to-head down the tower ----- */
    function chasePhase(money,start,diff){
      var P=start,C=7,turn=0,used={i:0};
      qTurn();
      function shell(qhtml,chtml){
        return '<h2>🏃 The Chase</h2>'+tagsHTML()
          +'<div class="ch-wrap">'+towerHTML(P,C,money)
          +'<div class="ch-q"><div class="ch-qtext">'+qhtml+'</div><div id="chA">'+chtml+'</div></div></div>';
      }
      function qTurn(){
        var q=pickQ(qs,used),isChaser=turn%2===1;
        if(!isChaser){
          var chs=threeChoices(q);
          c.innerHTML=shell('🧍 Your question: '+esc(q.q),'');
          var box=c.querySelector('#chA');
          chs.forEach(function(ch2){
            var b=document.createElement('button');b.className='ch-a';b.textContent=ch2.t;
            b.onclick=function(){
              box.querySelectorAll('.ch-a').forEach(function(x){x.disabled=true;});
              if(ch2.ok){b.classList.add('ok');P--;Sound.win();}
              else{b.classList.add('bad');Sound.lose();box.querySelectorAll('.ch-a').forEach(function(x){if(x.textContent===q.choices[q.correct])x.classList.add('ok');});}
              step();
            };
            box.appendChild(b);
          });
        }else{
          c.innerHTML=shell('😈 '+esc(chaser)+'\'s question: '+esc(q.q),'<div class="muted">Chaser is thinking…</div>');
          setTimeout(function(){
            if(!c.isConnected)return;
            var ok=SHG.chaseBotCorrect(diff);
            if(ok){C--;Sound.lose();}
            else Sound.win();
            var box=c.querySelector('#chA');
            if(box)box.innerHTML='<div class="'+(ok?'err':'ok')+'">'+(ok?'😈 Chaser correct — moves down!':'✅ Chaser misses!')+'</div>';
            step();
          },1200);
        }
      }
      function step(){
        turn++;
        setTimeout(function(){
          if(!c.isConnected)return;
          if(C<=P){caught();return;}
          if(P<=0){escaped(money);return;}
          qTurn();
        },950);
      }
      function caught(){
        c.innerHTML='<h2>🏃 The Chase</h2><div class="card center"><div class="big">😈 CAUGHT!</div><div class="muted">'+esc(chaser)+' got you — you leave with nothing.</div></div>';Sound.lose();
        if(fin)fin(correct*100);
      }
      function escaped(money){
        if(fin){fin(correct*100+5000);c.innerHTML='<div class="card center"><div class="big">🏦 ESCAPED!</div><div class="muted">You banked '+g1Money(money)+' — waiting for opponent…</div></div>';return;}
        c.innerHTML='<div class="card center"><div class="big">🏦 ESCAPED!</div><div class="muted">You made it to the bank with '+g1Money(money)+'!</div></div>';
        Sound.win();
        setTimeout(function(){if(c.isConnected)finalChase(money);},1700);
      }
    }
    /* ----- final chase ----- */
    function finalChase(money){
      var S=0,qn=0;
      c.innerHTML='<h2>🏁 Final Chase — 60s</h2><div class="card"><div class="muted">Answer fast! Each correct = 1 step of head start.</div><div class="status">Head start: <b id="ss">0</b> · ⏱ <span id="tmr">60s</span></div><div class="big" style="font-size:18px" id="q"></div><div id="ch"></div></div>';
      ask2();
      g1Timer(c,60,c.querySelector('#tmr'),function(){chaseDown();});
      function ask2(){
        var q=qs[qn%qs.length];qn++;
        var qel=c.querySelector('#q');if(!qel)return;qel.textContent=q.q;
        g1Choices(c,q,function(i){
          if(i===q.correct){S++;var ss=c.querySelector('#ss');if(ss)ss.textContent=S;Sound.win();}
          else Sound.lose();
          if(c.isConnected)ask2();
        });
      }
      function chaseDown(){
        if(!c.isConnected)return;
        var need=S+1,got=0,tries=S+2,i=0;
        draw2();
        function draw2(){
          c.innerHTML='<h2>🏁 Final Chase</h2>'+tagsHTML()
            +'<div class="ch-wrap">'+towerHTML(-1,Math.max(1,7-got),money)
            +'<div class="ch-q"><div class="ch-qtext">😈 '+esc(chaser)+' needs <b>'+need+'</b> correct to catch you — so far: <b>'+got+'</b> ('+i+'/'+tries+' asked)</div><div class="muted">'+(got>=need?'':'One wrong answer and the clock runs out on the Chaser…')+'</div></div></div>';
        }
        (function next(){
          if(i>=tries||got>=need){verdict();return;}
          if(SHG.chaseBotCorrect('hard'))got++;
          i++;
          draw2();
          setTimeout(next,700);
        })();
        function verdict(){
          if(got>=need){c.innerHTML='<div class="card center"><div class="big">😈 Caught in the Final Chase!</div><div class="muted">'+esc(chaser)+' ran you down.</div></div>';Sound.lose();}
          else{
            c.innerHTML='<div class="card center"><div class="big">🏆 YOU BEAT THE CHASER!</div><div class="muted">You bank '+g1Money(money)+'</div></div>';
            Sound.win();(async function(){await Wallet.recordWin('chase');})();
          }
        }
      }
    }
  }
}});

regGame('matchgame',{howto:"Fill in the blank with the funniest answer you can think of, then see if the celebrity panel matched you. 2 rounds - most matches wins.",name:'Match Game',icon:'✏️',tags:'Game Show',pvp:true,seats:2,

regGame('password',{howto:"Guess the secret password from one-word clues. You get up to 3 clues per word across 5 words - fewer clues used means more points. Guess right to score!",name:'Password',icon:'🔑',tags:'Game Show',pvp:true,seats:2,
render:function(c,ctx){
  var net=(ctx&&ctx.mode==='pvp')?ctx.net:null;
  if(g1Guard(c,BANKS2.password.length>=5))return;
  var share=function(){return JSON.parse(JSON.stringify(g1PickN(BANKS2.password,5)));};

  else playWords(share(),true,null);
  /* vsBot true → CPU game vs rival bot (recordWin); false → PvP solo (fin(points)) */
  function playWords(words,vsBot,fin){
    var bot=vsBot?g1Bots(1)[0]:null,wi=0,myP=0,botP=0;
    word();
    function word(){
      if(wi>=5){
        if(vsBot){
          var win=myP>botP;
          c.innerHTML='<div class="card center"><div class="big">You: '+myP+' pts<br>'+esc(bot)+': '+botP+' pts</div>'+(win?'<div class="ok">🏆 You win Password!</div>':'<div class="err">😞 '+esc(bot)+' wins.</div>')+'</div>';
          if(win){Sound.win();(async function(){await Wallet.recordWin('password');})();}
          else Sound.lose();
        }else{
          c.innerHTML='<div class="card center"><div class="big">'+myP+' pts</div><div class="muted">Waiting for opponent…</div></div>';
          fin(myP);
        }
        return;
      }
      var w=words[wi],used=0,exch=0;
      draw();
      function scoreLine(){return vsBot?'<div class="status">You: '+myP+' · '+esc(bot)+': '+botP+'</div>':'<div class="status">Points so far: '+myP+'</div>';}
      function draw(msg){
        var h='<h2>🔑 Password — word '+(wi+1)+'/5</h2><div class="card">';
        h+='<div class="muted">Clues revealed: '+used+'/3 · word worth '+SHG.passwordPoints(used)+' pts</div>';
        w.clues.forEach(function(cl,i){h+='<div class="msg">'+(i<used?esc(cl):'🔒 <span class="muted">clue '+(i+1)+' hidden</span>')+'</div>';});
        h+=scoreLine();
        if(msg)h+='<div class="msg">'+msg+'</div>';
        h+='<div class="row"><input id="g" class="grow" placeholder="Guess the password…" autocomplete="off"><button class="btn small" id="go">Guess</button></div>'
          +(used<3?'<button class="btn secondary" id="rv">🔍 Reveal clue '+(used+1)+' of 3</button>':'')
          +'</div>';
        c.innerHTML=h;
        var inp=c.querySelector('#g'),rv=c.querySelector('#rv');
        if(rv)rv.onclick=function(){used++;Sound.click();draw();};
        function guess(){
          var v=inp.value.trim();if(!v)return;Sound.click();
          if(SHG.jeopardyGrade(v,w.word)){myP+=SHG.passwordPoints(used);Sound.win();wi++;word();return;}
          if(vsBot){
            exch++;
            if(Math.random()<0.15+0.25*used){
              botP+=SHG.passwordPoints(used);Sound.lose();wi++;
              c.innerHTML='<div class="card"><div class="err">😈 '+esc(bot)+' steals it! The word was "'+esc(w.word)+'".</div><button class="btn" id="nx">Next word</button></div>';
              c.querySelector('#nx').onclick=function(){Sound.click();word();};return;
            }
            if(exch>=8){wi++;
              c.innerHTML='<div class="card"><div class="muted">Nobody got it — the word was "'+esc(w.word)+'".</div><button class="btn" id="nx">Next word</button></div>';
              c.querySelector('#nx').onclick=function(){Sound.click();word();};return;
            }
            Sound.lose();draw('❌ Wrong! '+esc(bot)+' misses too — reveal a clue or try again.');
          }else{Sound.lose();draw('❌ Wrong — reveal another clue or try again.');}
        }
        c.querySelector('#go').onclick=guess;
        inp.addEventListener('keydown',function(e){if(e.key==='Enter')guess();});
      }
    }
  }
}});

/* ---------- shared pure utils ---------- */
SHG.norm=function(s){ return String(s==null?'':s).toLowerCase().trim().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); };
SHG.lev=function(a,b){
  a=SHG.norm(a); b=SHG.norm(b);
  if(a===b) return 0;
  var m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  var d=[],i,j;
  for(i=0;i<=m;i++){ d[i]=[i]; }
  for(j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++){ for(j=1;j<=n;j++){ d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); } }
  return d[m][n];
};
SHG.fuzzy=function(guess,answer){
  var g=SHG.norm(guess), a=SHG.norm(answer);
  if(!g||!a) return false;
  if(g===a) return true;
  if(a.indexOf(g)>=0||g.indexOf(a)>=0) return true;
  var tol=Math.max(1,Math.floor(a.length/6));
  return SHG.lev(g,a)<=tol;
};

};

/* ================= shared DOM helpers (game-show part) ================= */
function shgGuard(ok,msg){
  if(!ok){ toast(msg||'Question bank is still loading — try again in a bit'); return true; }
  return false;
}
function shgQuizData(room){
  if(!room) return null;
  if(room.quiz!==undefined) return room.quiz;
  if(room.quizData!==undefined) return room.quizData;
  var s=room.state;
  if(s){ if(s.items!==undefined) return s.items; if(s.quiz!==undefined) return s.quiz; if(s.quizData!==undefined) return s.quizData; }
  return null;
}
function shgMyUid(){ return (typeof Auth!=='undefined'&&Auth.user)?Auth.user.uid:null; }
/* QuizPVP flow: host shares content, everyone plays solo, scores submitted, winner settled. */
function shgPvp(net,opt){
  var st={data:null,submitted:false,settled:false,started:false};
  function maybeStart(room){
    if(st.started) return;
    var d=st.data||shgQuizData(room)||shgQuizData(net.room);
    if(d){ st.started=true; st.data=d; opt.onData(d); }
  }
  function checkDone(room){
    if(st.settled||!st.submitted||!room) return;
    var done=false;
    try{ done=QuizPVP.allDone(room.state, room.seats||[]); }catch(e){}
    if(done){
      st.settled=true;
      var w=null;
      try{ w=QuizPVP.winnerUid(room.state?room.state.scores:null); }catch(e){}
      var iWon=!!w&&!!shgMyUid()&&w===shgMyUid();
      try{ opt.onSettle(iWon,room,w); }catch(e){}
      try{ Net.push({status:'done'}); }catch(e2){}
      try{ Voice.leave(); }catch(e3){}
    }
  }
  net.onUpdate(function(room){
    if(!room) return;
    if(room.shgNeedQuiz&&net.isHost()&&st.data){
      try{ QuizPVP.hostSet(net,st.data); }catch(e){ try{ net.push({quiz:st.data,status:'playing'}); }catch(e2){} }
      return;
    }
    maybeStart(room); checkDone(room);
  });
  if(net.isHost()){
    var data=opt.share();
    st.data=data;
    try{ QuizPVP.hostSet(net,data); }catch(e){ try{ net.push({quiz:data,status:'playing'}); }catch(e2){} }
  }
  maybeStart(net.room);
  if(!net.isHost()){
    setTimeout(function(){ if(!st.started){ try{ net.push({shgNeedQuiz:1}); }catch(e){} } },900);
    setTimeout(function(){ if(!st.started){ try{ net.push({shgNeedQuiz:1}); }catch(e){} } },3500);
  }
  return {
    submit:function(){
      if(st.submitted) return;
      st.submitted=true;
      var p=null;
      try{ p=opt.submitPayload(); }catch(e){}
      var sc=(p&&typeof p==='object')?(+p.score||0):(+p||0);
      try{ QuizPVP.submit(net, sc); }catch(e2){ toast('Score submit failed'); }
    }
  };
}
async function shgAward(iWon){ try{ await QuizPVP.award(iWon); }catch(e){} }
function shgPayLoad(score){ return {score:score,uid:shgMyUid(),name:(typeof Auth!=='undefined'&&Auth.user)?Auth.user.username:'?'}; }
function shgResultBanner(el,iWon,w,winMsg,loseMsg){
  if(!el) return;
  if(w&&shgMyUid()&&w!==shgMyUid()&&!iWon){ el.innerHTML='<div class="status"><span class="err">'+loseMsg+'</span></div>'; }
  else if(iWon){ el.innerHTML='<div class="status"><span class="ok">'+winMsg+'</span></div>'; }
  else { el.innerHTML='<div class="status"><span class="muted">🤝 It\'s a tie!</span></div>'; }
}
function shgQBtn(label,fn,cls){
  var b=document.createElement('button');
  b.className='btn small '+(cls||''); b.style.margin='4px';
  b.innerHTML=label;
  b.onclick=function(){ Sound.click(); fn(); };
  return b;
}

regGame('deal',{howto:"Pick your case, then open the rest one round at a time. After each round the banker calls with an offer - take the DEAL or say NO DEAL and keep opening. Down to two cases? Swap or stick. Walk away with the banker's money or whatever is in your case!",name:'Deal or No Deal',icon:'💼',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){

      +'<button class="btn small secondary" id="pSkip">Skip</button></div>'
      +'<div class="status" id="pMsg"></div></div>';
    var inp=py.querySelector('#pAns'); inp.focus();
    function guess(){
      var g=inp.value;
      if(!g.trim()) return;
      if(SHG.fuzzy(g,it.answer)){
        S.correct++; Sound.beep(880,.1); S.ci++; drawQ();
      } else {
        Sound.beep(200,.15,'sawtooth');
        py.querySelector('#pMsg').innerHTML='<span class="err">Not quite — try again or skip.</span>';
        inp.select();
      }
    }
    py.querySelector('#pGo').onclick=guess;
    inp.onkeydown=function(e){ if(e.key==='Enter') guess(); };
    py.querySelector('#pSkip').onclick=function(){ Sound.click(); S.ci++; drawQ(); };
  }
  function endList(){
    stopTimer();
    var bot=SHG.pyramidBotScore();
    S.botTotal+=bot; S.total+=S.correct;
    var doneLists=S.li+1;
    if(doneLists>=S.lists.length){ S.done=true; drawDone(); return; }
    py.innerHTML=hud()+'<div class="card center"><div class="muted">List complete!</div>'
      +'<div>You: <b>'+S.correct+'</b> — Computer: <b>'+bot+'</b></div>'
      +'<button class="btn" id="pNext" style="margin-top:10px">Next list ▶</button></div>';
    py.querySelector('#pNext').onclick=function(){ Sound.click(); S.li++; playList(); };
  }
  async function drawDone(){
    stopTimer();
    py.innerHTML='<div class="card center"><div class="muted">Winner\'s Circle complete!</div>'
      +'<div class="big">You: <b>'+S.total+'</b>'+(isNet?'':' vs Computer: <b>'+S.botTotal+'</b>')+'</div><div id="pyRes"></div></div>';
    var res=py.querySelector('#pyRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else {
      if(S.total>=S.botTotal){
        Sound.win();
        res.innerHTML='<div class="status"><span class="ok">🎉 You win the Winner\'s Circle, '+S.total+' to '+S.botTotal+'!</span></div>';
        await Wallet.recordWin('pyramid');
      } else {
        Sound.lose();
        res.innerHTML='<div class="status"><span class="err">😞 Computer takes it, '+S.botTotal+' to '+S.total+'. Try again!</span></div>';
      }
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){ return {lists:pickLists()}; },
      onData:function(d){ start(d); },
      submitPayload:function(){ return shgPayLoad(S.total); },
      onSettle:function(iWon,room,w){
        var res=py.querySelector('#pyRes');
        shgResultBanner(res,iWon,w,
          '🎉 You win the Pyramid, '+S.total+' words!',
          '😞 Opponent guessed more words. You had '+S.total+'.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    start({lists:pickLists()});
  }
}});

/* ================= WEAKEST LINK ================= */
regGame('weakestlink',{howto:"Chain correct answers to climb the money ladder - hit BANK before you miss to lock it in. A wrong answer breaks the chain. Each round ends with a vote: the team votes off the weakest link. Survive to the final head-to-head and win!",name:'Weakest Link',icon:'🔗',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){
  ctx=ctx||{mode:'cpu'}; var net=(ctx.mode==='pvp')?ctx.net:null; var isNet=!!(net&&net.room);
  if(shgGuard(BANKS2.weakestlink&&BANKS2.weakestlink.length>=12,'Weakest Link questions are still loading')) return;
  var S=null, pvpCtl=null, wk;
  c.innerHTML='<h2>🔗 Weakest Link</h2><div class="muted">Chain correct answers, BANK before you miss — and vote off the weakest link.</div><div id="wk"></div>';
  wk=c.querySelector('#wk');
  /* ---------- CPU: full team game ---------- */
  function newTeam(){
    var t=[{n:'You',me:true,c:0,w:0,skill:1}];
    SHG.weakestLinkBots().slice(0,3).forEach(function(nm){ t.push({n:nm,me:false,c:0,w:0,skill:SHG.weakestLinkBotSkill()}); });
    return t;
  }
  function startCpu(){
    S={mode:'cpu',team:newTeam(),round:1,chain:0,roundBank:0,total:0,q:SHG.pickN(BANKS2.weakestlink,60),
      order:[],oi:0,phase:'chain',log:[],votes:{},finalQ:0,finalMe:0,finalBot:0,sudden:false,done:false,win:false};
    startRound();
  }
  function log(m){ S.log.push(m); if(S.log.length>8) S.log.shift(); }
  function nextQ(){
    var q=S.q.pop();
    if(!q){ S.q=SHG.pickN(BANKS2.weakestlink,60); q=S.q.pop(); }
    return q;
  }
  function startRound(){
    S.chain=0; S.roundBank=0; S.phase='chain'; S.votes={};
    S.order=[];
    S.team.forEach(function(m){ S.order.push(m); S.order.push(m); });
    for(var i=S.order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=S.order[i]; S.order[i]=S.order[j]; S.order[j]=t; }
    S.oi=0;
    log('— Round '+S.round+' — chain the answers!');
    drawCpu();
  }
  function ladderMini(){
    var h='<div class="center muted" style="font-size:12px">Chain: ';
    for(var i=1;i<=8;i++){ h+='<span style="color:'+(S.chain>=i?'#eab676':'#555')+'">$'+(SHG.weakestLinkBank(i)/1000)+'k </span>'; }
    return h+'</div>';
  }
  function drawCpu(){
    if(S.done){ drawCpuDone(); return; }
    var h='<div class="row"><div class="grow center">Round <b>'+S.round+'</b></div>'
      +'<div class="grow center">🏦 Total: <b style="color:#eab676">$'+S.total.toLocaleString('en-US')+'</b></div>'
      +'<div class="grow center">Round bank: <b>$'+S.roundBank.toLocaleString('en-US')+'</b></div></div>'
      +'<div class="center" style="margin:6px 0">'+S.team.map(function(m){ return '<span style="margin:0 6px;'+(m.me?'color:#eab676':'')+'">'+(m.me?'🧑':'🤖')+' '+esc(m.n)+'</span>'; }).join('')+'</div>'
      +ladderMini()
      +'<div class="card" style="min-height:60px;font-size:13px" id="wlog">'+S.log.map(esc).join('<br>')+'</div>'
      +'<div id="wplay"></div>';
    wk.innerHTML=h;
    var pl=wk.querySelector('#wplay');
    if(S.phase==='chain') drawChainTurn(pl);
    else if(S.phase==='vote') drawVote(pl);
    else if(S.phase==='final') drawFinal(pl);
  }
  function drawChainTurn(pl){
    if(S.oi>=S.order.length){ endChainRound(); return; }
    var m=S.order[S.oi];
    var q=nextQ(); S.curQ=q;
    if(m.me){
      pl.innerHTML='<div class="card"><div class="center muted">Your question — chain pays <b style="color:#eab676">$'+SHG.weakestLinkBank(S.chain+1).toLocaleString('en-US')+'</b> if right</div>'
        +'<h3>'+esc(q.q)+'</h3><div class="row"><input id="wAns" class="grow" placeholder="Your answer…" autocomplete="off">'
        +'<button class="btn small" id="wGo">Answer</button></div>'
        +'<div class="row" style="margin-top:6px"><button class="btn small secondary grow" id="wBank">🏦 BANK $'+SHG.weakestLinkBank(S.chain).toLocaleString('en-US')+'</button></div></div>';
      var inp=pl.querySelector('#wAns'); inp.focus();
      function ans(){
        var ok=SHG.fuzzy(inp.value,q.a);
        if(ok){ S.chain=Math.min(S.chain+1,8); m.c++; Sound.beep(760,.08); log('✅ You: correct — chain '+S.chain); }
        else { S.chain=0; m.w++; Sound.beep(200,.15,'sawtooth'); log('❌ You: wrong ('+q.a+') — chain reset'); }
        S.oi++; drawCpu();
      }
      pl.querySelector('#wGo').onclick=ans;
      inp.onkeydown=function(e){ if(e.key==='Enter') ans(); };
      pl.querySelector('#wBank').onclick=function(){
        if(S.chain>0){ var amt=SHG.weakestLinkBank(S.chain); S.roundBank+=amt; log('🏦 You banked $'+amt.toLocaleString('en-US')); S.chain=0; Sound.win(); }
        else toast('Nothing to bank yet');
        drawCpu();
      };
    } else {
      pl.innerHTML='<div class="card center"><div class="muted">'+esc(m.n)+' is answering…</div><h3>'+esc(q.q)+'</h3></div>';
      setTimeout(function(){
        if(S.phase!=='chain') return;
        var ok=Math.random()<m.skill;
        if(ok){ S.chain=Math.min(S.chain+1,8); m.c++; log('✅ '+m.n+': correct — chain '+S.chain); Sound.beep(660,.06); }
        else { S.chain=0; m.w++; log('❌ '+m.n+': wrong ('+q.a+') — chain reset'); }
        S.oi++; drawCpu();
      },900);
    }
  }
  function endChainRound(){
    S.total+=S.roundBank;
    log('Round '+S.round+' banked: $'+S.roundBank.toLocaleString('en-US'));
    S.round++;
    if(S.team.length>2){ S.phase='vote'; }
    else { S.phase='final'; S.finalQ=0; S.finalMe=0; S.finalBot=0; S.sudden=false; log('— HEAD TO HEAD: 5 questions each —'); }
    drawCpu();
  }
  function drawVote(pl){
    var bots=S.team.filter(function(m){ return !m.me; });
    pl.innerHTML='<div class="card"><div class="center"><b>🗳 Vote off the Weakest Link</b></div><div class="muted center">Bots vote strategically…</div><div id="vBtns" class="center"></div></div>';
    var vb=pl.querySelector('#vBtns');
    bots.forEach(function(b){
      vb.appendChild(shgQBtn('🗳 '+esc(b.n)+' <span class="muted">('+b.c+'✓/'+b.w+'✗)</span>',function(){ castVote(b.n); }));
    });
  }
  function castVote(playerPick){
    var votes={};
    S.team.forEach(function(m){ if(m.me) return; var v=SHG.weakestLinkBotVote(S.team); votes[v]=(votes[v]||0)+1; });
    votes[playerPick]=(votes[playerPick]||0)+1;
    var names=Object.keys(votes), out=names[0], best=votes[out];
    names.forEach(function(nm){ if(votes[nm]>best){ best=votes[nm]; out=nm; } });
    var tied=names.filter(function(nm){ return votes[nm]===best; });
    if(tied.length>1) out=playerPick; // player breaks ties
    log('🗳 Votes: '+names.map(function(nm){ return nm+' '+votes[nm]; }).join(', ')+' → '+out+' is out');
    if(out==='You'){ S.done=true; S.win=false; drawCpu(); return; }
    S.team=S.team.filter(function(m){ return m.n!==out; });
    toast(out+' was voted off!');
    Sound.lose();
    startRound();
  }
  function drawFinal(pl){
    var bot=S.team.filter(function(m){ return !m.me; })[0];
    if(!bot){ S.done=true; S.win=true; drawCpu(); return; }
    if(S.finalQ>=5&&!S.sudden){
      if(S.finalMe>S.finalBot){ S.done=true; S.win=true; drawCpu(); return; }
      if(S.finalMe<S.finalBot){ S.done=true; S.win=false; drawCpu(); return; }
      S.sudden=true; log('— SUDDEN DEATH —');
    }
    var q=nextQ(); S.curQ=q;
    pl.innerHTML='<div class="card"><div class="center"><b>'+(S.sudden?'⚡ SUDDEN DEATH':'🎯 Head-to-head '+(Math.min(S.finalQ,4)+1)+'/5')+'</b> vs '+esc(bot.n)+'</div>'
      +'<div class="center">You '+S.finalMe+' — '+S.finalBot+' '+esc(bot.n)+'</div>'
      +'<h3>'+esc(q.q)+'</h3><div class="row"><input id="wAns" class="grow" placeholder="Your answer…" autocomplete="off">'
      +'<button class="btn small" id="wGo">Answer</button></div></div>';
    var inp=pl.querySelector('#wAns'); inp.focus();
    function ans(){
      var ok=SHG.fuzzy(inp.value,q.a);
      if(ok){ S.finalMe++; Sound.beep(880,.1); } else Sound.beep(200,.15,'sawtooth');
      var bq=nextQ();
      var bok=Math.random()<bot.skill;
      if(bok) S.finalBot++;
      log('You '+(ok?'✅':'❌')+' ('+q.a+') · '+bot.n+' '+(bok?'✅':'❌')+' ('+bq.a+')');
      S.finalQ++;
      if(S.sudden&&(S.finalMe!==S.finalBot)){ S.done=true; S.win=S.finalMe>S.finalBot; drawCpu(); return; }
      drawCpu();
    }
    pl.querySelector('#wGo').onclick=ans;
    inp.onkeydown=function(e){ if(e.key==='Enter') ans(); };
  }
  async function drawCpuDone(){
    wk.innerHTML='<div class="card center"><div class="muted">Game over</div>'
      +'<div class="big" style="color:#eab676">$'+S.total.toLocaleString('en-US')+' banked</div>'
      +'<div class="status">'+(S.win?'<span class="ok">🎉 You are NOT the weakest link — you win!</span>':'<span class="err">😞 You are the weakest link. Goodbye!</span>')+'</div></div>';
    Sound[S.win?'win':'lose']();
    if(S.win) await Wallet.recordWin('weakestlink');
  }
  /* ---------- PVP: solo chain sprint on shared questions ---------- */
  function startPvp(shared){
    S={mode:'pvp',qs:shared.qs,qi:0,chain:0,total:0,done:false};
    drawPvp();
  }
  function drawPvp(){
    if(S.done){ drawPvpDone(); return; }

      +ladderMini()
      +'<div class="card"><h3>'+esc(S.qs[S.qi].q)+'</h3>'
      +'<div class="row"><input id="wAns" class="grow" placeholder="Your answer…" autocomplete="off">'
      +'<button class="btn small" id="wGo">Answer</button></div>'
      +'<div class="row" style="margin-top:6px"><button class="btn small secondary grow" id="wBank">🏦 BANK $'+SHG.weakestLinkBank(S.chain).toLocaleString('en-US')+'</button></div></div>';
    wk.innerHTML=h;
    var inp=wk.querySelector('#wAns'); inp.focus();
    function ans(){

      if(SHG.fuzzy(inp.value,q.a)){ S.chain=Math.min(S.chain+1,8); Sound.beep(760,.08); }

  async function drawPvpDone(){

    pvpCtl.submit();

/* ================= 1 VS 100 ================= */
regGame('1v100',{howto:"You against a mob of 100. Every question knocks out the mob members who miss - each one is cash for you. You get 3 helps: Poll the Mob, Ask the Mob, and Double. One wrong answer and the mob takes it all!",name:'1 vs 100',icon:'💯',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){
  ctx=ctx||{mode:'cpu'}; var net=(ctx.mode==='pvp')?ctx.net:null; var isNet=!!(net&&net.room);
  if(shgGuard(BANKS2.v100&&BANKS2.v100.length>=10,'1 vs 100 questions are still loading')) return;
  var S=null, pvpCtl=null, mv;
  c.innerHTML='<h2>💯 1 vs 100</h2><div class="muted">You vs the Mob of 100. Every mob member you knock out is cash!</div><div id="mv"></div>';
  mv=c.querySelector('#mv');
  function start(shared){
    S={qs:shared.qs,i:0,mob:100,elim:0,win:0,helps:{poll:1,ask:1,double:1},dbl:false,done:false,lost:false,survived:0};
    draw();
  }
  function tierLabel(t){ return t===1?'🟢 Easy':t===2?'🟡 Medium':'🔴 Hard'; }
  function hud(){
    var pct=Math.round(S.mob);
    return '<div class="row"><div class="grow center">Q <b>'+(S.i+1)+'/'+S.qs.length+'</b></div>'
      +'<div class="grow center">👥 Mob: <b>'+S.mob+'</b>/100</div>'
      +'<div class="grow center">💰 <b style="color:#eab676">$'+S.win.toLocaleString('en-US')+'</b></div></div>'
      +'<div style="background:#222;border-radius:8px;height:12px;margin:6px 0"><div style="width:'+pct+'%;height:100%;background:#eab676;border-radius:8px"></div></div>';
  }
  function helpsHTML(){
    var h='<div class="row" style="margin-top:6px">';
    h+='<button class="btn small secondary grow" id="hPoll" '+(S.helps.poll?'':'disabled')+'>📊 Poll the Mob</button>';
    h+='<button class="btn small secondary grow" id="hAsk" '+(S.helps.ask?'':'disabled')+'>🎤 Ask the Mob</button>';
    h+='<button class="btn small secondary grow" id="hDbl" '+(S.helps.double?'':'disabled')+'>✌️ Double $</button>';
    return h+'</div><div class="status" id="helpMsg"></div>';
  }
  function draw(){
    if(S.done){ drawDone(); return; }
    var q=S.qs[S.i];
    var h=hud()
      +'<div class="card"><div class="muted">'+tierLabel(q.tier)+' — worth $'+(SHG.v100QuestionValue(q.tier)*(S.dbl?2:1)).toLocaleString('en-US')+' per mob member'+(S.dbl?' (DOUBLED!)':'')+'</div>'
      +'<h3>'+esc(q.q)+'</h3><div id="ch"></div>'+helpsHTML()+'</div>';
    mv.innerHTML=h;
    var ch=mv.querySelector('#ch');
    q.choices.forEach(function(t,i){ ch.appendChild(shgQBtn(esc(t),function(){ answer(i); })); });
    var hm=mv.querySelector('#helpMsg');
    var hp=mv.querySelector('#hPoll');
    if(hp) hp.onclick=function(){ S.helps.poll=0; var sp=SHG.v100MobSplit(q.tier); Sound.click();
      hm.innerHTML='📊 Mob poll: <b>'+sp[0]+'%</b> say "'+esc(q.choices[q.correct])+'", '+sp[1]+'% / '+sp[2]+'% split the others.'; draw._h=true; draw2(); };
    var ha=mv.querySelector('#hAsk');
    if(ha) ha.onclick=function(){ S.helps.ask=0; Sound.click();
      var wrongs=q.choices.map(function(_,i){return i;}).filter(function(i){return i!==q.correct;});
      var w=wrongs[Math.floor(Math.random()*wrongs.length)];
      var names=['Mob member #'+(1+Math.floor(Math.random()*99)),'Mob member #'+(1+Math.floor(Math.random()*99))];
      hm.innerHTML='🎤 '+esc(names[0])+': "I\'m going with <b>'+esc(q.choices[q.correct])+'</b>."<br>🎤 '+esc(names[1])+': "Nah, it\'s <b>'+esc(q.choices[w])+'</b>, trust me."'; draw2(); };
    var hd=mv.querySelector('#hDbl');
    if(hd) hd.onclick=function(){ S.helps.double=0; S.dbl=true; Sound.win(); toast('Double Dollars active!'); draw(); };
  }
  function draw2(){ // redraw keeping help message
    var msg=mv.querySelector('#helpMsg')?mv.querySelector('#helpMsg').innerHTML:'';
    draw();
    var nm=mv.querySelector('#helpMsg'); if(nm) nm.innerHTML=msg;
  }
  function answer(i){
    var q=S.qs[S.i];
    if(i===q.correct){
      var n=SHG.mobEliminate(S.mob,q.tier);
      S.mob-=n; S.elim+=n; S.survived++;
      var gain=n*SHG.v100QuestionValue(q.tier)*(S.dbl?2:1);
      S.win+=gain; S.dbl=false;
      Sound.win();
      toast('Correct! '+n+' mob members out (+$'+gain.toLocaleString('en-US')+')');
      if(S.mob<=0){ S.mob=0; S.done=true; draw(); return; }
      S.i++;
      if(S.i>=S.qs.length){ S.done=true; }
      draw();
    } else {
      S.lost=true; S.done=true; Sound.lose(); draw();
    }
  }
  async function drawDone(){
    var h='<div class="card center">';
    if(S.mob<=0&&!S.lost){ h+='<div class="big">👥💥</div><div class="ok" style="font-size:18px">YOU BEAT THE ENTIRE MOB!</div>'; }
    else if(S.lost){ h+='<div class="muted">Wrong answer! The mob survives.</div>'; }
    else { h+='<div class="muted">You survived all 10 questions!</div><div class="ok" style="font-size:18px">🎉 Last one standing!</div>'; }
    h+='<div class="muted">Questions survived: '+S.survived+'/10 · Mob eliminated: '+S.elim+'</div>'
      +'<div class="big" style="color:#eab676">$'+S.win.toLocaleString('en-US')+'</div><div id="mRes"></div></div>';
    mv.innerHTML=h;
    var res=mv.querySelector('#mRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else {
      var pts=Math.max(1,Math.round(S.win/1000));
      if(!S.lost||S.win>0){ await Wallet.add(pts,'1v100'); }
      if(!S.lost){
        Sound.win();
        res.innerHTML='<div class="status"><span class="ok">🎉 You win $'+S.win.toLocaleString('en-US')+'! (+'+pts+' pts)</span></div>';
        await Wallet.recordWin('1v100');
      } else {
        res.innerHTML='<div class="status"><span class="err">😞 Out — but you keep '+pts+' pts from $'+S.win.toLocaleString('en-US')+'.</span></div>';
      }
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){ return {qs:SHG.v100Pick(BANKS2.v100)}; },

regGame('fifthgrader',{howto:"Climb grades 1 through 5, picking a subject each grade. You get 3 cheats: Peek, Copy, and Save. Drop out anytime to keep your winnings - miss a question and you flunk out with nothing!",name:'Are You Smarter Than a 5th Grader',icon:'🎒',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){
