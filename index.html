  function normQs(){ return SHG.fifthGraderNorm(BANKS2.fifthgrader); }
  function start(shared){
    S={qs:shared.qs,grade:1,win:0,cheats:{peek:1,copy:1,save:1},phase:'subject',cur:null,done:false,dropped:false,peeked:false};
    draw();
  }
  function hud(){
    return '<div class="row"><div class="grow center">Grade <b>'+S.grade+'</b>/5</div>'
      +'<div class="grow center">💰 Winnings: <b style="color:#eab676">$'+S.win.toLocaleString('en-US')+'</b></div></div>'
      +'<div class="center muted" style="font-size:12px">Ladder: '+LAD.map(function(v,i){ return '<span style="color:'+(S.win>=v?'#eab676':'#555')+'">$'+(v/1000)+'k</span>'; }).join(' · ')+'</div>'
      +'<div class="center muted" style="font-size:12px">Cheats: 👀 Peek('+(S.cheats.peek)+') 📋 Copy('+(S.cheats.copy)+') 💾 Save('+(S.cheats.save)+')</div>';
  }
  function draw(){
    if(S.done){ drawDone(); return; }
    var h=hud();
    if(S.phase==='subject'){
      var subs={};
      S.qs.forEach(function(q){ if(q.grade===S.grade) subs[q.subject]=1; });
      var list=Object.keys(subs);
      h+='<div class="card center"><div class="muted">Pick your '+S.grade+(S.grade===1?'st':S.grade===2?'nd':S.grade===3?'rd':'th')+'-grade subject:</div><div id="subs"></div></div>';
      fg.innerHTML=h;
      var sb=fg.querySelector('#subs');
      if(!list.length){ fg.innerHTML=h+'<div class="err center">No questions for this grade.</div>'; S.done=true; return; }
      list.forEach(function(su){
        sb.appendChild(shgQBtn('📚 '+esc(su),function(){ pickQ(su); }));
      });
    } else if(S.phase==='question'){
      var q=S.cur;
      h+='<div class="card"><div class="muted center">'+esc(q.subject)+' — Grade '+S.grade+' ($'+LAD[S.grade-1].toLocaleString('en-US')+')</div>'
        +'<h3>'+esc(q.q)+'</h3><div id="ch"></div>'
        +'<div class="row" style="margin-top:6px">'
        +'<button class="btn small secondary grow" id="cPeek" '+(S.cheats.peek?'':'disabled')+'>👀 Peek</button>'
        +'<button class="btn small secondary grow" id="cCopy" '+(S.cheats.copy?'':'disabled')+'>📋 Copy</button>'
        +'</div></div>';
      fg.innerHTML=h;
      var ch=fg.querySelector('#ch');
      q.choices.forEach(function(t,i){
        var b=shgQBtn(esc(t),function(){ answer(i); });
        b.id='ch'+i;
        if(S.peeked&&i===q.correct){ b.style.border='2px solid #eab676'; b.style.boxShadow='0 0 8px #eab676'; }
        ch.appendChild(b);
      });
      fg.querySelector('#cPeek').onclick=function(){
        if(!S.cheats.peek) return;
        S.cheats.peek=0; S.peeked=true; Sound.win();
        toast('👀 Peek: the correct answer is glowing!');
        draw();
      };
      fg.querySelector('#cCopy').onclick=function(){
        if(!S.cheats.copy) return;
        S.cheats.copy=0; Sound.win();
        toast('📋 You copied the classmate — auto-correct!');
        correct();
      };
    } else if(S.phase==='decide'){
      h+='<div class="card center"><div class="ok" style="font-size:16px">✅ Correct! You have $'+S.win.toLocaleString('en-US')+'</div>'
        +'<div class="muted">'+(S.grade>=5?'That was 5th grade!':'Drop out and keep it, or risk it all on grade '+(S.grade+1)+' ($'+LAD[S.grade].toLocaleString('en-US')+')?')+'</div>'
        +'<div class="row" style="margin-top:10px"><button class="btn secondary grow" id="gDrop">💰 DROP OUT</button>'
        +(S.grade>=5?'':'<button class="btn grow" id="gGo">▶ CONTINUE</button>')+'</div></div>';
      fg.innerHTML=h;
      fg.querySelector('#gDrop').onclick=function(){ Sound.click(); S.dropped=true; S.done=true; draw(); };
      var gg=fg.querySelector('#gGo');
      if(gg) gg.onclick=function(){ Sound.click(); S.grade++; S.phase='subject'; S.peeked=false; draw(); };
    }
  }
  function pickQ(subject){
    var pool=S.qs.filter(function(q){ return q.grade===S.grade&&q.subject===subject; });
    if(!pool.length) pool=S.qs.filter(function(q){ return q.grade===S.grade; });
    S.cur=pool[Math.floor(Math.random()*pool.length)];
    S.phase='question'; S.peeked=false;
    Sound.click(); draw();
  }
  function correct(){
    S.win=LAD[S.grade-1];
    Sound.win();
    if(S.grade>=5){ S.done=true; draw(); }
    else { S.phase='decide'; draw(); }
  }
  function answer(i){
    var q=S.cur;
    if(i===q.correct){ correct(); return; }
    if(S.cheats.save>0){
      S.cheats.save=0;
      Sound.win();
      toast('💾 SAVED! That wrong answer is forgiven.');
      correct(); return;
    }
    Sound.lose();
    toast('Wrong! The answer was: '+q.choices[q.correct]);
    S.win=0; S.done=true; draw();
  }
  async function drawDone(){
    var h='<div class="card center">';
    if(S.grade>=5&&!S.dropped&&S.win>0){
      h+='<div class="big">🎓</div><div class="ok" style="font-size:18px">You ARE smarter than a 5th grader!</div>';
    } else if(S.dropped){
      h+='<div class="muted">You dropped out with</div>';
    } else {
      h+='<div class="err" style="font-size:18px">📚 Sent back to grade school!</div><div class="muted">Wrong answer with no Save left.</div>';
    }
    h+='<div class="big" style="color:#eab676">$'+S.win.toLocaleString('en-US')+'</div><div id="fRes"></div></div>';
    fg.innerHTML=h;
    var res=fg.querySelector('#fRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else {
      var pts=Math.max(1,Math.round(S.win/1000));
      if(S.win>0){ await Wallet.add(pts,'fifthgrader'); }
      if(S.grade>=5&&S.win>0){
        res.innerHTML='<div class="status"><span class="ok">🎉 Graduation bonus! (+'+pts+' pts)</span></div>';
        await Wallet.recordWin('fifthgrader');
      } else if(S.dropped){
        res.innerHTML='<div class="status"><span class="muted">Smart move — you keep '+pts+' pts.</span></div>';
      }
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){
        var nq=normQs(), qs=[];
        for(var g=1;g<=5;g++){ var q=SHG.fifthGraderForGrade(nq,g); if(q) qs.push(q); }
        return {qs:qs};
      },
      onData:function(d){
        if(shgGuard(d.qs&&d.qs.length>=5,'Question sync failed — rejoin the room')) return;
        start(d);
      },
      submitPayload:function(){ return shgPayLoad(S.win); },
      onSettle:function(iWon,room,w){
        var res=fg.querySelector('#fRes');
        shgResultBanner(res,iWon,w,
          '🎉 You out-grade your opponent with $'+S.win.toLocaleString('en-US')+'!',
          '😞 Opponent climbed higher. You had $'+S.win.toLocaleString('en-US')+'.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    var nq0=normQs();
    if(shgGuard([1,2,3,4,5].every(function(g){ return nq0.some(function(q){ return q.grade===g; }); }),'Need questions for all 5 grades')) return;
    start({qs:nq0});
  }
}});

regGame('whatsmline',{howto:"A mystery occupation is hiding. Ask up to 10 yes/no questions to narrow it down, then guess the occupation. Fewer questions asked means more points!",name:"What's My Line?",icon:'🕵️',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){

  var occs=(BANKS2.whatsmline.occupations||[]).map(SHG.wmlNormOcc).filter(function(o){ return o.name; });

  wl=c.querySelector('#wl');
  function start(shared){
    S={occ:shared.occ,others:shared.others,used:0,asked:{},lastA:null,done:false,won:false,panel:SHG.wmlPanel()};
    draw();
  }
  function hud(){
    return '<div class="row"><div class="grow center">Questions used: <b>'+S.used+'</b>/10</div>'
      +'<div class="grow center">Mystery guest: <b>???</b></div></div>'
      +'<div class="center muted" style="font-size:12px;margin:4px 0">🎩 Panel: '+S.panel.map(function(p){ return esc(p); }).join(' · ')+' <span class="muted">nods along…</span></div>';
  }
  function draw(){
    if(S.done){ drawDone(); return; }
    var h=hud();
    if(S.lastA){
      h+='<div class="card center"><div class="muted">'+esc(S.lastA.q)+'</div><div class="big">'+(S.lastA.a==='yes'?'<span class="ok">YES</span>':'<span class="err">NO</span>')+'</div></div>';
    }
    h+='<div class="card"><div class="muted center">Pick a question to ask:</div><div id="qlist" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center"></div></div>'
      +'<div class="center"><button class="btn" id="wGuess" style="margin-top:8px">🔍 GUESS THE OCCUPATION</button></div>';
    wl.innerHTML=h;
    var ql=wl.querySelector('#qlist');
    SHG.wmlQuestions().forEach(function(qq){
      var id=qq[0], t=qq[1];
      var b=document.createElement('button');
      b.className='btn small secondary';
      b.style.margin='2px'; b.style.fontSize='11px';

    });
    wl.querySelector('#wGuess').onclick=showGuess;

  function askQ(id,t){
    if(S.used>=10||S.asked[id]) return;
    S.asked[id]=1; S.used++;

    S.lastA={q:t,a:a};

  }
  function showGuess(){
    var opts=[S.occ.name].concat(S.others);
    for(var i=opts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=opts[i]; opts[i]=opts[j]; opts[j]=t; }

      +'<div class="muted" style="margin-top:8px">Score if right: <b>'+SHG.wmlScore(S.used)+'</b> (fewer questions = more points)</div></div>';
    var go=wl.querySelector('#gopts');
    opts.forEach(function(nm){
      go.appendChild(shgQBtn('💼 '+esc(nm),function(){
        if(SHG.wmlCheck(nm,S.occ.name)){ S.won=true; }
        S.done=true; Sound[S.won?'win':'lose'](); draw();
      }));
    });
  }
  async function drawDone(){
    var sc=S.won?SHG.wmlScore(S.used):0;
    wl.innerHTML='<div class="card center"><div class="muted">The mystery guest was…</div>'
      +'<div class="big">💼 '+esc(S.occ.name)+'</div>'
      +(S.won
        ? '<div class="status"><span class="ok">🎉 Correct! '+S.used+' question'+(S.used===1?'':'s')+' used — score '+sc+'!</span></div>'
        : '<div class="status"><span class="err">😞 Wrong guess — the panel stumps you!</span></div>')
      +'<div id="wRes"></div></div>';
    var res=wl.querySelector('#wRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else if(S.won){
      await Wallet.add(Math.max(1,sc),'whatsmline');
      await Wallet.recordWin('whatsmline');
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){
        var o=occs[Math.floor(Math.random()*occs.length)];
        var others=SHG.pickN(occs.filter(function(x){ return x.name!==o.name; }),3).map(function(x){ return x.name; });
        return {occ:o,others:others};
      },
      onData:function(d){ start(d); },
      submitPayload:function(){ return shgPayLoad(S.won?SHG.wmlScore(S.used):-1); },
      onSettle:function(iWon,room,w){
        var res=wl.querySelector('#wRes');
        shgResultBanner(res,iWon,w,
          '🎉 You guessed it in '+S.used+' questions — you win!',
          '😞 Opponent guessed in fewer questions.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    var o0=occs[Math.floor(Math.random()*occs.length)];
    var ot0=SHG.pickN(occs.filter(function(x){ return x.name!==o0.name; }),3).map(function(x){ return x.name; });
    start({occ:o0,others:ot0});
  }
}});

/* ================= HOLLYWOOD GAME NIGHT ================= */
regGame('hollywood',{howto:"3 party games, one total score. 1) Celebrity Clues - guess the star from the clues (fewer clues = more points). 2) In Other Words - 60 seconds of word guessing. 3) Quick Fire - 60 seconds of rapid trivia. Beat the target score to win!",name:'Hollywood Game Night',icon:'🎬',tags:'Game Show',pvp:true,seats:2,

      onData:function(d){ start(d); },

      onSettle:function(iWon,room,w){
        var res=hw2.querySelector('#hRes');
        shgResultBanner(res,iWon,w,
          '🎉 You win Game Night with '+S.score+' points!',
          '😞 Opponent scored higher. You had '+S.score+'.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    start({celebs:SHG.pickN(celebs,3),words:SHG.pickN(words,12),fire:SHG.pickN(fire,15)});
  }
}});

</script>
<script>
'use strict';
/* ---------------- game order & fallback meta (injected games use regGame) ---------------- */
const GAME_ORDER=['jeopardy','wheel','millionaire','price','feud','chase','matchgame','password','whatsmline','hollywood','deal','pressluck','pyramid','weakestlink','1v100','fifthgrader'];
const GAME_META={
  jeopardy:{name:'Jeopardy!',icon:'🧠',pvp:true},
  wheel:{name:'Wheel of Fortune',icon:'🎡',pvp:true},
  millionaire:{name:'Millionaire',icon:'💰',pvp:true},
  price:{name:'The Price Is Right',icon:'🏷️',pvp:true},
  feud:{name:'Family Feud',icon:'👪',pvp:true},
  chase:{name:'The Chase',icon:'🏃',pvp:true},
  matchgame:{name:'Match Game',icon:'🧩',pvp:true},
  password:{name:'Password',icon:'🔐',pvp:true},
  whatsmline:{name:"What's My Line?",icon:'❓',pvp:true},
  hollywood:{name:'Hollywood Game Night',icon:'🎬',pvp:true},
  deal:{name:'Deal or No Deal',icon:'💼',pvp:true},
  pressluck:{name:'Press Your Luck',icon:'😈',pvp:true},
  pyramid:{name:'$100,000 Pyramid',icon:'🔺',pvp:true},
  weakestlink:{name:'Weakest Link',icon:'🔗',pvp:true},
  '1v100':{name:'1 vs 100',icon:'💯',pvp:true},
  fifthgrader:{name:'5th Grader',icon:'🎒',pvp:true}
};

/* ---------------- game registry ---------------- */
/* Games/registry shim lives in the injected games part (window.Games); reuse it — var re-declare is safe, const would throw. */
var Games = (typeof Games!=='undefined')?Games:((typeof window!=='undefined')?(window.Games=window.Games||{}):{});
function regGame(id, def){ Games[id]=Object.assign({id}, def); }

/* ---------------- bet widget ---------------- */
function betWidget(container, onBet){
  let bet=25;
  container.innerHTML='<div class="muted">Your bet (points):</div><div class="betrow" id="bets"></div><button class="btn" id="placeBet">Place bet</button>';
  const bets=container.querySelector('#bets');
  const opts=[10,25,50,100,250];
  const draw=()=>{ bets.innerHTML=''; opts.forEach(o=>{ const b=document.createElement('button'); b.textContent=o; if(o===bet)b.classList.add('sel'); b.onclick=()=>{bet=o; Sound.click(); draw();}; bets.appendChild(b); }); };
  draw();
  container.querySelector('#placeBet').onclick=()=>{ try{ const amt=Wallet.bet(bet); onBet(amt); }catch(e){ toast(e.message); } };
}

function gameModesHTML(g){
  let h='<h3>Choose mode</h3><div class="row">';
  h+='<button class="btn small grow" data-m="cpu">🤖 Vs Computer</button>';
  if(g.pvp) h+='<button class="btn small grow" data-m="pvp">🌐 Vs Person</button>';
  h+='</div><div id="pvpBox"></div>';
  return h;
}
function wireModes(container, gameId, start){
  container.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    Sound.click();
    const m=b.getAttribute('data-m');
    if(m==='cpu'){ start({mode:'cpu'}); }
    else{
      const box=container.querySelector('#pvpBox');
      box.innerHTML='<div class="card"><h3>Online play</h3><div class="row"><button class="btn small grow" id="mkRoom">Create room</button><input id="joinCode" class="grow" placeholder="Code" maxlength="4" inputmode="numeric"><button class="btn small" id="doJoin">Join</button></div><div class="muted">Share the 4-digit code with your opponent. First to join plays.</div></div>';
      box.querySelector('#mkRoom').onclick=async()=>{
        const seats=(Games[gameId]&&Games[gameId].seats)||2;
        const code=await Net.create(gameId, seats);
        if(code){ box.innerHTML='<div class="turn-banner">Room code: <span class="big">'+code+'</span><br><span class="muted">Waiting for opponent...</span></div><div id="chatWrap"></div>';
          Chat.renderBox(box.querySelector('#chatWrap'), 'room-'+code);
          Net.onUpdate(()=>start({mode:'pvp', net:Net})); }
      };
      box.querySelector('#doJoin').onclick=async()=>{
        const code=box.querySelector('#joinCode').value;
        const ok=await Net.join(code);
        if(ok){ await Net.push({status:'playing'}); start({mode:'pvp', net:Net}); }
      };
    }
  });
}
// Called by every turn-based game: syncs state through the room.
function netTurn(net, state, nextTurn){
  if(net&&net.room) net.push({state:JSON.parse(JSON.stringify(state)), turn:nextTurn, status:'playing'});
}
function netInit(net, seats, initialState){
  // Host creates the initial state and broadcasts it.
  if(net.isHost()){ net.push({state:initialState, turn:0, status:'playing'}); }
}

/* ---------------- QuizPVP: simultaneous quiz PvP helper ----------------
   Both players answer the SAME question set at the same time; higher
   score wins. Usage in a game:
     QuizPVP.hostSet(net, items)      // host pushes items to the room
     ...each player plays locally...
     QuizPVP.submit(net, myScore)    // writes my score + done flag
     QuizPVP.allDone(state, seats)   // check via Net.onUpdate
     const w = QuizPVP.winnerUid(state.scores);
     await QuizPVP.award(w===Auth.user.uid);                              */
const QuizPVP = {
  hostSet(net, items){ if(net && net.isHost()) net.push({state:{items, scores:{}, done:{}}}); },
  submit(net, score){
    const u=Auth.user.uid;
    net.set('state/scores/'+u, score);
    net.set('state/done/'+u, true);
  },
  allDone(state, seats){
    if(!state || !state.done || !Array.isArray(seats)) return false;
    return seats.every(suid=>!!state.done[suid]);
  },
  winnerUid(scores){
    let best=null, bv=-Infinity;
    for(const k of Object.keys(scores||{})){ if(scores[k]>bv){ bv=scores[k]; best=k; } }
    return best; // tie → first uid wins
  },
  async award(didWin){ await Wallet.add(didWin?PVP_WIN:0, didWin?'pvp-win':'pvp-loss'); }
};
</script>
<script>
'use strict';
/* ================= VIEWS & ROUTER ================= */
let cleanup=null;
function setCleanup(fn){ if(cleanup){ try{cleanup();}catch(e){} } cleanup=fn; }
let inGame=false;
function goHome(){ inGame=false; setCleanup(null); Net.leave(true); Voice.leave(); show('home'); }
/* ask "are you sure?" before leaving a game — back button, nav tabs, etc. */
function confirmQuitGame(onYes){
  Sound.click();
  const r=$('#modalRoot');
  r.innerHTML='<div class="modal"><div class="card center"><div class="big">🚪 Quit this game?</div>'
    +'<div class="muted" style="margin:8px 0">Are you sure you want to quit? Your progress will be lost.</div>'
    +'<div class="row" style="gap:8px"><button class="btn grow" id="qy">Yes, quit</button>'
    +'<button class="btn secondary grow" id="qn">Keep playing</button></div></div></div>';
  r.querySelector('#qy').onclick=()=>{ r.innerHTML=''; inGame=false; (onYes||goHome)(); };
  r.querySelector('#qn').onclick=()=>{ Sound.click(); r.innerHTML=''; };
  r.querySelector('.modal').onclick=(e)=>{ if(e.target.classList.contains('modal')) r.innerHTML=''; };
}

/* ---------- AUTH ---------- */
function showAuth(){
  setCleanup(null);
  const v=$('#view');
  v.innerHTML='<div class="card"><h2>🎙️ Welcome to Hush Music Show Games</h2><div class="muted">16 game shows · win points · challenge friends</div>'
    +(!Backend.configured()?'<div class="msg">Demo mode: accounts live on this device only. Connect Firebase in Profile → Setup for real logins, friends & online play.</div>':'')
    +'<div class="betrow" id="tabs"><button class="sel" data-t="login">Log in</button><button data-t="signup">Sign up</button><button data-t="forgot">Forgot password</button></div><div id="form"></div><div class="err" id="err"></div></div>';
  let tab='login';
  const form=()=>{ const f=v.querySelector('#form');
    if(tab==='login') f.innerHTML='<label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="go">Log in</button>';
    else if(tab==='signup') f.innerHTML='<label>Username (3-16 letters/numbers/_)</label><input id="un" maxlength="16"><label>Email</label><input id="email" type="email"><label>Password (6+ chars)</label><input id="pw" type="password" autocomplete="new-password"><button class="btn" id="go">Create account — get 1,000 ⭐ free</button>';
    else f.innerHTML='<div class="muted">We\'ll email you a reset link.</div><label>Email</label><input id="email" type="email"><button class="btn" id="go">Send reset email</button>';
    f.querySelector('#go').onclick=async()=>{
      const err=v.querySelector('#err'); err.textContent='';
      try{
        if(tab==='login'){ await Auth.login(f.querySelector('#email').value, f.querySelector('#pw').value); }
        else if(tab==='signup'){ await Auth.signup(f.querySelector('#un').value, f.querySelector('#email').value, f.querySelector('#pw').value); }
        else { await Auth.resetPassword(f.querySelector('#email').value); err.className='ok'; err.textContent='Reset email sent — check your inbox.'; return; }
        await Wallet.load(); Friends.setOnline(true); show('home');
      }catch(e){ err.className='err'; err.textContent=e.message; }
    };
  };
  v.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ tab=b.getAttribute('data-t'); Sound.click(); v.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); form(); });
  form();
}

/* ---------- HOME ---------- */
function showHome(){
  const v=$('#view');
  let h='<h2>Choose a game show</h2><div class="grid">';
  GAME_ORDER.forEach(id=>{ const g=Games[id]||GAME_META[id]||{name:id,icon:'🎲'};
    h+='<div class="gamecard" data-g="'+id+'"><div class="e">'+(g.icon||'🎲')+'</div><div class="n">'+esc(g.name||id)+'</div><div class="t">'+esc(g.tags||'Game show')+(g.pvp?' · 🌐':'')+'</div></div>'; });
  h+='</div>';
  if(Wallet.canDaily()) h+='<button class="btn" id="daily">🎁 Claim daily bonus: +'+DAILY_BONUS+' ⭐</button>';
  v.innerHTML=h;
  v.querySelectorAll('.gamecard').forEach(el=>el.onclick=()=>{ Sound.click(); showGame(el.getAttribute('data-g')); });
  const d=v.querySelector('#daily'); if(d) d.onclick=async()=>{ if(await Wallet.claimDaily()){ toast('Daily bonus claimed!'); showHome(); } };
}

/* ---------- GAME ---------- */
function showGame(id){
  inGame=true;
  const g=Games[id]||{}; const v=$('#view');
  v.innerHTML='<button class="btn small secondary" id="back">← All games</button><div id="stage"></div>';
  v.querySelector('#back').onclick=()=>confirmQuitGame();
  setCleanup(()=>{ Net.leave(); });
  const meta=GAME_META[id]||{};
  const stage=v.querySelector('#stage');
  stage.innerHTML='<h2>'+(g.icon||meta.icon||'🎲')+' '+esc(g.name||meta.name||id)+'</h2><div id="modes">'+gameModesHTML(g)+'<button class="btn small secondary" id="howto" style="margin-top:8px">📖 How to play</button></div><div id="play"></div>';
  stage.querySelector('#howto').onclick=function(){
    Sound.click();
    var r=$('#modalRoot');
    var txt=(g&&g.howto)||'Have fun and good luck!';
    r.innerHTML='<div class="modal"><div class="card"><h2>📖 How to play</h2><div style="line-height:1.65;white-space:pre-line">'+esc(txt)+'</div><button class="btn" id="hx" style="margin-top:12px">Got it!</button></div></div>';
    r.querySelector('#hx').onclick=function(){Sound.click();r.innerHTML='';};
    r.querySelector('.modal').onclick=function(e){if(e.target.classList.contains('modal'))r.innerHTML='';};
  };
  wireModes(stage.querySelector('#modes'), id, (ctx)=>{
    stage.querySelector('#modes').classList.add('hidden');
    const play=stage.querySelector('#play');
    if(typeof g.render!=='function'){ play.innerHTML='<div class="msg">This game show is still being built — check back soon.</div>'; return; }
    if(ctx.mode==='pvp'){
      const vb=document.createElement('button'); vb.className='btn small secondary'; vb.textContent='🎤 Join voice chat';
      vb.onclick=async()=>{ const ok=await Voice.join('shg-'+Net.room.code); if(ok){ vb.textContent='🎤 Voice on — header mic button mutes you'; vb.disabled=true; } };
      play.appendChild(vb);
      const cv=document.createElement('div'); play.appendChild(cv);
      g.render(cv, ctx); // room cleanup already registered above; don't re-register
    } else {
      setCleanup(null);
      g.render(play, ctx);
    }
    window.scrollTo(0,0);
  });
}

/* ---------- FRIENDS ---------- */
async function showFriends(){
  const v=$('#view'); v.innerHTML='<h2>👥 Friends</h2><div class="card" id="box"><div class="muted">Loading...</div></div>';
  const box=v.querySelector('#box');
  if(Backend.mode!=='firebase'){ box.innerHTML='<div class="msg">Friends need Firebase connected.<br><br>Go to <b>Profile → Setup</b>, paste your free Firebase keys, save, reload, and come back.</div>'; return; }
  const reqs=await Friends.requests();
  const list=await Friends.list();
  let h='<div class="row"><input id="fq" class="grow" placeholder="Player code (6 letters)" maxlength="6" style="text-transform:uppercase" autocapitalize="characters"><button class="btn small" id="fadd">Add</button></div>'
    +'<div class="muted">Your code: <span class="codechip">'+esc(Auth.user.code||'?')+'</span> — share it so friends can add you.</div>';
  if(reqs.length){ h+='<h3>Requests</h3>'; reqs.forEach(r=>{ h+='<div class="row"><div class="grow">'+esc(r.from)+'</div><button class="btn small" data-acc="'+r.uid+'">Accept</button><button class="btn small secondary" data-dec="'+r.uid+'">Decline</button></div>'; }); }
  h+='<h3>Your friends ('+list.length+')</h3>';
  if(!list.length) h+='<div class="muted">No friends yet — add someone by player code.</div>';
  list.forEach(f=>{ h+='<div class="row"><div class="grow">'+(f.online?'🟢':'⚪')+' '+esc(f.username)+'</div><button class="btn small secondary" data-chat="'+f.uid+'" data-nm="'+esc(f.username)+'">Chat</button></div>'; });
  h+='<div id="dm"></div>';
  box.innerHTML=h;
  box.querySelector('#fadd').onclick=async()=>{
    const u=await Friends.findByCode(box.querySelector('#fq').value);
    if(!u){ toast('No player with that code'); return; }
    if(u.uid===Auth.user.uid){ toast('That\'s you!'); return; }
    await Friends.sendRequest(u.uid);
  };
  box.querySelectorAll('[data-acc]').forEach(b=>b.onclick=async()=>{ await Friends.accept(b.getAttribute('data-acc')); showFriends(); });
  box.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{ await Friends.decline(b.getAttribute('data-dec')); showFriends(); });
  box.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{
    const other=b.getAttribute('data-chat'); const nm=b.getAttribute('data-nm');
    const path='dm-'+[Auth.user.uid,other].sort().join('-');
    box.querySelector('#dm').innerHTML='<h3>Chat with '+esc(nm)+'</h3><div id="dmbox"></div>';
    Chat.renderBox(box.querySelector('#dmbox'), path);
  });
}

/* ---------- LEADERBOARD ---------- */

/* ---------- router ---------- */
function show(name){
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.toggle('active', b.getAttribute('data-v')===name));
  if(name==='home') showHome();
  else if(name==='friends') showFriends();
  else if(name==='leaderboard') showBoard();
  else if(name==='profile') showProfile();
}
document.querySelectorAll('#bottomNav button').forEach(b=>b.onclick=()=>{
  Sound.ensure(); if(!Auth.user){ showAuth(); return; }
  const v=b.getAttribute('data-v');
  const go=()=>{ if(v!=='home'){ setCleanup(null); Net.leave(true); Voice.leave(); } inGame=false; show(v); };
  if(inGame) confirmQuitGame(go); else go();
});

/* ---------- init ---------- */
(async function(){
  await Backend.init();
  Auth.onAuth(async u=>{
    if(u&&u.uid){
      Auth.user=u;
      await Wallet.load();
      Friends.setOnline(true);
      show('home');
    } else showAuth();
  });
  window.addEventListener('beforeunload', (e)=>{ Friends.setOnline(false); if(inGame) e.preventDefault(); });
})();
</script>
