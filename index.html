<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hush Music Show Games</title>
<style>
:root{
  --bg:#0d1420; --bg2:#131c2e; --card:#1a2540; --card2:#223052;
  --gold:#cf8f3f; --gold2:#eab676; --green:#2ecc71; --red:#e74c3c;
  --blue:#3498db; --text:#f2f5fa; --muted:#8b98b8; --line:#2c3a5e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}
header{position:sticky; top:0; z-index:50; background:linear-gradient(180deg,#182238,#101828); border-bottom:2px solid var(--gold); padding:8px 12px; display:flex; align-items:center; gap:8px;}
header .logo{font-size:20px; font-weight:800; color:var(--gold); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pill{background:var(--card2); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-weight:700; font-size:14px; white-space:nowrap;}
.pill.gold{color:var(--gold2); border-color:var(--gold);}
.iconbtn{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:12px; font-size:18px; padding:6px 10px; cursor:pointer;}
.iconbtn.off{opacity:.45;}
main{padding:12px 12px 90px; max-width:640px; margin:0 auto;}
nav.bottom{position:fixed; bottom:0; left:0; right:0; background:#101828; border-top:1px solid var(--line); display:flex; z-index:50;}
nav.bottom button{flex:1; background:none; border:none; color:var(--muted); font-size:11px; padding:10px 4px 12px; cursor:pointer;}
nav.bottom button .e{font-size:22px; display:block;}
nav.bottom button.active{color:var(--gold);}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;}
.btn{display:block; width:100%; background:linear-gradient(180deg,var(--gold),#a66a24); color:#231703; border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:800; cursor:pointer; margin:8px 0;}
.btn:disabled{opacity:.4;}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--line);}
.btn.small{padding:8px 10px; font-size:14px; width:auto; display:inline-block; margin:4px;}
.btn.danger{background:var(--red); color:#fff;}
input,select{width:100%; background:var(--bg2); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:12px; font-size:16px; margin:6px 0;}
label{font-size:13px; color:var(--muted);}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.gamecard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 8px; text-align:center; cursor:pointer;}
.gamecard .e{font-size:40px;}
.gamecard .n{font-weight:700; margin-top:6px; font-size:14px;}
.gamecard .t{font-size:11px; color:var(--muted);}
h2{color:var(--gold); margin:8px 0 12px;}
h3{margin:10px 0 6px;}
.msg{background:var(--bg2); border-left:3px solid var(--gold); padding:8px 10px; border-radius:0 10px 10px 0; margin:6px 0; font-size:14px;}
.msg .who{color:var(--gold); font-weight:700; font-size:12px;}
.err{color:var(--red); font-size:14px; margin:6px 0;}
.ok{color:var(--green); font-size:14px; margin:6px 0;}
.row{display:flex; gap:8px; align-items:center;}
.row .grow{flex:1;}
table.lb{width:100%; border-collapse:collapse; font-size:14px;}
table.lb td,table.lb th{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left;}
table.lb tr.me td{color:var(--gold); font-weight:800;}
.betrow{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
.betrow button{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer;}
.betrow button.sel{border-color:var(--gold); color:var(--gold2);}
.chatbox{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:8px; max-height:180px; overflow-y:auto; margin:8px 0;}
.modal{position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal .card{max-width:420px; width:100%; max-height:85vh; overflow-y:auto;}
.hidden{display:none !important;}
.center{text-align:center;} .muted{color:var(--muted); font-size:13px;}
.big{font-size:26px; font-weight:800;}
.status{font-size:15px; margin:8px 0; min-height:22px; font-weight:600;}
.turn-banner{background:rgba(245,185,66,.15); border:1px solid var(--gold); color:var(--gold2); border-radius:10px; padding:8px; text-align:center; font-weight:700; margin:8px 0;}
.voicebar{background:#1d2b1d; border:1px solid var(--green); border-radius:12px; padding:8px; margin:8px 0; font-size:14px;}
.codechip{display:inline-block; background:var(--bg2); border:1px dashed var(--gold); color:var(--gold2); border-radius:10px; padding:6px 14px; font-size:20px; font-weight:800; letter-spacing:4px;}
.kbd{font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<header>
  <div class="logo">🎙️ HUSH MUSIC SHOW GAMES</div>
  <div class="pill gold" id="pointsPill" title="Your points">⭐ 0</div>
  <button class="iconbtn" id="soundBtn" title="Mute game sounds">🔊</button>
  <button class="iconbtn hidden" id="micBtn" title="Mute microphone">🎤</button>
</header>
<main id="view"></main>
<nav class="bottom" id="bottomNav">
  <button data-v="home" class="active"><span class="e">🏠</span>Games</button>
  <button data-v="friends"><span class="e">👥</span>Friends</button>
  <button data-v="leaderboard"><span class="e">🏆</span>Top 50</button>
  <button data-v="profile"><span class="e">👤</span>Profile</button>
</nav>
<div id="modalRoot"></div>
<script>
'use strict';
/* =====================================================================
   CONFIG — paste keys via the Setup card (Profile) instead of here.
   Firebase: console.firebase.google.com → create project (free Spark plan,
   NO credit card) → Authentication → enable Email/Password → Realtime
   Database → Create database. Paste the 5 web-config keys in Setup.
   Voice: a Cloudflare Worker mints LiveKit tokens (its LIVEKIT_API_KEY and
   LIVEKIT_API_SECRET env vars stay on the worker, never in this file).
   The app works in DEMO MODE (this device only) until Setup is filled in.
   ===================================================================== */
const CONFIG = {
  firebase: {
    apiKey: "",
    authDomain: "",
    databaseURL: "",
    projectId: "",
    appId: ""
  },
  livekit: {
    url: "",        // e.g. wss://your-project.livekit.cloud (fallback; the token server can also return it)
    apiKey: ""
    // NOTE: no secret here — the Cloudflare Worker holds it server-side.
  }
};
const DAILY_BONUS = 500, START_POINTS = 1000, PVP_WIN = 200;
const CPU_PAYOUTS = {jeopardy:150,wheel:150,millionaire:200,price:120,feud:150,chase:150,matchgame:80,password:80,whatsmline:100,hollywood:120,deal:150,pressluck:150,pyramid:150,weakestlink:120,'1v100':200,fifthgrader:120};

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]];} return a; };
const uid = () => 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=A[rnd(A.length)]; return s; }
function toast(t){ const v=$('#view'); const d=document.createElement('div'); d.className='msg'; d.innerHTML=esc(t); v.prepend(d); setTimeout(()=>d.remove(),3500); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

/* ---------------- sound (WebAudio bleeps, mutable) ---------------- */
const Sound = {
  ctx:null, muted: localStorage.getItem('shg_muted')==='1',
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  beep(f,d,type){ if(this.muted) return; this.ensure(); if(!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.value=f||440; g.gain.value=.12;
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime+(d||.12)); o.stop(this.ctx.currentTime+(d||.12)); },
  click(){ this.beep(600,.06,'square'); }, win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,.15),i*110)); },
  lose(){ [400,300,220].forEach((f,i)=>setTimeout(()=>this.beep(f,.18,'sawtooth'),i*130)); },
  toggle(){ this.muted=!this.muted; localStorage.setItem('shg_muted', this.muted?'1':'0'); $('#soundBtn').textContent=this.muted?'🔇':'🔊'; $('#soundBtn').classList.toggle('off',this.muted); }
};
$('#soundBtn').addEventListener('click', ()=>Sound.toggle());
if(Sound.muted){ $('#soundBtn').textContent='🔇'; $('#soundBtn').classList.add('off'); }

/* ---------------- local storage (shg_ prefix for EVERYTHING) ---------------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('shg_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('shg_'+k, JSON.stringify(v)); }catch(e){} }
};

/* =====================================================================
   BACKEND — DEMO MODE (localStorage, this device only) until the user
   pastes Firebase keys into Setup (Profile). Firebase config is read from
   localStorage 'shg_fb_config' FIRST, falling back to CONFIG.firebase.
   ===================================================================== */
const Backend = {
  mode: 'local', fb: null, db: null, auth: null, fbCfg: null,
  readConfig(){
    let cfg = CONFIG.firebase;
    try{
      const raw = localStorage.getItem('shg_fb_config');
      if(raw){ const j=JSON.parse(raw); if(j && j.apiKey && String(j.apiKey).trim()) cfg=j; }
    }catch(e){}
    this.fbCfg = cfg; return cfg;
  },
  configured(){ const f=this.readConfig(); return !!(f && f.apiKey && f.databaseURL && f.projectId); },
  async init(){
    const f = this.readConfig();
    if(this.configured()){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
        this.fb = firebase.initializeApp(f);
        this.auth = firebase.auth(); this.db = firebase.database();
        this.mode = 'firebase';
      }catch(e){ console.warn('Firebase failed, demo mode', e); this.mode='local'; }
    }
    return this.mode;
  },
  onAuth(cb){
    if(this.mode==='firebase'){ this.auth.onAuthStateChanged(cb); }
    else { setTimeout(()=>cb(store.get('session',null)),0); }
  }
};

/* ---------------- AUTH (local demo + Firebase email/password) ----------------
   Every account gets a 6-char uppercase player CODE:
   local  → stored on the user record in shg_users (localStorage)
   firebase → shg_users/<uid>.code + shg_codes/<CODE> → uid                  */
const Auth = {
  user: null, // {uid, username, email, code}
  async signup(username, email, password){
    username=username.trim(); email=email.trim().toLowerCase();
    if(!/^[a-zA-Z0-9_]{3,16}$/.test(username)) throw new Error('Username: 3-16 letters, numbers or _');
    if(password.length<6) throw new Error('Password must be 6+ characters');
    if(Backend.mode==='firebase'){
      const un=await Backend.db.ref('shg_usernames/'+username.toLowerCase()).get();
      if(un.exists()) throw new Error('Username taken');
      const cred=await Backend.auth.createUserWithEmailAndPassword(email,password);
      const code=genCode();
      const u={uid:cred.user.uid, username, email, code};
      await Backend.db.ref('shg_users/'+u.uid).set({username, email, code, points:START_POINTS, wins:{}, created:Date.now(), lastDaily:0});
      await Backend.db.ref('shg_usernames/'+username.toLowerCase()).set(u.uid);
      await Backend.db.ref('shg_codes/'+code).set(u.uid);
      this.user=u; return u;
    }
    const users=store.get('users',{});
    if(Object.values(users).some(u=>u.username.toLowerCase()===username.toLowerCase())) throw new Error('Username taken');
    if(Object.values(users).some(u=>u.email===email)) throw new Error('Email already registered');
    let code=genCode();
    while(Object.values(users).some(u=>u.code===code)) code=genCode();
    const u={uid:uid(), username, email, code, pass:btoa(unescape(encodeURIComponent(password)))};
    users[u.uid]=u; store.set('users',users);
    const w=store.get('wallets',{}); w[u.uid]={points:START_POINTS, wins:{}, lastDaily:0}; store.set('wallets',w);
    store.set('session',{uid:u.uid,username:u.username,email:u.email,code:u.code});
    this.user={uid:u.uid,username:u.username,email:u.email,code:u.code}; return this.user;
  },
  async login(email,password){
    email=email.trim().toLowerCase();
    if(Backend.mode==='firebase'){
      const cred=await Backend.auth.signInWithEmailAndPassword(email,password);
      const snap=await Backend.db.ref('shg_users/'+cred.user.uid).get();
      const d=snap.val()||{};
      let code=d.code||'';
      if(!code){ // older account: backfill a code
        code=genCode();
        await Backend.db.ref('shg_users/'+cred.user.uid+'/code').set(code);
        await Backend.db.ref('shg_codes/'+code).set(cred.user.uid);
      }
      this.user={uid:cred.user.uid, username:d.username||email.split('@')[0], email, code};
      return this.user;
    }
    const users=store.get('users',{});
    const u=Object.values(users).find(x=>x.email===email);
    if(!u || u.pass!==btoa(unescape(encodeURIComponent(password)))) throw new Error('Wrong email or password');
    store.set('session',{uid:u.uid,username:u.username,email:u.email,code:u.code});
    this.user={uid:u.uid,username:u.username,email:u.email,code:u.code}; return this.user;
  },
  async logout(){
    if(Backend.mode==='firebase'){ try{await Backend.auth.signOut();}catch(e){} }
    else store.set('session',null);
    this.user=null;
  },
  async resetPassword(email){
    email=email.trim().toLowerCase();
    if(Backend.mode==='firebase'){ await Backend.auth.sendPasswordResetEmail(email); return 'reset-email'; }
    throw new Error('Password reset emails need Firebase. In demo mode, ask the device owner to reset it in Profile.');
  },
  onAuth(cb){
    if(Backend.mode==='firebase' && Backend.auth){
      Backend.auth.onAuthStateChanged(async u=>{
        if(u){
          try{
            const s=await Backend.db.ref('shg_users/'+u.uid).get();
            const d=s.val()||{};
            let code=d.code||'';
            if(!code){
              code=genCode();
              await Backend.db.ref('shg_users/'+u.uid+'/code').set(code);
              await Backend.db.ref('shg_codes/'+code).set(u.uid);
            }
            this.user={uid:u.uid, username:d.username||(u.email?u.email.split('@')[0]:'Player'), email:u.email||'', code};
            cb(this.user);
          }catch(e){
            this.user={uid:u.uid, username:(u.email?u.email.split('@')[0]:'Player'), email:u.email||'', code:''};
            cb(this.user);
          }
        } else {
          this.user=null;
          cb(null);
        }
      });
    } else {
      const sess=store.get('session',null);
      if(sess && sess.uid){
        this.user=sess;
        cb(sess);
      } else {
        this.user=null;
        cb(null);
      }
    }
  }
};

/* ---------------- WALLET (points) ---------------- */
const Wallet = {
  balance: 0, wins: {}, lastDaily: 0,
  async load(){
    if(!Auth.user){ this.balance=0; return; }
    if(Backend.mode==='firebase'){
      const s=await Backend.db.ref('shg_users/'+Auth.user.uid).get(); const d=s.val()||{};
      this.balance=d.points||0; this.wins=d.wins||{}; this.lastDaily=d.lastDaily||0;
    } else {
      const w=store.get('wallets',{})[Auth.user.uid]||{points:START_POINTS,wins:{},lastDaily:0};
      this.balance=w.points; this.wins=w.wins; this.lastDaily=w.lastDaily;
    }
    this.render();
  },
  async save(){
    if(!Auth.user) return;
    if(Backend.mode==='firebase'){ await Backend.db.ref('shg_users/'+Auth.user.uid).update({points:this.balance, wins:this.wins, lastDaily:this.lastDaily}); }
    else { const w=store.get('wallets',{}); w[Auth.user.uid]={points:this.balance,wins:this.wins,lastDaily:this.lastDaily}; store.set('wallets',w); }
    this.render();
  },
  render(){ $('#pointsPill').textContent='⭐ '+this.balance.toLocaleString(); },
  async add(n, reason){
    this.balance=Math.max(0, this.balance+n); await this.save();
    if(n>0) Sound.win(); else if(n<0) Sound.lose();
    return this.balance;
  },
  bet(amount){
    amount=Math.floor(amount);
    if(amount<=0) throw new Error('Bet must be positive');
    if(amount>this.balance) throw new Error('Not enough points');
    this.balance-=amount; this.save(); Sound.click(); return amount;
  },
  async recordWin(game){
    this.wins[game]=(this.wins[game]||0)+1;
    const payout=CPU_PAYOUTS[game]||25;
    await this.add(payout, 'win-'+game);
    return payout;
  },
  canDaily(){ return Date.now()-this.lastDaily > 20*3600*1000; },
  async claimDaily(){ if(!this.canDaily()) return false; this.lastDaily=Date.now(); await this.add(DAILY_BONUS,'daily'); return true; }
};

/* ---------------- LEADERBOARD ---------------- */
const DEMO_BOTS=[ // demo-mode seeds so the board looks alive (fixed, not random per load)
  {n:'BuzzerBetty',p:7400},{n:'DailyDouble',p:6800},{n:'ShowtimeSam',p:6100},{n:'GoldRushGus',p:5600},
  {n:'SpinQueen',p:4200},{n:'LuckyLucy',p:3300},{n:'BigBucks',p:2100},{n:'NewKid',p:950}
];
const Board = {
  async top50(){
    if(Backend.mode==='firebase'){
      const s=await Backend.db.ref('shg_users').orderByChild('points').limitToLast(50).get();
      const rows=[]; s.forEach(c=>rows.push({uid:c.key, ...(c.val()||{})}));
      return rows.reverse().filter(r=>r.username);
    }
    const users=store.get('users',{}), wallets=store.get('wallets',{});
    const real=Object.values(users).map(u=>({uid:u.uid, username:u.username, points:(wallets[u.uid]||{}).points||0, wins:(wallets[u.uid]||{}).wins||{}}));
    const bots=DEMO_BOTS.map(b=>({uid:'bot-'+b.n, username:b.n, points:b.p, wins:{}}));
    return real.concat(bots).sort((a,b)=>b.points-a.points).slice(0,50);
  },
  async myRank(){
    const top=await this.top50();
    const i=top.findIndex(r=>r.uid===(Auth.user&&Auth.user.uid));
    return i<0?null:i+1;
  }
};

/* ---------------- FRIENDS (needs Firebase; graceful in demo) ---------------- */
const Friends = {
  needNet(){ if(Backend.mode!=='firebase'){ toast('Friends need Firebase connected (see Setup in Profile).'); return false; } return true; },
  async list(){
    if(!this.needNet()) return [];
    const s=await Backend.db.ref('shg_friends/'+Auth.user.uid).get();
    const ids=s.val()||{};
    const out=[];
    for(const fid of Object.keys(ids)){
      const p=await Backend.db.ref('shg_users/'+fid).get(); const d=p.val()||{};
      const pr=await Backend.db.ref('shg_presence/'+fid).get();
      out.push({uid:fid, username:d.username||'?', code:d.code||'', online:!!(pr.val()&&pr.val().online)});
    }
    return out;
  },
  async findByCode(code){
    if(!this.needNet()) return null;
    code=String(code||'').trim().toUpperCase();
    if(code.length!==6) return null;
    const s=await Backend.db.ref('shg_codes/'+code).get();
    if(!s.exists()) return null;
    const p=await Backend.db.ref('shg_users/'+s.val()).get();
    return {uid:s.val(), ...(p.val()||{})};
  },
  async sendRequest(toUid){
    if(!this.needNet()) return;
    await Backend.db.ref('shg_requests/'+toUid+'/'+Auth.user.uid).set({from:Auth.user.username, at:Date.now()});
    toast('Friend request sent');
  },
  async requests(){
    if(Backend.mode!=='firebase') return [];
    const s=await Backend.db.ref('shg_requests/'+Auth.user.uid).get();
    const r=s.val()||{}; return Object.keys(r).map(k=>({uid:k, ...r[k]}));
  },
  async accept(uid){
    const m={}; m['shg_friends/'+Auth.user.uid+'/'+uid]=true; m['shg_friends/'+uid+'/'+Auth.user.uid]=true;
    m['shg_requests/'+Auth.user.uid+'/'+uid]=null;
    await Backend.db.ref().update(m); toast('Friend added');
  },
  async decline(uid){ await Backend.db.ref('shg_requests/'+Auth.user.uid+'/'+uid).remove(); },
  async setOnline(on){
    if(Backend.mode!=='firebase'||!Auth.user) return;
    const r=Backend.db.ref('shg_presence/'+Auth.user.uid);
    if(on){ r.set({online:true, at:Date.now()}); r.onDisconnect().set({online:false, at:Date.now()}); }
    else r.set({online:false, at:Date.now()});
  }
};

/* ---------------- CHAT (room chat / DM; needs Firebase) ---------------- */
const Chat = {
  renderBox(container, path){
    container.innerHTML='<div class="chatbox" id="chatlog"></div><div class="row"><input id="chatIn" class="grow" placeholder="Say something..." maxlength="200"><button class="btn small" id="chatSend">Send</button></div>';
    const log=container.querySelector('#chatlog');
    if(Backend.mode!=='firebase'){ log.innerHTML='<div class="muted">Chat needs Firebase connected.</div>'; return; }
    const ref=Backend.db.ref('shg_chat/'+path).limitToLast(30);
    ref.on('child_added', snap=>{
      const m=snap.val()||{};
      const d=document.createElement('div'); d.className='msg';
      d.innerHTML='<span class="who">'+esc(m.who)+':</span> '+esc(m.text);
      log.appendChild(d); log.scrollTop=log.scrollHeight;
    });
    const send=()=>{
      const inp=container.querySelector('#chatIn'); const t=inp.value.trim(); if(!t) return;
      Backend.db.ref('shg_chat/'+path).push({who:Auth.user.username, uid:Auth.user.uid, text:t, at:Date.now()});
      inp.value=''; Sound.click();
    };
    container.querySelector('#chatSend').onclick=send;
    container.querySelector('#chatIn').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
  }
};

/* ---------------- PVP ROOMS (needs Firebase) ---------------- */
const Net = {
  room: null, // {code, game, seatsNeeded, seats:[uids], names:{}, state, turn, status, host, created}
  _off: [],
  needNet(){ if(Backend.mode!=='firebase'){ toast('Online PvP needs Firebase connected (see Setup in Profile).'); return false; } return true; },
  async create(game, seats){
    if(!this.needNet()) return null;
    const code=String(rnd(9000)+1000);
    const room={code, game, seatsNeeded:seats, seats:[Auth.user.uid], names:{[Auth.user.uid]:Auth.user.username}, state:null, turn:0, status:'waiting', host:Auth.user.uid, created:Date.now()};
    await Backend.db.ref('shg_rooms/'+code).set(room);
    this.room=room; this._listen(code);
    return code;
  },
  async join(code){
    if(!this.needNet()) return null;
    code=String(code).trim();
    const s=await Backend.db.ref('shg_rooms/'+code).get();
    if(!s.exists()){ toast('Room not found'); return null; }
    const room=s.val();
    if(room.status!=='waiting'){ toast('Game already started'); return null; }
    if(!room.seats.includes(Auth.user.uid)){
      if(room.seats.length>=room.seatsNeeded){ toast('Room is full'); return null; }
      room.seats.push(Auth.user.uid); room.names[Auth.user.uid]=Auth.user.username;
      await Backend.db.ref('shg_rooms/'+code+'/seats').set(room.seats);
      await Backend.db.ref('shg_rooms/'+code+'/names').set(room.names);
    }
    this.room=room; this._listen(code);
    return code;
  },
  mySeat(){ return this.room? this.room.seats.indexOf(Auth.user.uid) : -1; },
  isHost(){ return this.room && this.room.host===Auth.user.uid; },
  _listen(code){
    this.leave(true);
    const ref=Backend.db.ref('shg_rooms/'+code);
    const h=snap=>{ const r=snap.val(); if(!r) return; const st=JSON.stringify(r.state);
      const changed = st!==JSON.stringify(this.room?this.room.state:null) || r.turn!==(this.room?this.room.turn:-1) || r.status!==(this.room?this.room.status:'');
      this.room=r; if(changed && this._onUpdate) this._onUpdate(r);
    };
    ref.on('value', h); this._off.push(()=>ref.off('value',h));
  },
  onUpdate(cb){ this._onUpdate=cb; },
  async push(patch){
    if(!this.room) return;
    Object.assign(this.room, patch);
    await Backend.db.ref('shg_rooms/'+this.room.code).update(patch);
  },
  // Targeted write into the current room (e.g. 'state/scores/'+uid)
  async set(path, val){
    if(!this.room || Backend.mode!=='firebase') return;
    return Backend.db.ref('shg_rooms/'+this.room.code+'/'+path).set(val);
  },
  async leave(silent){
    this._off.forEach(f=>{try{f()}catch(e){}}); this._off=[];
    if(!silent && this.room && Backend.mode==='firebase'){
      try{ if(this.isHost()) await Backend.db.ref('shg_rooms/'+this.room.code).remove(); }catch(e){}
    }
    this.room=null; this._onUpdate=null;
    Voice.leave();
  }
};

/* ---------------- VOICE (Cloudflare Worker token server; NO client secret) ---
   The worker URL is pasted once in Setup (Profile) → localStorage
   'shg_voice_worker'. Voice.join fetches a token:
   GET <workerUrl>?room=<room>&identity=<username>
   The server answers JSON {"token":"..."} (optionally with "url") or a
   raw-text token. livekit-client loads from jsdelivr. Voice room name
   pattern: 'shg-'+roomCode.                                          */
const Voice = {
  room:null, micMuted:false, active:false,
  workerUrl(){ return store.get('voice_worker',''); },
  configured(){ return !!this.workerUrl(); },
  async join(roomName){
    if(!this.configured()){ toast('Voice needs a token server — paste your Cloudflare Worker URL in Profile → Setup.'); return false; }
    if(this.active) return true;
    try{
      await loadScript('https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js');
      const res=await fetch(this.workerUrl()+'?room='+encodeURIComponent(roomName)+'&identity='+encodeURIComponent(Auth.user.username));
      if(!res.ok) throw new Error('token server HTTP '+res.status);
      const txt=(await res.text()).trim();
      let token=txt, lkUrl=CONFIG.livekit.url||'';
      try{ const j=JSON.parse(txt); if(j&&j.token){ token=String(j.token); if(j.url) lkUrl=String(j.url); } }catch(e){}
      if(!token) throw new Error('empty token');
      if(!lkUrl) throw new Error('token server did not return a LiveKit URL');
      const r=new LivekitClient.Room();
      await r.connect(lkUrl, token);
      await r.localParticipant.setMicrophoneEnabled(true);
      this.room=r; this.active=true; this.micMuted=false;
      $('#micBtn').classList.remove('hidden'); this._micIcon();
      toast('🎤 Voice connected — talk to your opponent');
      return true;
    }catch(e){ console.warn(e); toast('Voice failed to connect'); return false; }
  },
  _micIcon(){ $('#micBtn').textContent=this.micMuted?'🚫':'🎤'; $('#micBtn').classList.toggle('off',this.micMuted); },
  toggleMic(){ if(!this.room) return; this.micMuted=!this.micMuted; this.room.localParticipant.setMicrophoneEnabled(!this.micMuted); this._micIcon(); },
  leave(){
    if(this.room){ try{this.room.disconnect();}catch(e){} }
    this.room=null; this.active=false; $('#micBtn').classList.add('hidden');
  }
};
$('#micBtn').addEventListener('click', ()=>Voice.toggleMic());

    var wheelLogoImg=new Image();wheelLogoImg.src=WHEEL_LOGO;
    wheelLogoImg.onload=function(){try{paintWheel();}catch(e){}};
    /* ---- Wheel of Fortune visuals: canvas spinner + classic tile board ---- */
    var WHEEL_CSS='.wheelwrap{display:flex;justify-content:center;margin:4px 0}'
      +'.wboard{background:#081426;border:3px solid #1e3a5f;border-radius:10px;padding:10px 4px;margin:8px 0}'
      +'.wrow{display:flex;justify-content:center;gap:1.2%;margin:1% 0}'
      +'.wtile{width:6.1%;aspect-ratio:3/4;border-radius:3px;background:linear-gradient(135deg,#27ab83,#0e6b51),repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 3px,rgba(255,255,255,0) 3px 6px);border:1px solid #073c2f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(11px,4.2vw,20px);color:#08131f}'
      +'.wtile.lit{background:#f2f5f7;border-color:#9fb3c8}'
      +'.wtile.gap{background:none;border:none}';
    function paintWheel(){
      var cv=c.querySelector('#wheelcv');if(!cv)return;
      var g=cv.getContext('2d'),W=cv.width,cx=W/2,cy=W/2,R=W/2-8;
      var layout=SHG.wheelLayout(),n=layout.length,arc=Math.PI*2/n,i,a0;
      g.clearRect(0,0,W,W);
      for(i=0;i<n;i++){
        a0=wheelRot+i*arc;
        g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a0,a0+arc);g.closePath();
        var wdg=layout[i],s=wdg.v;
        g.fillStyle=wdg.c;
        g.fill();g.lineWidth=2;g.strokeStyle='#0d1420';g.stroke();
        g.save();g.translate(cx,cy);g.rotate(a0+arc/2);
        g.textAlign='right';g.textBaseline='middle';
        var label=(typeof s==='number')?'$'+s:(s==='FREE SPIN'?'$'+wdg.cash:s);
        g.font='bold '+(label.length>9?W/30:W/24)+'px Arial,sans-serif';
        g.fillStyle=s==='BANKRUPT'?'#ffffff':'#101010';
        g.fillText(label,R-8,0);
        if(s==='FREE SPIN'){g.font='bold '+Math.max(8,W/44)+'px Arial,sans-serif';g.fillStyle='#083f31';g.fillText('FREE SPIN',R-8,16);}
        g.restore();
      }
      var hr=R*0.30;
      g.save();
      g.beginPath();g.arc(cx,cy,hr,0,Math.PI*2);g.clip();
      g.fillStyle='#0d1420';g.fillRect(cx-hr,cy-hr,hr*2,hr*2);
      if(wheelLogoImg.complete&&wheelLogoImg.naturalWidth)g.drawImage(wheelLogoImg,cx-hr,cy-hr,hr*2,hr*2);
      g.restore();
      g.beginPath();g.arc(cx,cy,hr,0,Math.PI*2);
      g.lineWidth=4;g.strokeStyle='#cf8f3f';g.stroke();
      g.beginPath();g.moveTo(cx-10,2);g.lineTo(cx+10,2);g.lineTo(cx,hr+14);g.closePath();
      g.fillStyle='#cf8f3f';g.fill();g.lineWidth=2;g.strokeStyle='#0d1420';g.stroke();
    }
    function animateWheel(seg,done){
      var segs=SHG.wheelSegments(),n=segs.length,arc=Math.PI*2/n,i,cands=[];
      for(i=0;i<n;i++)if(segs[i]===seg)cands.push(i);
      var t=cands[Math.floor(Math.random()*cands.length)];
      var jitter=(Math.random()*0.7-0.35)*arc;
      var target=-Math.PI/2-(t+0.5)*arc+jitter;
      var TAU=Math.PI*2,delta=((target-wheelRot)%TAU+TAU)%TAU+(5+Math.floor(Math.random()*2))*TAU;
      var start=wheelRot,dur=2600+Math.random()*700,t0=performance.now(),lastTick=-1;
      spinning=true;
      function frame(now){
        if(!c.isConnected)return;
        var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
        wheelRot=start+delta*e;paintWheel();
        var under=Math.floor((((-Math.PI/2-wheelRot)/arc)%n+n)%n);
        if(under!==lastTick){lastTick=under;Sound.beep(880,.03,'square');}
        if(p<1)requestAnimationFrame(frame);
        else{spinning=false;done();}
      }
      requestAnimationFrame(frame);
    }
    function doSpin(who){
      if(spinning)return;
      var seg=SHG.wheelSpin();
      var el=c.querySelector('#ctl');
      if(el&&who===0)el.innerHTML='<div class="status">🌀 Spinning…</div>';
      animateWheel(seg,function(){if(c.isConnected)resolveSpin(who,seg);});
    }
    function layoutRows(p){
      var widths=[12,14,14,12],words=String(p).toUpperCase().split(' '),lines=[],line='';
      words.forEach(function(w){
        var wd=widths[Math.min(lines.length,3)];
        if(w.length>wd){
          if(line){lines.push(line);line='';}
          while(w.length>wd){lines.push(w.slice(0,wd));w=w.slice(wd);}
          line=w;return;
        }
        if(((line?line.length+1:0)+w.length)<=wd)line=line?line+' '+w:w;
        else{lines.push(line);line=w;}
      });
      if(line)lines.push(line);
      while(lines.length>4){var ex=lines.pop();lines[3]=(lines[3]+' '+ex).slice(0,widths[3]);}
      return lines.map(function(ln,i){
        var wd=widths[i],s=String(ln||'');
        if(s.length>wd)s=s.slice(0,wd);
        var pad=wd-s.length,left=Math.floor(pad/2);
        return new Array(left+1).join(' ')+s+new Array(pad-left+1).join(' ');
      });
    }
    function boardHTML(){
      var rows=layoutRows(puz.puzzle),h='';
      rows.forEach(function(row){
        h+='<div class="wrow">';
        for(var i=0;i<row.length;i++){
          var ch=row[i];
          if(ch===' ')h+='<div class="wtile gap"></div>';
          else if(/[A-Z]/.test(ch)){var l=ch.toLowerCase(),rv=revealed[l];h+='<div class="wtile'+(rv?' lit':'')+'">'+(rv?ch:'')+'</div>';}
          else h+='<div class="wtile lit">'+esc(ch)+'</div>';
        }
        h+='</div>';
      });
      return h;
    }
    function newRound(){
      if(ri>=puzs.length){endGame();return;}
      puz=puzs[ri];revealed={};guessed={};bank=0;bbank=[0,0];turn=0;spinning=false;ftok=[0,0,0];
      c.innerHTML='<h2>🎡 Round '+(ri+1)+' of '+puzs.length+' — '+esc(puz.cat)+'</h2><style>'+WHEEL_CSS+'</style>'
        +'<div class="wheelwrap"><canvas id="wheelcv" width="320" height="320"></canvas></div>'
        +'<div class="wboard" id="bd"></div><div id="ctl"></div>';
      paintWheel();
      takeTurn();
    }
    function scoreLine(){
      var s='<b>You:</b> '+g1Money(tot.You)+' <span class="muted">(round '+g1Money(bank)+')</span>'+(ftok[0]?' 🆓×'+ftok[0]:'');
      bots.forEach(function(b,i){s+='<br><b>'+esc(b)+':</b> '+g1Money(tot[b])+' <span class="muted">('+g1Money(bbank[i])+')</span>'+(ftok[i+1]?' 🆓×'+ftok[i+1]:'');});
      return s;
    }
    function msg(t){var e=c.querySelector('#wmsg');if(e)e.innerHTML=t;}
    function draw(){
      var bd=c.querySelector('#bd');if(!bd)return;
      bd.innerHTML=boardHTML()+'<div class="status" style="padding:2px 8px 0">'+scoreLine()+'</div><div class="muted" id="wmsg" style="padding:0 8px 4px"></div>';
    }
    function solved(){var pl=puz.puzzle.toLowerCase();for(var i=0;i<pl.length;i++){var l=pl[i];if(/[a-z]/.test(l)&&!revealed[l])return false;}return true;}
    function takeTurn(){draw();if(turn===0)playerCtl();else botCtl(bots[turn-1],turn-1);}
    function nextTurn(){turn=useBots?(turn+1)%3:0;takeTurn();}
    function playerCtl(){
      var el=c.querySelector('#ctl');
      el.innerHTML='<div class="row"><button class="btn small grow" id="sp">🌀 SPIN</button><button class="btn small grow" id="vw">Buy vowel $250</button><button class="btn small grow" id="sv">Solve</button></div><div id="inp"></div>';
      el.querySelector('#sp').onclick=function(){Sound.click();doSpin(0);};
      el.querySelector('#vw').onclick=function(){
        Sound.click();
        if(bank<250){toast('Need $250 in the round bank');return;}
        var inp=el.querySelector('#inp');
        inp.innerHTML='<div class="row"><input id="vl" maxlength="1" class="grow" placeholder="Vowel: a e i o u"><button class="btn small" id="vg">Buy $250</button></div>';
        inp.querySelector('#vg').onclick=function(){
          var l=inp.querySelector('#vl').value.toLowerCase();
          if(VOW.indexOf(l)<0||guessed[l]){msg('Pick an uncalled vowel.');return;}
          bank-=250;guessed[l]=1;Sound.click();
          if(puz.puzzle.toLowerCase().indexOf(l)>=0){revealed[l]=1;msg('✅ '+l.toUpperCase()+' is in there!');if(solved()){solveRound(0);return;}}
          else{msg('❌ No '+l.toUpperCase()+'.');Sound.lose();}
          takeTurn();
        };
      };
      el.querySelector('#sv').onclick=function(){
        Sound.click();
        var inp=el.querySelector('#inp');
        inp.innerHTML='<div class="row"><input id="sl" class="grow" placeholder="Solve the puzzle…"><button class="btn small" id="sg">Solve</button></div>';
        inp.querySelector('#sg').onclick=function(){
          var s=inp.querySelector('#sl').value;
          if(SHG.jeopardyGrade(s,puz.puzzle))solveRound(0);
          else if(ftok[0]>0){ftok[0]--;Sound.win();msg('🆓 FREE SPIN saves your turn!');setTimeout(takeTurn,1100);}
          else{misses++;Sound.lose();msg('❌ Not quite!');setTimeout(nextTurn,1100);}
        };
      };
    }
    function resolveSpin(who,seg){
      var name=who===0?'You':bots[who-1];
      var fsNote='';
      if(seg==='FREE SPIN'){ftok[who]++;seg=500;fsNote='🆓 FREE SPIN token banked! ';}
      if(seg==='BANKRUPT'){if(who===0)bank=0;else bbank[who-1]=0;ftok[who]=0;Sound.lose();msg('💥 '+esc(name)+' hit BANKRUPT!');setTimeout(nextTurn,1300);return;}
      if(seg==='LOSE A TURN'){Sound.beep(300,.2);msg('⏭ '+esc(name)+' loses a turn.');setTimeout(nextTurn,1300);return;}
      if(who===0){
        var el=c.querySelector('#ctl');
        el.innerHTML='<div class="status">'+fsNote+g1Money(seg)+' per consonant</div><div class="row"><input id="cl" maxlength="1" class="grow" placeholder="Consonant"><button class="btn small" id="cg">Guess</button></div>';
        el.querySelector('#cg').onclick=function(){
          var l=el.querySelector('#cl').value.toLowerCase();Sound.click();
          if(!/[a-z]/.test(l)||VOW.indexOf(l)>=0||guessed[l]){msg('Enter an uncalled consonant.');return;}
          guessLetter(0,l,seg);
        };
      }else{
        var l=botCons();
        msg(fsNote+'🌀 '+esc(name)+' spins '+g1Money(seg)+' and calls <b>'+l.toUpperCase()+'</b>…');
        g1Delay(900).then(function(){if(c.isConnected)guessLetter(who,l,seg);});
      }
    }
    function guessLetter(who,l,seg){
      var name=who===0?'You':bots[who-1];
      guessed[l]=1;
      var pl=puz.puzzle.toLowerCase(),count=0,i;
      for(i=0;i<pl.length;i++)if(pl[i]===l)count++;
      if(count>0){
        revealed[l]=1;var amt=seg*count;
        if(who===0)bank+=amt;else bbank[who-1]+=amt;
        Sound.win();msg('✅ '+count+'× '+l.toUpperCase()+'! +'+g1Money(amt)+' to '+esc(name));
        if(solved()){solveRound(who);return;}
        if(who===0)setTimeout(takeTurn,1100);else botCont(who);
      }else{
        if(ftok[who]>0){ftok[who]--;Sound.win();msg('🆓 '+esc(name)+' uses a FREE SPIN — turn saved!');setTimeout(takeTurn,1100);return;}
        if(who===0)misses++;
        Sound.lose();msg('❌ No '+l.toUpperCase()+'.');setTimeout(nextTurn,1100);
      }
    }
    function botCons(){var f='tnshrdlcmfwypvbgkqjxz';for(var i=0;i<f.length;i++)if(!guessed[f[i]])return f[i];return 't';}
    function revFrac(){var pl=puz.puzzle.toLowerCase(),t=0,r=0;for(var i=0;i<pl.length;i++)if(/[a-z]/.test(pl[i])){t++;if(revealed[pl[i]])r++;}return t?r/t:1;}
    function botCtl(name,bi){
      c.querySelector('#ctl').innerHTML='<div class="status">🤖 '+esc(name)+' is thinking…</div>';
      g1Delay(1000).then(function(){
        if(!c.isConnected)return;
        if(revFrac()>0.55&&Math.random()<0.5){
          if(Math.random()<0.6){solveRound(bi+1);return;}
          if(ftok[bi+1]>0){ftok[bi+1]--;msg('🆓 '+esc(name)+' uses a FREE SPIN — turn saved!');setTimeout(takeTurn,1100);return;}
          msg('🤖 '+esc(name)+' tries to solve… wrong!');setTimeout(nextTurn,1100);return;
        }
        doSpin(bi+1);
      });
    }
    function botCont(who){
      var bi=who-1,name=bots[bi];
      g1Delay(900).then(function(){
        if(!c.isConnected)return;
        if(bbank[bi]>=250&&Math.random()<0.35){
          var vw='aeiou'.split('').filter(function(v){return !guessed[v];});
          if(vw.length){
            var v=vw[Math.floor(Math.random()*vw.length)];guessed[v]=1;bbank[bi]-=250;
            if(puz.puzzle.toLowerCase().indexOf(v)>=0){revealed[v]=1;msg('🤖 '+esc(name)+' buys '+v.toUpperCase()+' — in there!');if(solved()){solveRound(who);return;}}
            else msg('🤖 '+esc(name)+' buys '+v.toUpperCase()+' — nope.');
          }
        }
        turn=who;takeTurn();
      });
    }
    function solveRound(who){
      var name=who===0?'You':bots[who-1];
      var amt=who===0?bank:bbank[who-1];
      tot[name]+=amt;Sound.win();
      var ctl=c.querySelector('#ctl');if(ctl)ctl.innerHTML='<div class="ok">🎉 '+esc(name)+' solves it: "'+esc(puz.puzzle)+'" — banks '+g1Money(amt)+'!</div>';
      ri++;setTimeout(function(){if(c.isConnected)newRound();},2000);
    }
    function endGame(){
      var names=Object.keys(tot),win=names[0];
      names.forEach(function(n){if(tot[n]>tot[win])win=n;});
      var h='<h2>🏁 Final totals</h2><div class="card"><table class="lb">'+names.map(function(n){return '<tr><td>'+esc(n)+'</td><td>'+g1Money(tot[n])+'</td></tr>';}).join('')+'</table>';
      if(fin){
        var score=Math.round(tot.You-misses*10);
        c.innerHTML=h+'<div class="status">Your score: '+score+' (bank − 10 per miss)</div><div class="muted">Waiting for opponent…</div></div>';
        fin(score);return;
      }
      var iWon=win==='You'&&tot.You>0;
      h+='<div class="status">'+(iWon?'<span class="ok">🏆 You win Wheel of Fortune!</span>':'<span class="err">😞 '+esc(win)+' wins.</span>')+'</div></div>';
      c.innerHTML=h;
      if(iWon){Sound.win();(async function(){var p=await Wallet.recordWin('wheel');toast('+'+p+' ⭐ banked!');})();}
      else Sound.lose();
    }
    newRound();
  }
}});

regGame('price',{name:'The Price Is Right',icon:'🏷️',tags:'Game Show',pvp:true,seats:2,

        else{Sound.lose();h+='<div class="err">😞 '+esc(bots[0])+' wins the showcase.</div>';}
        c.querySelector('#res').innerHTML=h;
        if(youWin)(async function(){await Wallet.recordWin('price');})();
      };
    }
  }

/* ================= FAMILY FEUD ================= */
regGame('feud',{name:'Family Feud',icon:'👪',tags:'Game Show',pvp:true,seats:2,
render:function(c,ctx){
  var net=(ctx&&ctx.mode==='pvp')?ctx.net:null;
  if(g1Guard(c,BANKS2.feud.length>=8))return;
  var share=function(){return JSON.parse(JSON.stringify(g1PickN(BANKS2.feud,8)));};
  if(net)g1Pvp(net,share,function(d,fin){pvpPlay(d.slice(0,3),fin);},function(iw,sc){g1Settle(c,iw,sc,'Family Feud');});
  else cpuPlay(share());
  function boardHTML(s,revealed,strikes,rp){
    var h='<div class="big" style="font-size:18px">'+esc(s.q)+'</div><table class="lb">';
    s.answers.forEach(function(a,i){var r=revealed.indexOf(i)>=0;h+='<tr><td>'+(i+1)+'</td><td>'+(r?esc(a.t):'____________')+'</td><td>'+(r?a.pts:'')+'</td></tr>';});
    h+='</table><div class="status">Strikes: '+'❌'.repeat(strikes)+' · Round pts: '+rp+'</div>';
    return h;
  }
  /* board + guess row; onGuess(text) on submit */
  function askRound(title,s,revealed,strikes,rp,extra,onGuess){
    var h='<h2>'+title+'</h2><div class="card">'+boardHTML(s,revealed,strikes,rp)+(extra||'')
      +'<div class="row"><input id="g" class="grow" placeholder="Your guess…" autocomplete="off"><button class="btn small" id="go">Guess</button></div></div>';
    c.innerHTML=h;
    var inp=c.querySelector('#g');
    function go(){var v=inp.value.trim();if(!v)return;Sound.click();onGuess(v);}
    c.querySelector('#go').onclick=go;
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  }
  function findMatch(v,s,revealed,topFirst){
    var idx=-1;
    s.answers.forEach(function(a,i){
      if(revealed&&revealed.indexOf(i)>=0)return;
      if(SHG.feudMatch(v,a.t)&&(idx<0||(topFirst&&a.pts>s.answers[idx].pts)))idx=i;
    });
    return idx;
  }
  function cpuPlay(survs){
    var bot=g1Bots(1)[0],ri=0,myTot=0,botTot=0;
    round();
    function round(){
      if(ri>=3){fastMoney();return;}
      var s=survs[ri],revealed=[],strikes=0,rp=0;
      ask();
      function ask(msg){
        askRound('👪 Round '+(ri+1)+' of 3',s,revealed,strikes,rp,
          (msg?'<div class="msg">'+msg+'</div>':'')+'<div class="muted">You: '+myTot+' · '+esc(bot)+': '+botTot+'</div>',onGuess);
      }
      function onGuess(v){
        var idx=findMatch(v,s,revealed,false);
        if(idx>=0){
          revealed.push(idx);rp+=s.answers[idx].pts;Sound.win();
          if(revealed.length>=s.answers.length){myTot+=rp;ask('🎉 Board cleared! +'+rp+' pts');setTimeout(function(){if(c.isConnected){ri++;round();}},1500);return;}
          ask('✅ "'+esc(s.answers[idx].t)+'" — '+s.answers[idx].pts+' pts!');
        }else{
          strikes++;Sound.lose();
          if(strikes>=3){steal();return;}
          ask('❌ Strike '+strikes+'!');
        }
      }
      function steal(){
        var unrev=s.answers.filter(function(a,i){return revealed.indexOf(i)<0;});
        var ok=Math.random()<Math.min(0.9,0.25+0.12*unrev.length);
        if(ok)botTot+=rp;else myTot+=rp;
        c.innerHTML='<div class="card"><div class="'+(ok?'err':'ok')+'">'+(ok?'😈 '+esc(bot)+' steals the round! +'+rp+' pts to them.':'🛡️ Steal failed! You bank '+rp+' pts.')+'</div><button class="btn" id="nx">Next round</button></div>';
        if(ok)Sound.lose();else Sound.win();
        c.querySelector('#nx').onclick=function(){Sound.click();ri++;round();};
      }
    }
    function fastMoney(){

      c.querySelector('#go').onclick=function(){Sound.click();fq();};

          if(win){Sound.win();(async function(){await Wallet.recordWin('feud');})();}
          else Sound.lose();

        var q=qs[qi],over=false;

        var inp=c.querySelector('#g');

        function ans(){

          var idx=findMatch(inp.value.trim(),q,null,true);
          if(idx>=0){Sound.win();next(q.answers[idx].pts,q.answers[idx].t);}else{Sound.lose();next(0,null);}

  function pvpPlay(survs,fin){

regGame('chase',{name:'The Chase',icon:'🏃',tags:'Game Show',pvp:true,seats:2,
render:function(c,ctx){
  var net=(ctx&&ctx.mode==='pvp')?ctx.net:null;
  if(g1Guard(c,BANKS2.chase.length>=10))return;
  var share=function(){return JSON.parse(JSON.stringify(g1PickN(BANKS2.chase,15)));};
  if(net)g1Pvp(net,share,function(d,fin){solo(d,fin);},function(iw,sc){g1Settle(c,iw,sc,'The Chase');});
  else solo(share(),null);
  /* fin null → full CPU game (with Final Chase); else PvP submit(builder*100 + escape?5000:0) */
  function solo(qs,fin){
    var qi=0,correct=0;
    c.innerHTML='<h2>🏃 Cash Builder — 60s</h2><div class="card"><div class="status">Correct: <b id="cc">0</b> · ⏱ <span id="tmr">60s</span></div><div class="big" style="font-size:18px" id="q"></div><div id="ch"></div></div>';
    ask();
    g1Timer(c,60,c.querySelector('#tmr'),function(){cashDone();});
    function ask(){
      var q=qs[qi%qs.length];qi++;
      c.querySelector('#q').textContent=q.q;
      g1Choices(c,q,function(i){
        if(i===q.correct){correct++;var cc=c.querySelector('#cc');if(cc)cc.textContent=correct;Sound.win();}
        else Sound.lose();
        if(c.isConnected)ask();
      });
    }
    function cashDone(){
      if(!c.isConnected)return;
      var money=correct*1000,diff=correct>8?'hard':(correct>5?'medium':'easy');
      chasePhase(money,diff);
    }
    function chasePhase(money,diff){
      var P=4,C=7,turn=0;
      c.innerHTML='<h2>🏃 The Chase</h2><div class="card"><div class="muted">Cash: '+g1Money(money)+' · Escape to step 0! Chaser ('+diff+') starts 3 steps back.</div><div id="bd"></div><div class="big" style="font-size:18px" id="q"></div><div id="ch"></div></div>';
      draw();qTurn();
      function draw(){
        var h='<div style="font-size:20px;line-height:1.8">';
        for(var s=7;s>=0;s--)h+=((s===P?'🧍':'')+(s===C?'😈':'')+((s!==P&&s!==C)?'·':'')+' step '+s+(s===0?' 🏦':'')+'<br>');
        h+='</div>';c.querySelector('#bd').innerHTML=h;
      }
      function qTurn(){
        var q=qs[Math.floor(Math.random()*qs.length)],isChaser=turn%2===1;
        c.querySelector('#q').innerHTML=(isChaser?'😈 <b>Chaser\'s question:</b> ':'🧍 <b>Your question:</b> ')+esc(q.q);
        var ch=c.querySelector('#ch');
        if(isChaser){
          ch.innerHTML='<div class="muted">Chaser is thinking…</div>';
          setTimeout(function(){
            if(!c.isConnected)return;
            if(SHG.chaseBotCorrect(diff)){C--;Sound.lose();ch.innerHTML='<div class="err">Chaser correct — moves down.</div>';}
            else{Sound.win();ch.innerHTML='<div class="ok">Chaser misses!</div>';}
            step();
          },1200);
          return;
        }
        g1Choices(c,q,function(i){
          var ch2=c.querySelector('#ch');
          if(i===q.correct){P--;Sound.win();ch2.innerHTML='<div class="ok">Correct — you move down!</div>';}
          else{Sound.lose();ch2.innerHTML='<div class="err">Wrong! (was '+esc(q.choices[q.correct])+')</div>';}
          step();
        });
      }
      function step(){
        turn++;
        setTimeout(function(){
          if(!c.isConnected)return;
          if(C<=P){caught();return;}
          if(P<=0){escaped(money);return;}
          draw();qTurn();
        },900);
      }
      function caught(){
        c.innerHTML='<div class="card center"><div class="big">😈 CAUGHT!</div><div class="muted">The chaser got you — no bank.</div></div>';Sound.lose();
        if(fin)fin(correct*100);
      }
      function escaped(money){
        if(fin){fin(correct*100+5000);c.innerHTML='<div class="card center"><div class="big">🏦 ESCAPED!</div><div class="muted">Waiting for opponent…</div></div>';return;}
        finalChase(money);
      }
    }
    function finalChase(money){
      var S=0,qn=0;
      c.innerHTML='<h2>🏁 Final Chase — 60s</h2><div class="card"><div class="muted">Answer fast! Each correct = 1 step head start.</div><div class="status">Head start: <b id="ss">0</b> · ⏱ <span id="tmr">60s</span></div><div class="big" style="font-size:18px" id="q"></div><div id="ch"></div></div>';
      ask2();
      g1Timer(c,60,c.querySelector('#tmr'),function(){chaseDown();});
      function ask2(){
        var q=qs[qn%qs.length];qn++;
        var qel=c.querySelector('#q');if(!qel)return;qel.textContent=q.q;
        g1Choices(c,q,function(i){
          if(i===q.correct){S++;var ss=c.querySelector('#ss');if(ss)ss.textContent=S;Sound.win();}
          else Sound.lose();
          if(c.isConnected)ask2();
        });
      }
      function chaseDown(){
        if(!c.isConnected)return;
        var need=S+1,got=0,tries=S+2,i=0;
        c.innerHTML='<div class="card"><div class="muted">Final chase: chaser needs '+need+' correct from '+tries+'…</div><div id="cd"></div></div>';
        (function next(){
          if(i>=tries||got>=need){verdict();return;}
          if(SHG.chaseBotCorrect('hard'))got++;
          i++;
          var cd=c.querySelector('#cd');if(cd)cd.innerHTML='<div class="status">Chaser: '+got+' / '+need+'</div>';
          setTimeout(next,600);
        })();
        function verdict(){
          if(got>=need){c.innerHTML='<div class="card center"><div class="big">😈 Caught in the Final Chase!</div></div>';Sound.lose();}
          else{
            c.innerHTML='<div class="card center"><div class="big">🏆 YOU BEAT THE CHASER!</div><div class="muted">You bank '+g1Money(money)+'</div></div>';
            Sound.win();(async function(){await Wallet.recordWin('chase');})();
          }
        }
      }
    }
  }
}});

regGame('password',{name:'Password',icon:'🔑',tags:'Game Show',pvp:true,seats:2,
render:function(c,ctx){
  var net=(ctx&&ctx.mode==='pvp')?ctx.net:null;
  if(g1Guard(c,BANKS2.password.length>=5))return;
  var share=function(){return JSON.parse(JSON.stringify(g1PickN(BANKS2.password,5)));};
  if(net)g1Pvp(net,share,function(d,fin){playWords(d,false,fin);},function(iw,sc){g1Settle(c,iw,sc,'Password');});
  else playWords(share(),true,null);
  /* vsBot true → CPU game vs rival bot (recordWin); false → PvP solo (fin(points)) */
  function playWords(words,vsBot,fin){
    var bot=vsBot?g1Bots(1)[0]:null,wi=0,myP=0,botP=0;
    word();
    function word(){
      if(wi>=5){
        if(vsBot){
          var win=myP>botP;
          c.innerHTML='<div class="card center"><div class="big">You: '+myP+' pts<br>'+esc(bot)+': '+botP+' pts</div>'+(win?'<div class="ok">🏆 You win Password!</div>':'<div class="err">😞 '+esc(bot)+' wins.</div>')+'</div>';
          if(win){Sound.win();(async function(){await Wallet.recordWin('password');})();}
          else Sound.lose();
        }else{
          c.innerHTML='<div class="card center"><div class="big">'+myP+' pts</div><div class="muted">Waiting for opponent…</div></div>';
          fin(myP);
        }
        return;
      }
      var w=words[wi],used=0,exch=0;
      draw();
      function scoreLine(){return vsBot?'<div class="status">You: '+myP+' · '+esc(bot)+': '+botP+'</div>':'<div class="status">Points so far: '+myP+'</div>';}
      function draw(msg){
        var h='<h2>🔑 Password — word '+(wi+1)+'/5</h2><div class="card">';
        h+='<div class="muted">Clues revealed: '+used+'/3 · word worth '+SHG.passwordPoints(used)+' pts</div>';
        w.clues.forEach(function(cl,i){h+='<div class="msg">'+(i<used?esc(cl):'🔒 <span class="muted">clue '+(i+1)+' hidden</span>')+'</div>';});
        h+=scoreLine();
        if(msg)h+='<div class="msg">'+msg+'</div>';
        h+='<div class="row"><input id="g" class="grow" placeholder="Guess the password…" autocomplete="off"><button class="btn small" id="go">Guess</button></div>'
          +(used<3?'<button class="btn secondary" id="rv">🔍 Reveal clue '+(used+1)+' of 3</button>':'')
          +'</div>';
        c.innerHTML=h;
        var inp=c.querySelector('#g'),rv=c.querySelector('#rv');
        if(rv)rv.onclick=function(){used++;Sound.click();draw();};
        function guess(){
          var v=inp.value.trim();if(!v)return;Sound.click();
          if(SHG.jeopardyGrade(v,w.word)){myP+=SHG.passwordPoints(used);Sound.win();wi++;word();return;}
          if(vsBot){
            exch++;
            if(Math.random()<0.15+0.25*used){
              botP+=SHG.passwordPoints(used);Sound.lose();wi++;
              c.innerHTML='<div class="card"><div class="err">😈 '+esc(bot)+' steals it! The word was "'+esc(w.word)+'".</div><button class="btn" id="nx">Next word</button></div>';
              c.querySelector('#nx').onclick=function(){Sound.click();word();};return;
            }
            if(exch>=8){wi++;
              c.innerHTML='<div class="card"><div class="muted">Nobody got it — the word was "'+esc(w.word)+'".</div><button class="btn" id="nx">Next word</button></div>';
              c.querySelector('#nx').onclick=function(){Sound.click();word();};return;
            }
            Sound.lose();draw('❌ Wrong! '+esc(bot)+' misses too — reveal a clue or try again.');
          }else{Sound.lose();draw('❌ Wrong — reveal another clue or try again.');}
        }
        c.querySelector('#go').onclick=guess;
        inp.addEventListener('keydown',function(e){if(e.key==='Enter')guess();});
      }
    }
  }
}});

  <script>
/* ===== GAMES2 (injected) ===== */
/*__PURE_START__*/
/* Hush Music Show Games — part 2: 8 game-show games (pure helpers, DOM-free). */
var SHG = (typeof SHG!=='undefined')?SHG:{};
/* Question banks load from a separate part file; guard so this part works standalone. */
var BANKS2 = (typeof BANKS2!=='undefined')?BANKS2:{chase:[],weakestlink:[],v100:[],fifthgrader:[],hollywood:{celebClues:[],wordBank:[],quickFire:[]},pyramid:[],whatsmline:{questions:[],occupations:[]}};

/* ---------- shared pure utils ---------- */
SHG.norm=function(s){ return String(s==null?'':s).toLowerCase().trim().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); };
SHG.lev=function(a,b){
  a=SHG.norm(a); b=SHG.norm(b);
  if(a===b) return 0;
  var m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  var d=[],i,j;
  for(i=0;i<=m;i++){ d[i]=[i]; }
  for(j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++){ for(j=1;j<=n;j++){ d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); } }
  return d[m][n];
};
SHG.fuzzy=function(guess,answer){
  var g=SHG.norm(guess), a=SHG.norm(answer);
  if(!g||!a) return false;
  if(g===a) return true;
  if(a.indexOf(g)>=0||g.indexOf(a)>=0) return true;
  var tol=Math.max(1,Math.floor(a.length/6));
  return SHG.lev(g,a)<=tol;
};
SHG.pickN=function(arr,n,rng){
  rng=rng||Math.random;
  var a=(arr||[]).slice(),i,j,t;
  for(i=a.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a.slice(0,Math.max(0,Math.min(n|0,a.length)));
};
SHG.money=function(v){
  if(v==null||isNaN(v)) return '?';
  if(v<1) return Math.round(v*100)+'¢';
  return '$'+Math.round(v).toLocaleString('en-US');
};

/* ---------- DEAL OR NO DEAL ---------- */
SHG.dealCaseValues=function(){ return [0.01,1,5,10,25,50,75,100,200,300,400,500,750,1000,5000,10000,25000,50000,75000,100000,200000,300000,400000,500000,750000,1000000]; };
SHG.dealShuffle=function(rng){
  rng=rng||Math.random;
  var v=SHG.dealCaseValues(),i,j,t;
  for(i=v.length-1;i>0;i--){ j=Math.floor(rng()*(i+1)); t=v[i]; v[i]=v[j]; v[j]=t; }
  return v;
};
SHG.dealRoundOpens=function(){ return [6,5,4,3,2,1,1,1,1]; };
SHG.dealOfferFactors=function(){ return [0.35,0.5,0.6,0.7,0.8,0.9,1.0]; };
SHG.bankerOffer=function(remaining,round){
  if(!remaining||!remaining.length) return 0;
  var sum=0,i;
  for(i=0;i<remaining.length;i++) sum+=remaining[i];
  var ev=sum/remaining.length;
  var f=SHG.dealOfferFactors();
  var factor=f[Math.min(Math.max(round|0,0),f.length-1)];
  var offer=ev*factor;
  if(offer<100) return Math.round(offer);
  if(offer<1000) return Math.round(offer/10)*10;
  if(offer<10000) return Math.round(offer/100)*100;
  return Math.round(offer/1000)*1000;
};

/* ---------- PRESS YOUR LUCK ---------- */
SHG.pressluckSpin=function(rng){
  rng=rng||Math.random;
  var r=rng();
  if(r<0.16) return {type:'whammy'};
  if(r<0.24) return {type:'bigbucks',amount:5000};
  var amounts=[100,150,200,250,300,400,500,750,1000,1500,2000];
  return {type:'cash',amount:amounts[Math.floor(rng()*amounts.length)]};
};
SHG.pressluckStartSpins=function(){ return 3; };
SHG.pressluckSimBot=function(spins,rng){
  rng=rng||Math.random;
  var bank=0,wham=0,s=spins,out=false;
  while(s>0&&!out){
    s--;
    var r=SHG.pressluckSpin(rng);
    if(r.type==='whammy'){ bank=0; wham++; if(wham>=4) out=true; }
    else { bank+=r.amount; if(r.type==='bigbucks') s++; }
  }
  return {bank:bank,wham:wham,out:out};
};

/* ---------- PYRAMID ---------- */
SHG.pyramidScore=function(correct,total){ return Math.max(0,correct|0); };
SHG.pyramidBotScore=function(rng){ rng=rng||Math.random; return 4+Math.floor(rng()*4); };
SHG.pyramidNorm=function(entry){
  var e=entry||{};
  var title=e.title||e.subject||e.category||e.topic||'Mystery List';
  var raw=e.items||e.words||e.clues||e.list||e.pairs||[];
  var items=raw.map(function(it){
    if(typeof it==='string'){ var w=it.trim(); return {clue:'Starts with "'+w.charAt(0).toUpperCase()+'" · '+w.length+' letters',answer:w}; }
    if(Array.isArray(it)) return {clue:String(it[0]||''),answer:String(it[1]||'')};
    it=it||{};
    return {clue:String(it.clue||it.hint||it.q||it.question||''),answer:String(it.answer||it.word||it.a||'')};
  }).filter(function(x){ return !!x.answer; });
  return {title:String(title),items:items};
};

/* ---------- WEAKEST LINK ---------- */
SHG.weakestLinkBank=function(chain){
  var L=[0,1000,5000,15000,30000,60000,100000,150000,200000];
  chain=Math.max(0,Math.min(chain|0,L.length-1));
  return L[chain];
};
SHG.weakestLinkBots=function(){ return (typeof SHG.botNames==='function')?SHG.botNames(8):['Roxanne','Marcus','Priya','Dez']; };
SHG.weakestLinkBotSkill=function(rng){ rng=rng||Math.random; return 0.55+rng()*0.25; };
SHG.weakestLinkBotVote=function(team,rng){
  rng=rng||Math.random;
  var cands=team.filter(function(m){ return !m.me; });
  if(!cands.length) return null;
  cands.sort(function(a,b){ return (a.c-a.w)-(b.c-b.w); });
  var worst=cands[0], tied=cands.filter(function(m){ return (m.c-m.w)===(worst.c-worst.w); });
  return tied[Math.floor(rng()*tied.length)].n;
};

/* ---------- 1 VS 100 ---------- */
SHG.v100Tiers=function(){ return [1,1,1,1,2,2,2,3,3,3]; };
SHG.v100QuestionValue=function(tier){ return [0,1000,2500,5000][Math.min(Math.max(tier|0,1),3)]; };
SHG.v100Pick=function(bank,rng){
  rng=rng||Math.random;
  var tiers=SHG.v100Tiers(), byTier={1:[],2:[],3:[]};
  (bank||[]).forEach(function(q){ var t=Math.min(Math.max(q.tier|0||1,1),3); byTier[t].push(q); });
  var out=[];
  tiers.forEach(function(t){ var pool=byTier[t].length?byTier[t]:(bank||[]); if(pool.length) out.push(pool[Math.floor(rng()*pool.length)]); });
  return out;
};
SHG.mobEliminate=function(mobCount,questionTier,rng){
  rng=rng||Math.random;
  var acc=[0.72,0.58,0.42][Math.min(Math.max((questionTier|0)-1,0),2)];
  var wrong=0;
  for(var i=0;i<(mobCount|0);i++){ if(rng()>acc) wrong++; }
  return wrong;
};
SHG.v100MobSplit=function(tier,rng){
  rng=rng||Math.random;
  var acc=[0.72,0.58,0.42][Math.min(Math.max((tier|0)-1,0),2)];
  var c=Math.round(acc*100);
  var r1=Math.floor(rng()*(100-c)), r2=100-c-r1;
  return [c,r1,r2];
};

/* ---------- 5TH GRADER ---------- */
SHG.fifthGraderLadder=function(){ return [1000,2000,5000,10000,25000]; };
SHG.fifthGraderNorm=function(bank){
  var out=[];
  (bank||[]).forEach(function(e){
    e=e||{};
    var grade=e.grade||e.g||1;
    var choices=e.choices||e.options||[];
    var correct=(e.correct!=null)?e.correct:((e.answer!=null)?choices.indexOf(e.answer):0);
    out.push({grade:grade|0||1, subject:String(e.subject||e.category||'General'),
      q:String(e.q||e.question||''), choices:choices.map(String), correct:Math.max(0,correct|0)});
  });
  return out.filter(function(x){ return x.q&&x.choices.length>=2&&x.grade>=1&&x.grade<=5; });
};
SHG.fifthGraderForGrade=function(normed,grade,rng){
  rng=rng||Math.random;
  var pool=normed.filter(function(x){ return x.grade===(grade|0); });
  if(!pool.length) return null;
  return pool[Math.floor(rng()*pool.length)];
};

/* ================= shared DOM helpers (game-show part) ================= */
function shgGuard(ok,msg){
  if(!ok){ toast(msg||'Question bank is still loading — try again in a bit'); return true; }
  return false;
}
function shgQuizData(room){
  if(!room) return null;
  if(room.quiz!==undefined) return room.quiz;
  if(room.quizData!==undefined) return room.quizData;
  var s=room.state;
  if(s){ if(s.items!==undefined) return s.items; if(s.quiz!==undefined) return s.quiz; if(s.quizData!==undefined) return s.quizData; }
  return null;
}
function shgMyUid(){ return (typeof Auth!=='undefined'&&Auth.user)?Auth.user.uid:null; }
/* QuizPVP flow: host shares content, everyone plays solo, scores submitted, winner settled. */
function shgPvp(net,opt){
  var st={data:null,submitted:false,settled:false,started:false};
  function maybeStart(room){
    if(st.started) return;
    var d=st.data||shgQuizData(room)||shgQuizData(net.room);
    if(d){ st.started=true; st.data=d; opt.onData(d); }
  }
  function checkDone(room){
    if(st.settled||!st.submitted||!room) return;
    var done=false;
    try{ done=QuizPVP.allDone(room.state, room.seats||[]); }catch(e){}
    if(done){
      st.settled=true;
      var w=null;
      try{ w=QuizPVP.winnerUid(room.state?room.state.scores:null); }catch(e){}
      var iWon=!!w&&!!shgMyUid()&&w===shgMyUid();
      try{ opt.onSettle(iWon,room,w); }catch(e){}
      try{ Net.push({status:'done'}); }catch(e2){}
      try{ Voice.leave(); }catch(e3){}
    }
  }
  net.onUpdate(function(room){
    if(!room) return;
    if(room.shgNeedQuiz&&net.isHost()&&st.data){
      try{ QuizPVP.hostSet(net,st.data); }catch(e){ try{ net.push({quiz:st.data,status:'playing'}); }catch(e2){} }
      return;
    }
    maybeStart(room); checkDone(room);
  });
  if(net.isHost()){
    var data=opt.share();
    st.data=data;
    try{ QuizPVP.hostSet(net,data); }catch(e){ try{ net.push({quiz:data,status:'playing'}); }catch(e2){} }
  }
  maybeStart(net.room);
  if(!net.isHost()){
    setTimeout(function(){ if(!st.started){ try{ net.push({shgNeedQuiz:1}); }catch(e){} } },900);
    setTimeout(function(){ if(!st.started){ try{ net.push({shgNeedQuiz:1}); }catch(e){} } },3500);
  }
  return {
    submit:function(){
      if(st.submitted) return;
      st.submitted=true;
      var p=null;
      try{ p=opt.submitPayload(); }catch(e){}
      var sc=(p&&typeof p==='object')?(+p.score||0):(+p||0);
      try{ QuizPVP.submit(net, sc); }catch(e2){ toast('Score submit failed'); }
    }
  };
}
async function shgAward(iWon){ try{ await QuizPVP.award(iWon); }catch(e){} }
function shgPayLoad(score){ return {score:score,uid:shgMyUid(),name:(typeof Auth!=='undefined'&&Auth.user)?Auth.user.username:'?'}; }
function shgResultBanner(el,iWon,w,winMsg,loseMsg){
  if(!el) return;
  if(w&&shgMyUid()&&w!==shgMyUid()&&!iWon){ el.innerHTML='<div class="status"><span class="err">'+loseMsg+'</span></div>'; }
  else if(iWon){ el.innerHTML='<div class="status"><span class="ok">'+winMsg+'</span></div>'; }
  else { el.innerHTML='<div class="status"><span class="muted">🤝 It\'s a tie!</span></div>'; }
}
function shgQBtn(label,fn,cls){
  var b=document.createElement('button');
  b.className='btn small '+(cls||''); b.style.margin='4px';
  b.innerHTML=label;
  b.onclick=function(){ Sound.click(); fn(); };
  return b;
}
