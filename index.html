regGame('pyramid',{name:'The $100,000 Pyramid',icon:'🔺',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){
  ctx=ctx||{mode:'cpu'}; var net=(ctx.mode==='pvp')?ctx.net:null; var isNet=!!(net&&net.room);
  if(shgGuard(BANKS2.pyramid&&BANKS2.pyramid.length>=3,'Pyramid word lists are still loading')) return;
  var S=null, pvpCtl=null, py, timer=null;
  c.innerHTML='<h2>🔺 The $100,000 Pyramid</h2><div class="muted">Winner\'s Circle: guess all 7 words from the clues — 60 seconds per list!</div><div id="py"></div>';
  py=c.querySelector('#py');
  function pickLists(){
    return (BANKS2.pyramid||[]).map(SHG.pyramidNorm).filter(function(l){ return l.items.length>=7; })
      .slice(0,3).map(function(l){ return {title:l.title,items:l.items.slice(0,7)}; });
  }
  function start(shared){
    stopTimer();
    S={lists:shared.lists,li:0,ci:0,correct:0,total:0,botTotal:0,time:60,done:false};
    playList();
  }
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function hud(){
    return '<div class="row"><div class="grow center">List '+(S.li+1)+'/'+S.lists.length+'</div>'
      +'<div class="grow center">⏱ <b id="tLeft">'+S.time+'</b>s</div>'
      +'<div class="grow center">✅ <b>'+S.correct+'</b>/'+S.lists[S.li].items.length+'</div>'
      +'<div class="grow center">Total: <b>'+S.total+'</b></div></div>';
  }
  function playList(){
    var L=S.lists[S.li];
    S.ci=0; S.correct=0; S.time=60;
    drawQ();
    timer=setInterval(function(){
      S.time--;
      var t=py.querySelector('#tLeft'); if(t) t.textContent=S.time;
      if(S.time<=0){ stopTimer(); endList(); }
    },1000);
  }
  function drawQ(){
    if(S.done) return;
    var L=S.lists[S.li];
    if(S.ci>=L.items.length){ endList(); return; }
    var it=L.items[S.ci];
    py.innerHTML=hud()
      +'<div class="card"><div class="muted center">Things that are…</div><h3 class="center">'+esc(L.title)+'</h3>'
      +'<div class="center" style="font-size:15px;margin:10px 0">Clue '+(S.ci+1)+': <b>'+esc(it.clue)+'</b></div>'
      +'<div class="row"><input id="pAns" class="grow" placeholder="Type the word…" autocomplete="off" autocapitalize="off">'
      +'<button class="btn small" id="pGo">Guess</button>'
      +'<button class="btn small secondary" id="pSkip">Skip</button></div>'
      +'<div class="status" id="pMsg"></div></div>';
    var inp=py.querySelector('#pAns'); inp.focus();
    function guess(){
      var g=inp.value;
      if(!g.trim()) return;
      if(SHG.fuzzy(g,it.answer)){
        S.correct++; Sound.beep(880,.1); S.ci++; drawQ();
      } else {
        Sound.beep(200,.15,'sawtooth');
        py.querySelector('#pMsg').innerHTML='<span class="err">Not quite — try again or skip.</span>';
        inp.select();
      }
    }
    py.querySelector('#pGo').onclick=guess;
    inp.onkeydown=function(e){ if(e.key==='Enter') guess(); };
    py.querySelector('#pSkip').onclick=function(){ Sound.click(); S.ci++; drawQ(); };
  }
  function endList(){
    stopTimer();
    var bot=SHG.pyramidBotScore();
    S.botTotal+=bot; S.total+=S.correct;
    var doneLists=S.li+1;
    if(doneLists>=S.lists.length){ S.done=true; drawDone(); return; }
    py.innerHTML=hud()+'<div class="card center"><div class="muted">List complete!</div>'
      +'<div>You: <b>'+S.correct+'</b> — Computer: <b>'+bot+'</b></div>'
      +'<button class="btn" id="pNext" style="margin-top:10px">Next list ▶</button></div>';
    py.querySelector('#pNext').onclick=function(){ Sound.click(); S.li++; playList(); };
  }
  async function drawDone(){
    stopTimer();
    py.innerHTML='<div class="card center"><div class="muted">Winner\'s Circle complete!</div>'
      +'<div class="big">You: <b>'+S.total+'</b>'+(isNet?'':' vs Computer: <b>'+S.botTotal+'</b>')+'</div><div id="pyRes"></div></div>';
    var res=py.querySelector('#pyRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else {
      if(S.total>=S.botTotal){
        Sound.win();
        res.innerHTML='<div class="status"><span class="ok">🎉 You win the Winner\'s Circle, '+S.total+' to '+S.botTotal+'!</span></div>';
        await Wallet.recordWin('pyramid');
      } else {
        Sound.lose();
        res.innerHTML='<div class="status"><span class="err">😞 Computer takes it, '+S.botTotal+' to '+S.total+'. Try again!</span></div>';
      }
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){ return {lists:pickLists()}; },
      onData:function(d){ start(d); },
      submitPayload:function(){ return shgPayLoad(S.total); },
      onSettle:function(iWon,room,w){
        var res=py.querySelector('#pyRes');
        shgResultBanner(res,iWon,w,
          '🎉 You win the Pyramid, '+S.total+' words!',
          '😞 Opponent guessed more words. You had '+S.total+'.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    start({lists:pickLists()});
  }
}});

/* ================= WEAKEST LINK ================= */
regGame('weakestlink',{name:'Weakest Link',icon:'🔗',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){
  ctx=ctx||{mode:'cpu'}; var net=(ctx.mode==='pvp')?ctx.net:null; var isNet=!!(net&&net.room);
  if(shgGuard(BANKS2.weakestlink&&BANKS2.weakestlink.length>=12,'Weakest Link questions are still loading')) return;
  var S=null, pvpCtl=null, wk;
  c.innerHTML='<h2>🔗 Weakest Link</h2><div class="muted">Chain correct answers, BANK before you miss — and vote off the weakest link.</div><div id="wk"></div>';
  wk=c.querySelector('#wk');
  /* ---------- CPU: full team game ---------- */
  function newTeam(){
    var t=[{n:'You',me:true,c:0,w:0,skill:1}];
    SHG.weakestLinkBots().slice(0,3).forEach(function(nm){ t.push({n:nm,me:false,c:0,w:0,skill:SHG.weakestLinkBotSkill()}); });
    return t;
  }
  function startCpu(){
    S={mode:'cpu',team:newTeam(),round:1,chain:0,roundBank:0,total:0,q:SHG.pickN(BANKS2.weakestlink,60),
      order:[],oi:0,phase:'chain',log:[],votes:{},finalQ:0,finalMe:0,finalBot:0,sudden:false,done:false,win:false};
    startRound();
  }
  function log(m){ S.log.push(m); if(S.log.length>8) S.log.shift(); }
  function nextQ(){
    var q=S.q.pop();
    if(!q){ S.q=SHG.pickN(BANKS2.weakestlink,60); q=S.q.pop(); }
    return q;
  }
  function startRound(){
    S.chain=0; S.roundBank=0; S.phase='chain'; S.votes={};
    S.order=[];
    S.team.forEach(function(m){ S.order.push(m); S.order.push(m); });
    for(var i=S.order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=S.order[i]; S.order[i]=S.order[j]; S.order[j]=t; }
    S.oi=0;
    log('— Round '+S.round+' — chain the answers!');
    drawCpu();
  }
  function ladderMini(){
    var h='<div class="center muted" style="font-size:12px">Chain: ';
    for(var i=1;i<=8;i++){ h+='<span style="color:'+(S.chain>=i?'#eab676':'#555')+'">$'+(SHG.weakestLinkBank(i)/1000)+'k </span>'; }
    return h+'</div>';
  }
  function drawCpu(){
    if(S.done){ drawCpuDone(); return; }
    var h='<div class="row"><div class="grow center">Round <b>'+S.round+'</b></div>'
      +'<div class="grow center">🏦 Total: <b style="color:#eab676">$'+S.total.toLocaleString('en-US')+'</b></div>'
      +'<div class="grow center">Round bank: <b>$'+S.roundBank.toLocaleString('en-US')+'</b></div></div>'
      +'<div class="center" style="margin:6px 0">'+S.team.map(function(m){ return '<span style="margin:0 6px;'+(m.me?'color:#eab676':'')+'">'+(m.me?'🧑':'🤖')+' '+esc(m.n)+'</span>'; }).join('')+'</div>'
      +ladderMini()
      +'<div class="card" style="min-height:60px;font-size:13px" id="wlog">'+S.log.map(esc).join('<br>')+'</div>'
      +'<div id="wplay"></div>';
    wk.innerHTML=h;
    var pl=wk.querySelector('#wplay');
    if(S.phase==='chain') drawChainTurn(pl);
    else if(S.phase==='vote') drawVote(pl);
    else if(S.phase==='final') drawFinal(pl);
  }
  function drawChainTurn(pl){
    if(S.oi>=S.order.length){ endChainRound(); return; }
    var m=S.order[S.oi];
    var q=nextQ(); S.curQ=q;
    if(m.me){
      pl.innerHTML='<div class="card"><div class="center muted">Your question — chain pays <b style="color:#eab676">$'+SHG.weakestLinkBank(S.chain+1).toLocaleString('en-US')+'</b> if right</div>'
        +'<h3>'+esc(q.q)+'</h3><div class="row"><input id="wAns" class="grow" placeholder="Your answer…" autocomplete="off">'
        +'<button class="btn small" id="wGo">Answer</button></div>'
        +'<div class="row" style="margin-top:6px"><button class="btn small secondary grow" id="wBank">🏦 BANK $'+SHG.weakestLinkBank(S.chain).toLocaleString('en-US')+'</button></div></div>';
      var inp=pl.querySelector('#wAns'); inp.focus();
      function ans(){
        var ok=SHG.fuzzy(inp.value,q.a);
        if(ok){ S.chain=Math.min(S.chain+1,8); m.c++; Sound.beep(760,.08); log('✅ You: correct — chain '+S.chain); }
        else { S.chain=0; m.w++; Sound.beep(200,.15,'sawtooth'); log('❌ You: wrong ('+q.a+') — chain reset'); }
        S.oi++; drawCpu();
      }
      pl.querySelector('#wGo').onclick=ans;
      inp.onkeydown=function(e){ if(e.key==='Enter') ans(); };
      pl.querySelector('#wBank').onclick=function(){
        if(S.chain>0){ var amt=SHG.weakestLinkBank(S.chain); S.roundBank+=amt; log('🏦 You banked $'+amt.toLocaleString('en-US')); S.chain=0; Sound.win(); }
        else toast('Nothing to bank yet');
        drawCpu();
      };
    } else {
      pl.innerHTML='<div class="card center"><div class="muted">'+esc(m.n)+' is answering…</div><h3>'+esc(q.q)+'</h3></div>';
      setTimeout(function(){
        if(S.phase!=='chain') return;
        var ok=Math.random()<m.skill;
        if(ok){ S.chain=Math.min(S.chain+1,8); m.c++; log('✅ '+m.n+': correct — chain '+S.chain); Sound.beep(660,.06); }
        else { S.chain=0; m.w++; log('❌ '+m.n+': wrong ('+q.a+') — chain reset'); }
        S.oi++; drawCpu();
      },900);
    }
  }
  function endChainRound(){
    S.total+=S.roundBank;
    log('Round '+S.round+' banked: $'+S.roundBank.toLocaleString('en-US'));
    S.round++;
    if(S.team.length>2){ S.phase='vote'; }
    else { S.phase='final'; S.finalQ=0; S.finalMe=0; S.finalBot=0; S.sudden=false; log('— HEAD TO HEAD: 5 questions each —'); }
    drawCpu();
  }
  function drawVote(pl){
    var bots=S.team.filter(function(m){ return !m.me; });
    pl.innerHTML='<div class="card"><div class="center"><b>🗳 Vote off the Weakest Link</b></div><div class="muted center">Bots vote strategically…</div><div id="vBtns" class="center"></div></div>';
    var vb=pl.querySelector('#vBtns');
    bots.forEach(function(b){
      vb.appendChild(shgQBtn('🗳 '+esc(b.n)+' <span class="muted">('+b.c+'✓/'+b.w+'✗)</span>',function(){ castVote(b.n); }));
    });
  }
  function castVote(playerPick){
    var votes={};
    S.team.forEach(function(m){ if(m.me) return; var v=SHG.weakestLinkBotVote(S.team); votes[v]=(votes[v]||0)+1; });
    votes[playerPick]=(votes[playerPick]||0)+1;
    var names=Object.keys(votes), out=names[0], best=votes[out];
    names.forEach(function(nm){ if(votes[nm]>best){ best=votes[nm]; out=nm; } });
    var tied=names.filter(function(nm){ return votes[nm]===best; });
    if(tied.length>1) out=playerPick; // player breaks ties
    log('🗳 Votes: '+names.map(function(nm){ return nm+' '+votes[nm]; }).join(', ')+' → '+out+' is out');
    if(out==='You'){ S.done=true; S.win=false; drawCpu(); return; }
    S.team=S.team.filter(function(m){ return m.n!==out; });
    toast(out+' was voted off!');
    Sound.lose();
    startRound();
  }
  function drawFinal(pl){
    var bot=S.team.filter(function(m){ return !m.me; })[0];
    if(!bot){ S.done=true; S.win=true; drawCpu(); return; }
    if(S.finalQ>=5&&!S.sudden){
      if(S.finalMe>S.finalBot){ S.done=true; S.win=true; drawCpu(); return; }
      if(S.finalMe<S.finalBot){ S.done=true; S.win=false; drawCpu(); return; }
      S.sudden=true; log('— SUDDEN DEATH —');
    }
    var q=nextQ(); S.curQ=q;
    pl.innerHTML='<div class="card"><div class="center"><b>'+(S.sudden?'⚡ SUDDEN DEATH':'🎯 Head-to-head '+(Math.min(S.finalQ,4)+1)+'/5')+'</b> vs '+esc(bot.n)+'</div>'
      +'<div class="center">You '+S.finalMe+' — '+S.finalBot+' '+esc(bot.n)+'</div>'
      +'<h3>'+esc(q.q)+'</h3><div class="row"><input id="wAns" class="grow" placeholder="Your answer…" autocomplete="off">'
      +'<button class="btn small" id="wGo">Answer</button></div></div>';
    var inp=pl.querySelector('#wAns'); inp.focus();
    function ans(){
      var ok=SHG.fuzzy(inp.value,q.a);
      if(ok){ S.finalMe++; Sound.beep(880,.1); } else Sound.beep(200,.15,'sawtooth');
      var bq=nextQ();
      var bok=Math.random()<bot.skill;
      if(bok) S.finalBot++;
      log('You '+(ok?'✅':'❌')+' ('+q.a+') · '+bot.n+' '+(bok?'✅':'❌')+' ('+bq.a+')');
      S.finalQ++;
      if(S.sudden&&(S.finalMe!==S.finalBot)){ S.done=true; S.win=S.finalMe>S.finalBot; drawCpu(); return; }
      drawCpu();
    }
    pl.querySelector('#wGo').onclick=ans;
    inp.onkeydown=function(e){ if(e.key==='Enter') ans(); };
  }
  async function drawCpuDone(){
    wk.innerHTML='<div class="card center"><div class="muted">Game over</div>'
      +'<div class="big" style="color:#eab676">$'+S.total.toLocaleString('en-US')+' banked</div>'
      +'<div class="status">'+(S.win?'<span class="ok">🎉 You are NOT the weakest link — you win!</span>':'<span class="err">😞 You are the weakest link. Goodbye!</span>')+'</div></div>';
    Sound[S.win?'win':'lose']();
    if(S.win) await Wallet.recordWin('weakestlink');
  }
  /* ---------- PVP: solo chain sprint on shared questions ---------- */
  function startPvp(shared){
    S={mode:'pvp',qs:shared.qs,qi:0,chain:0,total:0,done:false};
    drawPvp();
  }
  function drawPvp(){
    if(S.done){ drawPvpDone(); return; }
    var h='<div class="row"><div class="grow center">Question <b>'+(S.qi+1)+'/'+S.qs.length+'</b></div>'
      +'<div class="grow center">🏦 Banked: <b style="color:#eab676">$'+S.total.toLocaleString('en-US')+'</b></div></div>'
      +ladderMini()
      +'<div class="card"><h3>'+esc(S.qs[S.qi].q)+'</h3>'
      +'<div class="row"><input id="wAns" class="grow" placeholder="Your answer…" autocomplete="off">'
      +'<button class="btn small" id="wGo">Answer</button></div>'
      +'<div class="row" style="margin-top:6px"><button class="btn small secondary grow" id="wBank">🏦 BANK $'+SHG.weakestLinkBank(S.chain).toLocaleString('en-US')+'</button></div></div>';
    wk.innerHTML=h;
    var inp=wk.querySelector('#wAns'); inp.focus();
    function ans(){
      var q=S.qs[S.qi];
      if(SHG.fuzzy(inp.value,q.a)){ S.chain=Math.min(S.chain+1,8); Sound.beep(760,.08); }
      else { S.chain=0; Sound.beep(200,.15,'sawtooth'); toast('Wrong — '+q.a); }
      S.qi++;
      drawPvp();
    }
    wk.querySelector('#wGo').onclick=ans;
    inp.onkeydown=function(e){ if(e.key==='Enter') ans(); };
    wk.querySelector('#wBank').onclick=function(){
      if(S.chain>0){ S.total+=SHG.weakestLinkBank(S.chain); S.chain=0; Sound.win(); }
      else toast('Nothing to bank yet');
      drawPvp();
    };
  }
  async function drawPvpDone(){
    wk.innerHTML='<div class="card center"><div class="muted">Chain sprint complete!</div>'
      +'<div class="big" style="color:#eab676">$'+S.total.toLocaleString('en-US')+'</div><div id="wRes"><div class="muted">Waiting for opponent...</div></div></div>';
    pvpCtl.submit();
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){ return {qs:SHG.pickN(BANKS2.weakestlink,10)}; },
      onData:function(d){ startPvp(d); },
      submitPayload:function(){ return shgPayLoad(S.total); },
      onSettle:function(iWon,room,w){
        var res=wk.querySelector('#wRes');
        shgResultBanner(res,iWon,w,
          '🎉 You win the Weakest Link sprint with $'+S.total.toLocaleString('en-US')+'!',
          '😞 Opponent banked more. You had $'+S.total.toLocaleString('en-US')+'.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    startCpu();
  }
}});

regGame('1v100',{name:'1 vs 100',icon:'💯',tags:'Game Show',pvp:true,seats:2,

    return '<div class="row"><div class="grow center">Q <b>'+(S.i+1)+'/'+S.qs.length+'</b></div>'

  }
  function draw(){
    if(S.done){ drawDone(); return; }
    var q=S.qs[S.i];
    var h=hud()
      +'<div class="card"><div class="muted">'+tierLabel(q.tier)+' — worth $'+(SHG.v100QuestionValue(q.tier)*(S.dbl?2:1)).toLocaleString('en-US')+' per mob member'+(S.dbl?' (DOUBLED!)':'')+'</div>'

    var hp=mv.querySelector('#hPoll');
    if(hp) hp.onclick=function(){ S.helps.poll=0; var sp=SHG.v100MobSplit(q.tier); Sound.click();
      hm.innerHTML='📊 Mob poll: <b>'+sp[0]+'%</b> say "'+esc(q.choices[q.correct])+'", '+sp[1]+'% / '+sp[2]+'% split the others.'; draw._h=true; draw2(); };
    var ha=mv.querySelector('#hAsk');

      hm.innerHTML='🎤 '+esc(names[0])+': "I\'m going with <b>'+esc(q.choices[q.correct])+'</b>."<br>🎤 '+esc(names[1])+': "Nah, it\'s <b>'+esc(q.choices[w])+'</b>, trust me."'; draw2(); };

    var msg=mv.querySelector('#helpMsg')?mv.querySelector('#helpMsg').innerHTML:'';

    var nm=mv.querySelector('#helpMsg'); if(nm) nm.innerHTML=msg;
  }
  function answer(i){
    var q=S.qs[S.i];
    if(i===q.correct){
      var n=SHG.mobEliminate(S.mob,q.tier);
      S.mob-=n; S.elim+=n; S.survived++;
      var gain=n*SHG.v100QuestionValue(q.tier)*(S.dbl?2:1);
      S.win+=gain; S.dbl=false;
      Sound.win();
      toast('Correct! '+n+' mob members out (+$'+gain.toLocaleString('en-US')+')');
      if(S.mob<=0){ S.mob=0; S.done=true; draw(); return; }
      S.i++;
      if(S.i>=S.qs.length){ S.done=true; }
      draw();

      S.lost=true; S.done=true; Sound.lose(); draw();
    }
  }
  async function drawDone(){
    var h='<div class="card center">';
    if(S.mob<=0&&!S.lost){ h+='<div class="big">👥💥</div><div class="ok" style="font-size:18px">YOU BEAT THE ENTIRE MOB!</div>'; }
    else if(S.lost){ h+='<div class="muted">Wrong answer! The mob survives.</div>'; }
    else { h+='<div class="muted">You survived all 10 questions!</div><div class="ok" style="font-size:18px">🎉 Last one standing!</div>'; }
    h+='<div class="muted">Questions survived: '+S.survived+'/10 · Mob eliminated: '+S.elim+'</div>'
      +'<div class="big" style="color:#eab676">$'+S.win.toLocaleString('en-US')+'</div><div id="mRes"></div></div>';
    mv.innerHTML=h;
    var res=mv.querySelector('#mRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else {
      var pts=Math.max(1,Math.round(S.win/1000));
      if(!S.lost||S.win>0){ await Wallet.add(pts,'1v100'); }
      if(!S.lost){
        Sound.win();
        res.innerHTML='<div class="status"><span class="ok">🎉 You win $'+S.win.toLocaleString('en-US')+'! (+'+pts+' pts)</span></div>';
        await Wallet.recordWin('1v100');
      } else {
        res.innerHTML='<div class="status"><span class="err">😞 Out — but you keep '+pts+' pts from $'+S.win.toLocaleString('en-US')+'.</span></div>';
      }
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){ return {qs:SHG.v100Pick(BANKS2.v100)}; },
      onData:function(d){ start(d); },
      submitPayload:function(){ return shgPayLoad(S.survived*10000+S.elim); },
      onSettle:function(iWon,room,w){
        var res=mv.querySelector('#mRes');
        shgResultBanner(res,iWon,w,
          '🎉 You go further against the mob — you win!',
          '😞 Opponent went further against the mob.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    start({qs:SHG.v100Pick(BANKS2.v100)});
  }
}});

regGame('fifthgrader',{name:'Are You Smarter Than a 5th Grader',icon:'🎒',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){
  ctx=ctx||{mode:'cpu'}; var net=(ctx.mode==='pvp')?ctx.net:null; var isNet=!!(net&&net.room);
  if(shgGuard(BANKS2.fifthgrader&&BANKS2.fifthgrader.length>=5,'5th Grader questions are still loading')) return;
  var S=null, pvpCtl=null, fg;
  c.innerHTML='<h2>🎒 Are You Smarter Than a 5th Grader?</h2><div class="muted">Climb grades 1–5. Drop out anytime and keep your winnings!</div><div id="fg"></div>';
  fg=c.querySelector('#fg');
  var LAD=SHG.fifthGraderLadder();
  function normQs(){ return SHG.fifthGraderNorm(BANKS2.fifthgrader); }
  function start(shared){
    S={qs:shared.qs,grade:1,win:0,cheats:{peek:1,copy:1,save:1},phase:'subject',cur:null,done:false,dropped:false,peeked:false};
    draw();
  }
  function hud(){
    return '<div class="row"><div class="grow center">Grade <b>'+S.grade+'</b>/5</div>'
      +'<div class="grow center">💰 Winnings: <b style="color:#eab676">$'+S.win.toLocaleString('en-US')+'</b></div></div>'
      +'<div class="center muted" style="font-size:12px">Ladder: '+LAD.map(function(v,i){ return '<span style="color:'+(S.win>=v?'#eab676':'#555')+'">$'+(v/1000)+'k</span>'; }).join(' · ')+'</div>'
      +'<div class="center muted" style="font-size:12px">Cheats: 👀 Peek('+(S.cheats.peek)+') 📋 Copy('+(S.cheats.copy)+') 💾 Save('+(S.cheats.save)+')</div>';
  }
  function draw(){
    if(S.done){ drawDone(); return; }
    var h=hud();
    if(S.phase==='subject'){
      var subs={};
      S.qs.forEach(function(q){ if(q.grade===S.grade) subs[q.subject]=1; });
      var list=Object.keys(subs);
      h+='<div class="card center"><div class="muted">Pick your '+S.grade+(S.grade===1?'st':S.grade===2?'nd':S.grade===3?'rd':'th')+'-grade subject:</div><div id="subs"></div></div>';
      fg.innerHTML=h;
      var sb=fg.querySelector('#subs');
      if(!list.length){ fg.innerHTML=h+'<div class="err center">No questions for this grade.</div>'; S.done=true; return; }
      list.forEach(function(su){
        sb.appendChild(shgQBtn('📚 '+esc(su),function(){ pickQ(su); }));
      });
    } else if(S.phase==='question'){
      var q=S.cur;
      h+='<div class="card"><div class="muted center">'+esc(q.subject)+' — Grade '+S.grade+' ($'+LAD[S.grade-1].toLocaleString('en-US')+')</div>'
        +'<h3>'+esc(q.q)+'</h3><div id="ch"></div>'
        +'<div class="row" style="margin-top:6px">'
        +'<button class="btn small secondary grow" id="cPeek" '+(S.cheats.peek?'':'disabled')+'>👀 Peek</button>'
        +'<button class="btn small secondary grow" id="cCopy" '+(S.cheats.copy?'':'disabled')+'>📋 Copy</button>'
        +'</div></div>';
      fg.innerHTML=h;
      var ch=fg.querySelector('#ch');
      q.choices.forEach(function(t,i){
        var b=shgQBtn(esc(t),function(){ answer(i); });
        b.id='ch'+i;
        if(S.peeked&&i===q.correct){ b.style.border='2px solid #eab676'; b.style.boxShadow='0 0 8px #eab676'; }
        ch.appendChild(b);
      });
      fg.querySelector('#cPeek').onclick=function(){
        if(!S.cheats.peek) return;
        S.cheats.peek=0; S.peeked=true; Sound.win();
        toast('👀 Peek: the correct answer is glowing!');
        draw();
      };
      fg.querySelector('#cCopy').onclick=function(){
        if(!S.cheats.copy) return;
        S.cheats.copy=0; Sound.win();
        toast('📋 You copied the classmate — auto-correct!');
        correct();
      };
    } else if(S.phase==='decide'){
      h+='<div class="card center"><div class="ok" style="font-size:16px">✅ Correct! You have $'+S.win.toLocaleString('en-US')+'</div>'
        +'<div class="muted">'+(S.grade>=5?'That was 5th grade!':'Drop out and keep it, or risk it all on grade '+(S.grade+1)+' ($'+LAD[S.grade].toLocaleString('en-US')+')?')+'</div>'
        +'<div class="row" style="margin-top:10px"><button class="btn secondary grow" id="gDrop">💰 DROP OUT</button>'
        +(S.grade>=5?'':'<button class="btn grow" id="gGo">▶ CONTINUE</button>')+'</div></div>';
      fg.innerHTML=h;
      fg.querySelector('#gDrop').onclick=function(){ Sound.click(); S.dropped=true; S.done=true; draw(); };
      var gg=fg.querySelector('#gGo');
      if(gg) gg.onclick=function(){ Sound.click(); S.grade++; S.phase='subject'; S.peeked=false; draw(); };
    }
  }
  function pickQ(subject){
    var pool=S.qs.filter(function(q){ return q.grade===S.grade&&q.subject===subject; });
    if(!pool.length) pool=S.qs.filter(function(q){ return q.grade===S.grade; });
    S.cur=pool[Math.floor(Math.random()*pool.length)];
    S.phase='question'; S.peeked=false;
    Sound.click(); draw();
  }
  function correct(){
    S.win=LAD[S.grade-1];
    Sound.win();
    if(S.grade>=5){ S.done=true; draw(); }
    else { S.phase='decide'; draw(); }
  }
  function answer(i){
    var q=S.cur;
    if(i===q.correct){ correct(); return; }
    if(S.cheats.save>0){
      S.cheats.save=0;
      Sound.win();
      toast('💾 SAVED! That wrong answer is forgiven.');
      correct(); return;
    }
    Sound.lose();
    toast('Wrong! The answer was: '+q.choices[q.correct]);
    S.win=0; S.done=true; draw();
  }
  async function drawDone(){
    var h='<div class="card center">';
    if(S.grade>=5&&!S.dropped&&S.win>0){
      h+='<div class="big">🎓</div><div class="ok" style="font-size:18px">You ARE smarter than a 5th grader!</div>';
    } else if(S.dropped){
      h+='<div class="muted">You dropped out with</div>';
    } else {
      h+='<div class="err" style="font-size:18px">📚 Sent back to grade school!</div><div class="muted">Wrong answer with no Save left.</div>';
    }
    h+='<div class="big" style="color:#eab676">$'+S.win.toLocaleString('en-US')+'</div><div id="fRes"></div></div>';
    fg.innerHTML=h;
    var res=fg.querySelector('#fRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else {
      var pts=Math.max(1,Math.round(S.win/1000));
      if(S.win>0){ await Wallet.add(pts,'fifthgrader'); }
      if(S.grade>=5&&S.win>0){
        res.innerHTML='<div class="status"><span class="ok">🎉 Graduation bonus! (+'+pts+' pts)</span></div>';
        await Wallet.recordWin('fifthgrader');
      } else if(S.dropped){
        res.innerHTML='<div class="status"><span class="muted">Smart move — you keep '+pts+' pts.</span></div>';
      }
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){
        var nq=normQs(), qs=[];
        for(var g=1;g<=5;g++){ var q=SHG.fifthGraderForGrade(nq,g); if(q) qs.push(q); }
        return {qs:qs};
      },
      onData:function(d){
        if(shgGuard(d.qs&&d.qs.length>=5,'Question sync failed — rejoin the room')) return;
        start(d);
      },
      submitPayload:function(){ return shgPayLoad(S.win); },
      onSettle:function(iWon,room,w){
        var res=fg.querySelector('#fRes');
        shgResultBanner(res,iWon,w,
          '🎉 You out-grade your opponent with $'+S.win.toLocaleString('en-US')+'!',
          '😞 Opponent climbed higher. You had $'+S.win.toLocaleString('en-US')+'.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    var nq0=normQs();
    if(shgGuard([1,2,3,4,5].every(function(g){ return nq0.some(function(q){ return q.grade===g; }); }),'Need questions for all 5 grades')) return;
    start({qs:nq0});
  }
}});

regGame('whatsmline',{name:"What's My Line?",icon:'🕵️',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){
  ctx=ctx||{mode:'cpu'}; var net=(ctx.mode==='pvp')?ctx.net:null; var isNet=!!(net&&net.room);
  var occs=(BANKS2.whatsmline.occupations||[]).map(SHG.wmlNormOcc).filter(function(o){ return o.name; });
  if(shgGuard(occs.length>=4,"What's My Line occupations are still loading")) return;
  var S=null, pvpCtl=null, wl;
  c.innerHTML='<h2>🕵️ What\'s My Line?</h2><div class="muted">Ask up to 10 yes/no questions, then guess the mystery occupation!</div><div id="wl"></div>';
  wl=c.querySelector('#wl');
  function start(shared){
    S={occ:shared.occ,others:shared.others,used:0,asked:{},lastA:null,done:false,won:false,panel:SHG.wmlPanel()};
    draw();
  }
  function hud(){
    return '<div class="row"><div class="grow center">Questions used: <b>'+S.used+'</b>/10</div>'
      +'<div class="grow center">Mystery guest: <b>???</b></div></div>'
      +'<div class="center muted" style="font-size:12px;margin:4px 0">🎩 Panel: '+S.panel.map(function(p){ return esc(p); }).join(' · ')+' <span class="muted">nods along…</span></div>';
  }
  function draw(){
    if(S.done){ drawDone(); return; }
    var h=hud();
    if(S.lastA){
      h+='<div class="card center"><div class="muted">'+esc(S.lastA.q)+'</div><div class="big">'+(S.lastA.a==='yes'?'<span class="ok">YES</span>':'<span class="err">NO</span>')+'</div></div>';
    }
    h+='<div class="card"><div class="muted center">Pick a question to ask:</div><div id="qlist" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center"></div></div>'
      +'<div class="center"><button class="btn" id="wGuess" style="margin-top:8px">🔍 GUESS THE OCCUPATION</button></div>';
    wl.innerHTML=h;
    var ql=wl.querySelector('#qlist');
    SHG.wmlQuestions().forEach(function(qq){
      var id=qq[0], t=qq[1];
      var b=document.createElement('button');
      b.className='btn small secondary';
      b.style.margin='2px'; b.style.fontSize='11px';
      b.textContent=(S.asked[id]?'✓ ':'')+t;
      b.disabled=!!S.asked[id]||S.used>=10;
      b.onclick=function(){ askQ(id,t); };
      ql.appendChild(b);
    });
    wl.querySelector('#wGuess').onclick=showGuess;
  }
  function askQ(id,t){
    if(S.used>=10||S.asked[id]) return;
    S.asked[id]=1; S.used++;
    var a=S.occ.answers[id]||'no';
    S.lastA={q:t,a:a};
    Sound.beep(a==='yes'?880:440,.12);
    var nod=S.panel[Math.floor(Math.random()*S.panel.length)];
    toast('🎩 '+nod+': "Hmm, interesting…"');
    draw();
    if(S.used>=10) setTimeout(function(){ if(!S.done){ toast('That was your 10th question — time to guess!'); showGuess(); } },600);
  }
  function showGuess(){
    var opts=[S.occ.name].concat(S.others);
    for(var i=opts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
    wl.innerHTML=hud()+'<div class="card center"><div class="muted">What\'s their line?</div><div id="gopts"></div>'
      +'<div class="muted" style="margin-top:8px">Score if right: <b>'+SHG.wmlScore(S.used)+'</b> (fewer questions = more points)</div></div>';
    var go=wl.querySelector('#gopts');
    opts.forEach(function(nm){
      go.appendChild(shgQBtn('💼 '+esc(nm),function(){
        if(SHG.wmlCheck(nm,S.occ.name)){ S.won=true; }
        S.done=true; Sound[S.won?'win':'lose'](); draw();
      }));
    });
  }
  async function drawDone(){
    var sc=S.won?SHG.wmlScore(S.used):0;
    wl.innerHTML='<div class="card center"><div class="muted">The mystery guest was…</div>'
      +'<div class="big">💼 '+esc(S.occ.name)+'</div>'
      +(S.won
        ? '<div class="status"><span class="ok">🎉 Correct! '+S.used+' question'+(S.used===1?'':'s')+' used — score '+sc+'!</span></div>'
        : '<div class="status"><span class="err">😞 Wrong guess — the panel stumps you!</span></div>')
      +'<div id="wRes"></div></div>';
    var res=wl.querySelector('#wRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else if(S.won){
      await Wallet.add(Math.max(1,sc),'whatsmline');
      await Wallet.recordWin('whatsmline');
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){
        var o=occs[Math.floor(Math.random()*occs.length)];
        var others=SHG.pickN(occs.filter(function(x){ return x.name!==o.name; }),3).map(function(x){ return x.name; });
        return {occ:o,others:others};
      },
      onData:function(d){ start(d); },
      submitPayload:function(){ return shgPayLoad(S.won?SHG.wmlScore(S.used):-1); },
      onSettle:function(iWon,room,w){
        var res=wl.querySelector('#wRes');
        shgResultBanner(res,iWon,w,
          '🎉 You guessed it in '+S.used+' questions — you win!',
          '😞 Opponent guessed in fewer questions.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    var o0=occs[Math.floor(Math.random()*occs.length)];
    var ot0=SHG.pickN(occs.filter(function(x){ return x.name!==o0.name; }),3).map(function(x){ return x.name; });
    start({occ:o0,others:ot0});
  }
}});

/* ================= HOLLYWOOD GAME NIGHT ================= */
regGame('hollywood',{name:'Hollywood Game Night',icon:'🎬',tags:'Game Show',pvp:true,seats:2,
render(c,ctx){
  ctx=ctx||{mode:'cpu'}; var net=(ctx.mode==='pvp')?ctx.net:null; var isNet=!!(net&&net.room);
  var hw=BANKS2.hollywood||{};
  var celebs=(hw.celebClues||[]).map(SHG.hollywoodNormCeleb).filter(function(x){ return x.name&&x.clues.length>=1; });
  var words=(hw.wordBank||[]).map(SHG.hollywoodNormWord).filter(function(x){ return !!x.word; });
  var fire=(hw.quickFire||[]).map(SHG.hollywoodNormFire).filter(function(x){ return x.q&&x.choices.length>=2; });
  if(shgGuard(celebs.length>=3&&words.length>=5&&fire.length>=5,'Hollywood Game Night content is still loading')) return;

    stopTimer();
    S={celebs:shared.celebs,words:shared.words,fire:shared.fire,phase:'celeb',ci:0,shown:1,wi:0,fi:0,score:0,time:60,done:false};
    drawCeleb();
  }
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
  function hud(phaseName){
    return '<div class="row"><div class="grow center"><b>'+phaseName+'</b></div>'
      +'<div class="grow center">⭐ Score: <b style="color:#eab676">'+S.score+'</b> / '+SHG.hollywoodTarget()+'</div></div>';
  }
  /* ---- Game 1: Celebrity Clues ---- */
  function drawCeleb(){
    if(S.ci>=S.celebs.length){ S.phase='words'; S.wi=0; S.time=60; drawWords(); return; }
    var cb=S.celebs[S.ci];
    var h=hud('🌟 Celebrity Clues '+(S.ci+1)+'/'+S.celebs.length)
      +'<div class="card"><div class="muted center">Guess the celebrity — fewer clues = more points (300/200/100)</div>';
    for(var i=0;i<S.shown&&i<cb.clues.length;i++){ h+='<div class="center" style="margin:6px 0">💡 '+esc(cb.clues[i])+'</div>'; }
    h+='<div class="row"><input id="hAns" class="grow" placeholder="Who is it?…" autocomplete="off">'
      +'<button class="btn small" id="hGo">Guess</button></div>'
      +'<div class="row" style="margin-top:6px"><button class="btn small secondary grow" id="hMore" '+(S.shown>=cb.clues.length?'disabled':'')+'>💡 Reveal another clue</button></div>'
      +'<div class="status" id="hMsg"></div></div>';
    hw2.innerHTML=h;
    var inp=hw2.querySelector('#hAns'); inp.focus();
    function guess(){
      var g=inp.value;
      if(!g.trim()) return;
      if(SHG.fuzzy(g,cb.name)){
        var pts=SHG.hollywoodCluePts(S.shown);

        toast('🌟 Correct! '+cb.name+' +'+pts);
        S.ci++; S.shown=1; drawCeleb();
      } else {
        Sound.beep(200,.15,'sawtooth');
        if(S.shown<cb.clues.length){ S.shown++; drawCeleb(); }
        else { toast('It was '+cb.name+' — no points'); S.ci++; S.shown=1; drawCeleb(); }
      }
    }
    hw2.querySelector('#hGo').onclick=guess;
    inp.onkeydown=function(e){ if(e.key==='Enter') guess(); };
    hw2.querySelector('#hMore').onclick=function(){ Sound.click(); S.shown=Math.min(S.shown+1,cb.clues.length); drawCeleb(); };

    },1000);

  function drawWordQ(){

    hw2.innerHTML=hud('🗣 In Other Words')+'<div class="card"><div class="center muted">⏱ <b id="tLeft">'+S.time+'</b>s — guess the word from the hints! (+'+SHG.hollywoodWordPts()+' each)</div>'

      +'<div class="row"><input id="hAns" class="grow" placeholder="The word is…" autocomplete="off" autocapitalize="off">'
      +'<button class="btn small" id="hGo">Guess</button>'
      +'<button class="btn small secondary" id="hSkip">Skip</button></div>'
      +'<div class="status" id="hMsg"></div></div>';
    var inp=hw2.querySelector('#hAns'); inp.focus();
    function guess(){
      var g=inp.value;
      if(!g.trim()) return;
      if(SHG.fuzzy(g,w.word)){ S.score+=SHG.hollywoodWordPts(); Sound.beep(880,.08); S.wi++; drawWordQ(); }
      else { Sound.beep(200,.12,'sawtooth'); hw2.querySelector('#hMsg').innerHTML='<span class="err">Nope — keep guessing!</span>'; inp.select(); }
    }
    hw2.querySelector('#hGo').onclick=guess;
    inp.onkeydown=function(e){ if(e.key==='Enter') guess(); };
    hw2.querySelector('#hSkip').onclick=function(){ Sound.click(); S.wi++; drawWordQ(); };
  }
  /* ---- Game 3: Quick Fire Trivia (60s) ---- */
  function drawFire(){
    S.phase='fire';
    drawFireQ();
    timer=setInterval(function(){
      S.time--;
      var t=hw2.querySelector('#tLeft'); if(t) t.textContent=S.time;
      if(S.time<=0){ stopTimer(); S.done=true; drawDone(); }
    },1000);
  }
  function drawFireQ(){
    if(S.fi>=S.fire.length){ stopTimer(); S.done=true; drawDone(); return; }
    var q=S.fire[S.fi];
    hw2.innerHTML=hud('⚡ Quick Fire')+'<div class="card"><div class="center muted">⏱ <b id="tLeft">'+S.time+'</b>s — rapid fire! (+'+SHG.hollywoodFirePts()+' each)</div>'
      +'<h3>'+esc(q.q)+'</h3><div id="ch"></div></div>';
    var ch=hw2.querySelector('#ch');
    q.choices.forEach(function(t,i){
      ch.appendChild(shgQBtn(esc(t),function(){
        if(i===q.correct){ S.score+=SHG.hollywoodFirePts(); Sound.beep(880,.06); }
        else Sound.beep(200,.1,'sawtooth');
        S.fi++; drawFireQ();
      }));
    });
  }
  async function drawDone(){
    stopTimer();
    var win=S.score>=SHG.hollywoodTarget();
    hw2.innerHTML='<div class="card center"><div class="muted">🎬 Hollywood Game Night — final score</div>'
      +'<div class="big" style="color:#eab676">'+S.score+'</div>'
      +'<div class="muted">Target: '+SHG.hollywoodTarget()+'</div><div id="hRes"></div></div>';
    var res=hw2.querySelector('#hRes');
    if(isNet){
      res.innerHTML='<div class="muted">Waiting for opponent...</div>';
      pvpCtl.submit();
    } else if(win){
      Sound.win();
      res.innerHTML='<div class="status"><span class="ok">🎉 You beat the target — Hollywood champion!</span></div>';
      await Wallet.recordWin('hollywood');
    } else {
      Sound.lose();
      res.innerHTML='<div class="status"><span class="err">😞 So close! You needed '+SHG.hollywoodTarget()+'.</span></div>';
    }
  }
  if(isNet){
    pvpCtl=shgPvp(net,{
      share:function(){
        return {celebs:SHG.pickN(celebs,3),words:SHG.pickN(words,12),fire:SHG.pickN(fire,15)};
      },
      onData:function(d){ start(d); },
      submitPayload:function(){ return shgPayLoad(S.score); },
      onSettle:function(iWon,room,w){
        var res=hw2.querySelector('#hRes');
        shgResultBanner(res,iWon,w,
          '🎉 You win Game Night with '+S.score+' points!',
          '😞 Opponent scored higher. You had '+S.score+'.');
        Sound[iWon?'win':'lose']();
        shgAward(iWon);
      }
    });
  } else {
    start({celebs:SHG.pickN(celebs,3),words:SHG.pickN(words,12),fire:SHG.pickN(fire,15)});
  }
}});

</script>
<script>
'use strict';
/* ---------------- game order & fallback meta (injected games use regGame) ---------------- */
const GAME_ORDER=['jeopardy','wheel','millionaire','price','feud','chase','matchgame','password','whatsmline','hollywood','deal','pressluck','pyramid','weakestlink','1v100','fifthgrader'];
const GAME_META={
  jeopardy:{name:'Jeopardy!',icon:'🧠',pvp:true},
  wheel:{name:'Wheel of Fortune',icon:'🎡',pvp:true},
  millionaire:{name:'Millionaire',icon:'💰',pvp:true},
  price:{name:'The Price Is Right',icon:'🏷️',pvp:true},
  feud:{name:'Family Feud',icon:'👪',pvp:true},
  chase:{name:'The Chase',icon:'🏃',pvp:true},
  matchgame:{name:'Match Game',icon:'🧩',pvp:true},
  password:{name:'Password',icon:'🔐',pvp:true},
  whatsmline:{name:"What's My Line?",icon:'❓',pvp:true},
  hollywood:{name:'Hollywood Game Night',icon:'🎬',pvp:true},
  deal:{name:'Deal or No Deal',icon:'💼',pvp:true},
  pressluck:{name:'Press Your Luck',icon:'😈',pvp:true},
  pyramid:{name:'$100,000 Pyramid',icon:'🔺',pvp:true},
  weakestlink:{name:'Weakest Link',icon:'🔗',pvp:true},
  '1v100':{name:'1 vs 100',icon:'💯',pvp:true},
  fifthgrader:{name:'5th Grader',icon:'🎒',pvp:true}
};

/* ---------------- game registry ---------------- */
const Games = {};
function regGame(id, def){ Games[id]=Object.assign({id}, def); }

/* ---------------- bet widget ---------------- */
function betWidget(container, onBet){
  let bet=25;
  container.innerHTML='<div class="muted">Your bet (points):</div><div class="betrow" id="bets"></div><button class="btn" id="placeBet">Place bet</button>';
  const bets=container.querySelector('#bets');
  const opts=[10,25,50,100,250];
  const draw=()=>{ bets.innerHTML=''; opts.forEach(o=>{ const b=document.createElement('button'); b.textContent=o; if(o===bet)b.classList.add('sel'); b.onclick=()=>{bet=o; Sound.click(); draw();}; bets.appendChild(b); }); };
  draw();
  container.querySelector('#placeBet').onclick=()=>{ try{ const amt=Wallet.bet(bet); onBet(amt); }catch(e){ toast(e.message); } };
}

function gameModesHTML(g){
  let h='<h3>Choose mode</h3><div class="row">';
  h+='<button class="btn small grow" data-m="cpu">🤖 Vs Computer</button>';
  if(g.pvp) h+='<button class="btn small grow" data-m="pvp">🌐 Vs Person</button>';
  h+='</div><div id="pvpBox"></div>';
  return h;
}
function wireModes(container, gameId, start){
  container.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    Sound.click();
    const m=b.getAttribute('data-m');
    if(m==='cpu'){ start({mode:'cpu'}); }
    else{
      const box=container.querySelector('#pvpBox');
      box.innerHTML='<div class="card"><h3>Online play</h3><div class="row"><button class="btn small grow" id="mkRoom">Create room</button><input id="joinCode" class="grow" placeholder="Code" maxlength="4" inputmode="numeric"><button class="btn small" id="doJoin">Join</button></div><div class="muted">Share the 4-digit code with your opponent. First to join plays.</div></div>';
      box.querySelector('#mkRoom').onclick=async()=>{
        const seats=(Games[gameId]&&Games[gameId].seats)||2;
        const code=await Net.create(gameId, seats);
        if(code){ box.innerHTML='<div class="turn-banner">Room code: <span class="big">'+code+'</span><br><span class="muted">Waiting for opponent...</span></div><div id="chatWrap"></div>';
          Chat.renderBox(box.querySelector('#chatWrap'), 'room-'+code);
          Net.onUpdate(()=>start({mode:'pvp', net:Net})); }
      };
      box.querySelector('#doJoin').onclick=async()=>{
        const code=box.querySelector('#joinCode').value;
        const ok=await Net.join(code);
        if(ok){ await Net.push({status:'playing'}); start({mode:'pvp', net:Net}); }
      };
    }
  });
}
// Called by every turn-based game: syncs state through the room.
function netTurn(net, state, nextTurn){
  if(net&&net.room) net.push({state:JSON.parse(JSON.stringify(state)), turn:nextTurn, status:'playing'});
}
function netInit(net, seats, initialState){
  // Host creates the initial state and broadcasts it.
  if(net.isHost()){ net.push({state:initialState, turn:0, status:'playing'}); }
}

/* ---------------- QuizPVP: simultaneous quiz PvP helper ----------------
   Both players answer the SAME question set at the same time; higher
   score wins. Usage in a game:
     QuizPVP.hostSet(net, items)      // host pushes items to the room
     ...each player plays locally...
     QuizPVP.submit(net, myScore)    // writes my score + done flag
     QuizPVP.allDone(state, seats)   // check via Net.onUpdate
     const w = QuizPVP.winnerUid(state.scores);
     await QuizPVP.award(w===Auth.user.uid);                              */
const QuizPVP = {
  hostSet(net, items){ if(net && net.isHost()) net.push({state:{items, scores:{}, done:{}}}); },
  submit(net, score){
    const u=Auth.user.uid;
    net.set('state/scores/'+u, score);
    net.set('state/done/'+u, true);
  },
  allDone(state, seats){
    if(!state || !state.done || !Array.isArray(seats)) return false;
    return seats.every(suid=>!!state.done[suid]);
  },
  winnerUid(scores){
    let best=null, bv=-Infinity;
    for(const k of Object.keys(scores||{})){ if(scores[k]>bv){ bv=scores[k]; best=k; } }
    return best; // tie → first uid wins
  },
  async award(didWin){ await Wallet.add(didWin?PVP_WIN:0, didWin?'pvp-win':'pvp-loss'); }
};

<script>
'use strict';
/* ================= VIEWS & ROUTER ================= */
let cleanup=null;
function setCleanup(fn){ if(cleanup){ try{cleanup();}catch(e){} } cleanup=fn; }
function goHome(){ setCleanup(null); Net.leave(true); Voice.leave(); show('home'); }

/* ---------- AUTH ---------- */
function showAuth(){
  setCleanup(null);
  const v=$('#view');
  v.innerHTML='<div class="card"><h2>🎙️ Welcome to Hush Music Show Games</h2><div class="muted">16 game shows · win points · challenge friends</div>'
    +(!Backend.configured()?'<div class="msg">Demo mode: accounts live on this device only. Connect Firebase in Profile → Setup for real logins, friends & online play.</div>':'')
    +'<div class="betrow" id="tabs"><button class="sel" data-t="login">Log in</button><button data-t="signup">Sign up</button><button data-t="forgot">Forgot password</button></div><div id="form"></div><div class="err" id="err"></div></div>';
  let tab='login';
  const form=()=>{ const f=v.querySelector('#form');
    if(tab==='login') f.innerHTML='<label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="go">Log in</button>';
    else if(tab==='signup') f.innerHTML='<label>Username (3-16 letters/numbers/_)</label><input id="un" maxlength="16"><label>Email</label><input id="email" type="email"><label>Password (6+ chars)</label><input id="pw" type="password" autocomplete="new-password"><button class="btn" id="go">Create account — get 1,000 ⭐ free</button>';
    else f.innerHTML='<div class="muted">We\'ll email you a reset link.</div><label>Email</label><input id="email" type="email"><button class="btn" id="go">Send reset email</button>';
    f.querySelector('#go').onclick=async()=>{
      const err=v.querySelector('#err'); err.textContent='';
      try{
        if(tab==='login'){ await Auth.login(f.querySelector('#email').value, f.querySelector('#pw').value); }
        else if(tab==='signup'){ await Auth.signup(f.querySelector('#un').value, f.querySelector('#email').value, f.querySelector('#pw').value); }
        else { await Auth.resetPassword(f.querySelector('#email').value); err.className='ok'; err.textContent='Reset email sent — check your inbox.'; return; }
        await Wallet.load(); Friends.setOnline(true); show('home');
      }catch(e){ err.className='err'; err.textContent=e.message; }
    };
  };
  v.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ tab=b.getAttribute('data-t'); Sound.click(); v.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); form(); });
  form();
}

/* ---------- HOME ---------- */
function showHome(){
  const v=$('#view');
  let h='<h2>Choose a game show</h2><div class="grid">';
  GAME_ORDER.forEach(id=>{ const g=Games[id]||GAME_META[id]||{name:id,icon:'🎲'};
    h+='<div class="gamecard" data-g="'+id+'"><div class="e">'+(g.icon||'🎲')+'</div><div class="n">'+esc(g.name||id)+'</div><div class="t">'+esc(g.tags||'Game show')+(g.pvp?' · 🌐':'')+'</div></div>'; });
  h+='</div>';
  if(Wallet.canDaily()) h+='<button class="btn" id="daily">🎁 Claim daily bonus: +'+DAILY_BONUS+' ⭐</button>';
  v.innerHTML=h;
  v.querySelectorAll('.gamecard').forEach(el=>el.onclick=()=>{ Sound.click(); showGame(el.getAttribute('data-g')); });
  const d=v.querySelector('#daily'); if(d) d.onclick=async()=>{ if(await Wallet.claimDaily()){ toast('Daily bonus claimed!'); showHome(); } };
}

/* ---------- GAME ---------- */
function showGame(id){
  const g=Games[id]||{}; const v=$('#view');
  v.innerHTML='<button class="btn small secondary" id="back">← All games</button><div id="stage"></div>';
  v.querySelector('#back').onclick=()=>goHome();
  setCleanup(()=>{ Net.leave(); });
  const meta=GAME_META[id]||{};
  const stage=v.querySelector('#stage');
  stage.innerHTML='<h2>'+(g.icon||meta.icon||'🎲')+' '+esc(g.name||meta.name||id)+'</h2><div id="modes">'+gameModesHTML(g)+'</div><div id="play"></div>';
  wireModes(stage.querySelector('#modes'), id, (ctx)=>{
    stage.querySelector('#modes').classList.add('hidden');
    const play=stage.querySelector('#play');
    if(typeof g.render!=='function'){ play.innerHTML='<div class="msg">This game show is still being built — check back soon.</div>'; return; }
    if(ctx.mode==='pvp'){
      const vb=document.createElement('button'); vb.className='btn small secondary'; vb.textContent='🎤 Join voice chat';
      vb.onclick=async()=>{ const ok=await Voice.join('shg-'+Net.room.code); if(ok){ vb.textContent='🎤 Voice on — header mic button mutes you'; vb.disabled=true; } };
      play.appendChild(vb);
      const cv=document.createElement('div'); play.appendChild(cv);
      g.render(cv, ctx); // room cleanup already registered above; don't re-register
    } else {
      setCleanup(null);
      g.render(play, ctx);
    }
    window.scrollTo(0,0);
  });
}

/* ---------- FRIENDS ---------- */
async function showFriends(){
  const v=$('#view'); v.innerHTML='<h2>👥 Friends</h2><div class="card" id="box"><div class="muted">Loading...</div></div>';
  const box=v.querySelector('#box');
  if(Backend.mode!=='firebase'){ box.innerHTML='<div class="msg">Friends need Firebase connected.<br><br>Go to <b>Profile → Setup</b>, paste your free Firebase keys, save, reload, and come back.</div>'; return; }
  const reqs=await Friends.requests();
  const list=await Friends.list();
  let h='<div class="row"><input id="fq" class="grow" placeholder="Player code (6 letters)" maxlength="6" style="text-transform:uppercase" autocapitalize="characters"><button class="btn small" id="fadd">Add</button></div>'
    +'<div class="muted">Your code: <span class="codechip">'+esc(Auth.user.code||'?')+'</span> — share it so friends can add you.</div>';
  if(reqs.length){ h+='<h3>Requests</h3>'; reqs.forEach(r=>{ h+='<div class="row"><div class="grow">'+esc(r.from)+'</div><button class="btn small" data-acc="'+r.uid+'">Accept</button><button class="btn small secondary" data-dec="'+r.uid+'">Decline</button></div>'; }); }
  h+='<h3>Your friends ('+list.length+')</h3>';
  if(!list.length) h+='<div class="muted">No friends yet — add someone by player code.</div>';
  list.forEach(f=>{ h+='<div class="row"><div class="grow">'+(f.online?'🟢':'⚪')+' '+esc(f.username)+'</div><button class="btn small secondary" data-chat="'+f.uid+'" data-nm="'+esc(f.username)+'">Chat</button></div>'; });
  h+='<div id="dm"></div>';
  box.innerHTML=h;
  box.querySelector('#fadd').onclick=async()=>{
    const u=await Friends.findByCode(box.querySelector('#fq').value);
    if(!u){ toast('No player with that code'); return; }
    if(u.uid===Auth.user.uid){ toast('That\'s you!'); return; }
    await Friends.sendRequest(u.uid);
  };
  box.querySelectorAll('[data-acc]').forEach(b=>b.onclick=async()=>{ await Friends.accept(b.getAttribute('data-acc')); showFriends(); });
  box.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{ await Friends.decline(b.getAttribute('data-dec')); showFriends(); });
  box.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{
    const other=b.getAttribute('data-chat'); const nm=b.getAttribute('data-nm');
    const path='dm-'+[Auth.user.uid,other].sort().join('-');
    box.querySelector('#dm').innerHTML='<h3>Chat with '+esc(nm)+'</h3><div id="dmbox"></div>';
    Chat.renderBox(box.querySelector('#dmbox'), path);
  });
}

/* ---------- LEADERBOARD ---------- */
async function showBoard(){
  const v=$('#view'); v.innerHTML='<h2>🏆 Top 50</h2><div class="card"><div class="muted">Loading...</div></div>';

      databaseURL:v.querySelector('#fb_databaseURL').value.trim(), projectId:v.querySelector('#fb_projectId').value.trim(),

/* ---------- router ---------- */
function show(name){
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.toggle('active', b.getAttribute('data-v')===name));
  if(name==='home') showHome();
  else if(name==='friends') showFriends();
  else if(name==='leaderboard') showBoard();
  else if(name==='profile') showProfile();
}
document.querySelectorAll('#bottomNav button').forEach(b=>b.onclick=()=>{ Sound.ensure(); if(!Auth.user){ showAuth(); return; } if(b.getAttribute('data-v')!=='home') setCleanup(null),Net.leave(true),Voice.leave(); show(b.getAttribute('data-v')); });

/* ---------- init ---------- */
(async function(){
  await Backend.init();
  Auth.onAuth(async u=>{
    if(u&&u.uid){
      Auth.user=u;
      await Wallet.load();
      Friends.setOnline(true);
      show('home');
    } else showAuth();
  });
  window.addEventListener('beforeunload', ()=>Friends.setOnline(false));
})();
